<title>Balanza — macro-gebalanceerde maaltijden, uitgerekend met NEVO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Balanza "Fris" — zelfde lichte palet als de app */
  :root {
    box-sizing: border-box;
    color-scheme: light;
    --bg: #F3F7F4;
    --surface: #FFFFFF;
    --ink: #0F2219;
    --muted: #55685D;
    --label: #6B7D72;
    --line: #DCE6E0;
    --accent: #14543A;
    --accent-ink: #FFFFFF;
    --accent2: #1F8A55;
    --mint: #DDF3E5;
    --mint-ink: #17643A;
    --lemon: #FFF2D2;
    --lemon-ink: #8A5A10;
    --dark-panel: #12392A;
    --dark-panel-ink: #F2FAF5;
    --bar-eiwit: #1F8A55; --bar-kh: #E3A22F; --bar-vet: #3C8DCB;
    --kh-bg: #FDF1D8; --eiwit-bg: #E3F4EA; --vet-bg: #E3EFF8;
    --glow1: rgba(120, 214, 160, 0.42); --glow2: rgba(255, 220, 110, 0.26); --lines: rgba(20, 84, 58, 0.12);
    --shadow: 0 8px 22px rgba(15, 55, 38, 0.08);
    --shadow-lg: 0 24px 60px -28px rgba(15, 55, 38, 0.35);
    --radius: 18px;
  }
  * { box-sizing: inherit; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Public Sans", sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  img, svg { max-width: 100%; }
  a { color: inherit; }
  h1, h2, h3 { font-family: "Fraunces", serif; font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.15; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 480px) { .wrap { padding: 0 16px; } }

  #bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background: radial-gradient(70% 38% at 90% -2%, var(--glow1), transparent 70%),
                radial-gradient(55% 30% at 4% 10%, var(--glow2), transparent 72%), var(--bg); }
  #bgfx svg { position: absolute; left: 50%; top: -330px; width: 900px; height: 900px; transform: translateX(-50%);
    -webkit-mask-image: linear-gradient(180deg, #000 34%, transparent 62%); mask-image: linear-gradient(180deg, #000 34%, transparent 62%); }
  #bgfx circle { fill: none; stroke: var(--lines); stroke-width: 1.2; }

  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(243, 247, 244, 0.82);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid rgba(20, 84, 58, 0.08); padding-top: env(safe-area-inset-top, 0px); }
  header.nav {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px; max-width: 1080px; margin: 0 auto; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
  .brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--dark-panel); display: grid; place-items: center; }
  .brand span { font-family: "Fraunces", serif; font-weight: 700; font-size: 21px; color: var(--ink); }
  .tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .tabs button { background: none; border: 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--accent-ink); background: var(--accent); }
  .nav-links { display: flex; align-items: center; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; padding: 12px 22px; text-decoration: none; border: 1px solid transparent; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px -12px rgba(20, 84, 58, 0.7); }
  .btn-primary:hover { background: #0F4630; }
  .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-text { background: none; color: var(--accent); padding: 12px 10px; }
  .btn-light { background: #8FE3B4; color: var(--dark-panel); }
  @media (max-width: 640px) { .btn-text { display: none; } header.nav .btn-primary { padding: 10px 16px; font-size: 14px; } }
  @media (max-width: 600px) { .tabs { order: 3; width: 100%; justify-content: space-between; } .tabs button { padding: 7px 10px; font-size: 13px; } }

  .hero { padding-top: 52px; padding-bottom: 48px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; }
  @media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } .hero { padding-top: 32px; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--mint-ink); background: var(--mint); padding: 6px 12px; border-radius: 999px; margin: 0 0 18px; }
  .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
  .hero h1 { font-size: clamp(36px, 5.6vw, 58px); line-height: 1.04; max-width: 15ch; }
  .hero h1 em { font-style: italic; color: var(--accent2); }
  .hero p.lede { font-size: 18px; line-height: 1.65; color: var(--muted); max-width: 46ch; margin: 20px 0 28px; }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-note { margin-top: 16px; font-size: 13.5px; color: var(--label); }

  .demo-wrap { position: relative; }
  .demo-card { position: relative; background: var(--surface); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-lg); border: 1px solid rgba(20, 84, 58, 0.06); }
  .demo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .demo-card h3 { font-size: 21px; margin-bottom: 4px; }
  .demo-sub { font-size: 13px; color: var(--muted); }
  .score { flex-shrink: 0; width: 72px; height: 72px; position: relative; }
  .score svg { width: 72px; height: 72px; transform: rotate(-90deg); }
  .score b { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Fraunces", serif; font-size: 19px; line-height: 1; }
  .score small { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--label); letter-spacing: .04em; text-transform: uppercase; }
  .bars { margin: 22px 0 18px; display: grid; gap: 10px; }

  .bar .track { height: 8px; border-radius: 99px; background: #EDF3EF; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; }
  .bar .val { text-align: right; color: var(--muted); font-weight: 500; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .tag-nevo { background: var(--mint); color: var(--mint-ink); }
  .tag-time { background: var(--lemon); color: var(--lemon-ink); }
  .demo-ing { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .demo-ing div { padding: 3px 0; }
  .demo-source { font-size: 12px; color: var(--label); margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .float-chip { position: absolute; z-index: 2; background: var(--dark-panel); color: var(--dark-panel-ink); font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: 14px; box-shadow: var(--shadow-lg); }
  .float-chip b { color: #8FE3B4; }
  .float-a { top: -18px; right: 18px; }
  .float-b { bottom: -18px; left: -14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .float-b b { color: var(--accent2); }
  @media (max-width: 480px) { .float-b { left: 8px; } .demo-ing { grid-template-columns: 1fr; } }

  section { padding: 48px 0; }
  .lead-block h2 { font-size: clamp(26px, 3.6vw, 36px); max-width: 22ch; }
  .lead-block p { color: var(--muted); font-size: 16.5px; max-width: 58ch; margin-top: 14px; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 26px; }

  .diffs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 24px; }

  .diff:nth-child(3n+2)::before { background: var(--bar-kh); }
  .diff:nth-child(3n)::before { background: var(--bar-vet); }
  .diff h3 { font-size: 19px; margin-bottom: 8px; }
  .diff p { margin: 0; color: var(--muted); font-size: 15px; }

  .feature-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }

  .feature { background: var(--surface); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }

  .feature:nth-child(3n+2) .ic { background: var(--lemon); color: var(--lemon-ink); }
  .feature:nth-child(3n) .ic { background: var(--vet-bg); color: #24689C; }
  .feature h4 { font-family: "Public Sans", sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 6px; }

  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 24px; }
  @media (max-width: 640px) { .price-grid { grid-template-columns: 1fr; } }
  .price-card { background: var(--surface); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .price-card.highlight { background: var(--dark-panel); color: var(--dark-panel-ink); border-color: transparent; box-shadow: var(--shadow-lg); }
  .price-card.highlight .price-list, .price-card.highlight .price-amount span, .price-card.highlight .price-alt { color: #B8D6C5 !important; }
  .price-card h3 { font-size: 20px; }
  .price-amount { font-family: "Fraunces", serif; font-size: 38px; margin: 10px 0 4px; }
  .price-amount span { font-family: "Public Sans", sans-serif; font-size: 14px; font-weight: 500; color: var(--muted); }
  .price-list { list-style: none; margin: 18px 0 0; padding: 0; font-size: 14.5px; color: var(--muted); }
  .price-list li { padding: 6px 0 6px 26px; position: relative; }
  .price-list li::before { content: ""; position: absolute; left: 0; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--mint);
    -webkit-mask: none; box-shadow: inset 0 0 0 5px var(--mint), inset 0 0 0 16px var(--accent2); }
  .price-card.highlight .price-list li::before { box-shadow: inset 0 0 0 5px rgba(143,227,180,.25), inset 0 0 0 16px #8FE3B4; background: transparent; }

  .final-cta { padding-top: 24px; padding-bottom: 64px; }
  .cta-panel { background: var(--dark-panel); color: var(--dark-panel-ink); border-radius: 28px; padding: 48px 32px; text-align: center; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
  .cta-panel::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 85% 0%, rgba(143, 227, 180, 0.28), transparent 70%), radial-gradient(50% 70% at 10% 100%, rgba(255, 220, 110, 0.16), transparent 70%); }
  .cta-panel > * { position: relative; }
  .cta-panel h2 { font-size: clamp(26px, 4vw, 40px); max-width: 20ch; margin: 0 auto 10px; }
  .cta-panel p { color: #B8D6C5; margin: 0 auto 24px; max-width: 46ch; }
  @media (max-width: 480px) { .cta-panel { padding: 36px 20px; border-radius: 22px; } }

  footer { border-top: 1px solid var(--line); padding: 28px 0 calc(28px + env(safe-area-inset-bottom, 0px)); }
  .foot-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .foot-row > div:first-child { max-width: 70ch; }
  .foot-row a { color: var(--accent); font-weight: 600; }
</style>
</head>
