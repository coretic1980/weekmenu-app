<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Balanza — Beheer</title>
<style>
  :root {
    --bg: #0A0805; --surface: #17130C; --surface2: #1F1A10; --ink: #F3EEE2; --muted: #A89A80;
    --line: #2E2517; --accent: #C6A15B; --accent-ink: #14110C; --good: #7FB77E; --bad: #E08787; --warn: #E3B35C;
    --shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #F7F2E7; --surface: #FFFDF8; --surface2: #F1EBDD; --ink: #10182B; --muted: #6B6152; --line: #E1D8C4;
      --accent: #8E6A1F; --accent-ink: #FFFDF8; --good: #2F7A3A; --bad: #B23A3A; --warn: #A56A00; --shadow: 0 10px 40px rgba(0,0,0,.18); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.45; }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; margin: 0; letter-spacing: .01em; }
  h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 14px; font-family: inherit; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .right { text-align: right; }
  .hidden { display: none !important; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top-row { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; justify-content: space-between; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  nav.tabs { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav.tabs button { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; padding: 10px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; border-radius: 0; font-weight: 500; }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card > h3:first-child, .card > .card-head:first-child { margin-top: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .num { font-family: "Fraunces", Georgia, serif; font-size: 27px; line-height: 1.15; margin: 2px 0; }
  .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat .sub { font-size: 12px; color: var(--muted); }
  .stat.warn .num { color: var(--warn); } .stat.bad .num { color: var(--bad); }
  .two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .bar { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); }
  .bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); }

  button, .btn { font: inherit; padding: 9px 15px; border-radius: 8px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
  button.ghost:hover:not(:disabled) { border-color: var(--muted); }
  button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  button.danger.solid { background: var(--bad); color: #fff; }
  button.small { padding: 5px 10px; font-size: 12px; }
  button.link { background: none; border: none; color: var(--accent); padding: 0; font-weight: 500; text-decoration: underline; }
  input, select, textarea { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=checkbox] { width: auto; }
  textarea { min-height: 72px; resize: vertical; }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-grid { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar > * { width: auto; }
  .toolbar input[type=search], .toolbar input.grow { flex: 1 1 220px; min-width: 180px; }
  .toolbar select { flex: 0 1 auto; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; background: transparent; color: var(--ink); font-weight: 500; cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.good { color: var(--good); border-color: var(--good); } .badge.bad { color: var(--bad); border-color: var(--bad); }
  .badge.warn { color: var(--warn); border-color: var(--warn); } .badge.accent { color: var(--accent); border-color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface); white-space: nowrap; }
  th button { background: none; border: none; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; padding: 0; cursor: pointer; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; } tbody tr.clickable:hover { background: var(--surface2); }
  tr.off td { opacity: .6; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  td .sub { display: block; color: var(--muted); font-size: 12px; }
  td.err { color: var(--bad); max-width: 320px; word-break: break-word; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 34px 10px; }
  .errorbox { background: rgba(224,135,135,.12); border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .notebox { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .notebox.warn { border-color: var(--warn); }
  .bulkbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--accent); border-radius: 10px; margin-bottom: 12px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 320px; font-size: 12px; margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; }
  details summary { cursor: pointer; color: var(--muted); }

  .switch { position: relative; width: 44px; height: 24px; padding: 0; border-radius: 999px; background: var(--line); border: 1px solid var(--line); flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: left .15s; }
  .switch.on { background: var(--good); border-color: var(--good); } .switch.on::after { left: 22px; background: #fff; }
  .switch:disabled { opacity: .5; }
  .module { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .module:last-child { border-bottom: none; }
  .module .name { font-weight: 600; } .module .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .chart .bar-ok { fill: var(--accent); } .chart .bar-err { fill: var(--bad); } .chart .axis { stroke: var(--line); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px; overflow-y: auto; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 560px; padding: 20px; }
  .modal.wide { max-width: 760px; }
  .modal h2 { margin-bottom: 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .secret { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; margin: 6px 0 4px; }
  .secret code { flex: 1; word-break: break-all; font-size: 14px; }
  #toastRoot { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 28px); max-width: 460px; pointer-events: none; }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; pointer-events: auto; }
  .toast.bad { background: var(--bad); color: #fff; }
  .login-wrap { max-width: 380px; margin: 0 auto; padding: 90px 20px; }
  .spin { text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
(function () {
  "use strict";

  // =====================================================================================
  // Basis: een kleine DOM-bouwer (nooit innerHTML met gegevens: alles gaat als tekst), API, hulpjes
  // =====================================================================================
  var TOKEN_KEY = "balanza_admin_token";
  var token = null;
  try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}

  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    if (typeof c === "string" || typeof c === "number") { el.appendChild(document.createTextNode(String(c))); return; }
    el.appendChild(c);
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "style") Object.keys(v).forEach(function (s) { el.style[s] = v[s]; });
      else if (k.indexOf("aria-") === 0) el.setAttribute(k, v);
      else el[k] = v;
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function svg(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function clear(el) { el.innerHTML = ""; return el; }
  function byId(id) { return document.getElementById(id); }

  function api(path, opts) {
    opts = opts || {};
    var headers = {};
    if (token) headers["Authorization"] = "Bearer " + token;
    if (opts.body !== undefined) headers["Content-Type"] = "application/json";
    return fetch(path, { method: opts.method || "GET", headers: headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401 && path !== "/api/admin/login") {
          signOutLocal("Je sessie is verlopen. Log opnieuw in.");
          var e401 = new Error("Sessie verlopen."); e401.status = 401; e401.silent = true; throw e401;
        }
        if (!res.ok) { var e = new Error((data && data.message) || ("Fout " + res.status)); e.status = res.status; e.data = data; throw e; }
        return data;
      });
    });
  }
  function qs(obj) {
    var parts = [];
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (v === "" || v === null || v === undefined || v === false) return;
      parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
    });
    return parts.length ? "?" + parts.join("&") : "";
  }
  // Bestanden ophalen met de beheerderssessie (een gewone link kan die niet meesturen).
  function downloadFile(path, fallbackName) {
    return fetch(path, { headers: token ? { Authorization: "Bearer " + token } : {} }).then(function (res) {
      if (res.status === 401) { signOutLocal("Je sessie is verlopen. Log opnieuw in."); throw new Error("Sessie verlopen."); }
      if (!res.ok) throw new Error("Downloaden mislukt (" + res.status + ").");
      var cd = res.headers.get("content-disposition") || "";
      var m = cd.match(/filename="([^"]+)"/);
      return res.blob().then(function (blob) { return { blob: blob, name: m ? m[1] : fallbackName }; });
    }).then(function (f) {
      var url = URL.createObjectURL(f.blob);
      var a = h("a", { href: url, download: f.name });
      document.body.appendChild(a); a.click();
      if (a.parentNode && a.parentNode.removeChild) a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    });
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { toast("Gekopieerd."); }, function () { toast("Kopiëren lukte niet.", "bad"); });
    return Promise.resolve(toast("Kopiëren wordt niet ondersteund in deze browser.", "bad"));
  }
  function debounce(fn, ms) { var t = null; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

  // ---- opmaak van tijd en getallen ----
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("nl-NL", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function fmtDay(iso) {
    var d = new Date(iso); if (isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
  }
  function relTime(iso) {
    if (!iso) return "nooit";
    var t = Date.parse(iso); if (isNaN(t)) return "—";
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 45) return "zojuist";
    if (s < 3600) return Math.round(s / 60) + " min geleden";
    if (s < 86400) return Math.round(s / 3600) + " uur geleden";
    if (s < 86400 * 14) return Math.round(s / 86400) + " dagen geleden";
    return fmtDate(iso);
  }
  function fmtMs(ms) { if (ms === undefined || ms === null) return "—"; return ms >= 1000 ? (ms / 1000).toFixed(1).replace(".", ",") + " s" : ms + " ms"; }
  function fmtUptime(sec) {
    var d = Math.floor(sec / 86400), hh = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
    return (d ? d + " d " : "") + (hh || d ? hh + " u " : "") + m + " min";
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function shortUid(uid) { return uid ? (uid.length > 14 ? uid.slice(0, 8) + "…" + uid.slice(-4) : uid) : "—"; }

  // =====================================================================================
  // Herbruikbare onderdelen
  // =====================================================================================
  function card(title) {
    var el = h("div", { class: "card" });
    if (title) el.appendChild(h("div", { class: "card-head" }, h("h3", { text: title })));
    for (var i = 1; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function badge(text, kind) { return h("span", { class: "badge" + (kind ? " " + kind : ""), text: text }); }
  function field(label, input, hint) { return h("label", { class: "field" }, h("span", { text: label }), input, hint ? h("div", { class: "hint", text: hint }) : null); }
  function errorBox(msg) { return h("div", { class: "errorbox", role: "alert", text: msg }); }
  function spinner(text) { return h("div", { class: "spin", text: text || "Laden…" }); }
  function empty(text) { return h("div", { class: "empty", text: text }); }
  function select(options, value, onchange, label) {
    var el = h("select", { "aria-label": label });
    options.forEach(function (o) {
      var opt = h("option", { value: o[0], text: o[1] });
      if (String(o[0]) === String(value)) opt.selected = true;
      el.appendChild(opt);
    });
    el.value = value;
    el.onchange = function () { onchange(el.value); };
    return el;
  }
  function switchBtn(on, onchange, label, disabled) {
    var btn = h("button", { class: "switch" + (on ? " on" : ""), type: "button", role: "switch", "aria-checked": on ? "true" : "false", "aria-label": label, disabled: !!disabled });
    btn.onclick = function () { onchange(!on); };
    return btn;
  }
  function pager(pg, goto, label) {
    var info = h("span", { class: "muted", text: pg.total === 0 ? "Geen resultaten" : plural(pg.total, label[0], label[1]) + " · pagina " + pg.page + " van " + pg.pages });
    var prev = h("button", { class: "ghost small", text: "‹ Vorige", disabled: pg.page <= 1 }), next = h("button", { class: "ghost small", text: "Volgende ›", disabled: pg.page >= pg.pages });
    prev.onclick = function () { goto(pg.page - 1); }; next.onclick = function () { goto(pg.page + 1); };
    var first = h("button", { class: "ghost small", text: "«", disabled: pg.page <= 1, "aria-label": "Eerste pagina" }), last = h("button", { class: "ghost small", text: "»", disabled: pg.page >= pg.pages, "aria-label": "Laatste pagina" });
    first.onclick = function () { goto(1); }; last.onclick = function () { goto(pg.pages); };
    return h("div", { class: "pager" }, info, h("div", { class: "row" }, first, prev, next, last));
  }
  function table(headers, rows, opts) {
    opts = opts || {};
    var thead = h("thead", {}, h("tr", {}, headers.map(function (x) { return x; })));
    var tbody = h("tbody", {}, rows);
    return h("div", { class: "table-wrap" }, h("table", {}, thead, tbody));
  }
  function th(label, cls) { return h("th", { class: cls || "", text: label }); }

  // ---- meldingen en dialogen ----
  function toast(msg, kind) {
    var root = byId("toastRoot");
    var t = h("div", { class: "toast" + (kind ? " " + kind : ""), role: "status", text: msg });
    root.appendChild(t);
    setTimeout(function () { if (t.parentNode && t.parentNode.removeChild) t.parentNode.removeChild(t); else t.style.display = "none"; }, kind === "bad" ? 6000 : 3200);
  }
  var closeModalFn = null;
  function closeModal() { clear(byId("modalRoot")); closeModalFn = null; }
  function openModal(title, bodyNodes, actionNodes, wide) {
    closeModal();
    var box = h("div", { class: "modal" + (wide ? " wide" : ""), role: "dialog", "aria-modal": "true", "aria-label": title }, h("h2", { text: title }), bodyNodes, actionNodes && actionNodes.length ? h("div", { class: "actions" }, actionNodes) : null);
    var overlay = h("div", { class: "overlay" }, box);
    overlay.onclick = function (e) { if (e && e.target === overlay) closeModal(); };
    byId("modalRoot").appendChild(overlay);
    closeModalFn = closeModal;
    return closeModal;
  }
  // Bevestigen; met 'typeToConfirm' moet je eerst een woord of adres exact intypen (voor onomkeerbare acties).
  function confirmDialog(o) {
    return new Promise(function (resolve) {
      var input = o.typeToConfirm ? h("input", { type: "text", id: "confirmInput", placeholder: o.typeToConfirm, autocomplete: "off", "aria-label": "Typ ter bevestiging" }) : null;
      var ok = h("button", { class: o.danger ? "danger solid" : "", text: o.confirmLabel || "Bevestigen", id: "confirmOk", disabled: !!o.typeToConfirm });
      var cancel = h("button", { class: "ghost", text: "Annuleren", id: "confirmCancel" });
      if (input) input.oninput = function () { ok.disabled = input.value !== o.typeToConfirm; };
      ok.onclick = function () { closeModal(); resolve(input ? input.value : true); };
      cancel.onclick = function () { closeModal(); resolve(false); };
      openModal(o.title, [h("p", { text: o.message, style: { marginTop: "0" } }), input ? field("Typ “" + o.typeToConfirm + "” om te bevestigen", input) : null], [cancel, ok]);
    });
