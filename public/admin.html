<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balanza — Admin</title>
<style>
  :root {
    --bg: #0A0805; --surface: #17130C; --ink: #F3EEE2; --muted: #A89A80;
    --line: #2E2517; --accent: #C6A15B; --accent-ink: #14110C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Public Sans", -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 { font-family: "Fraunces", serif; font-size: 20px; margin: 0; letter-spacing: 0.02em; }
  .muted { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 14px;
  }
  input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 15px; margin-bottom: 10px;
  }
  button {
    padding: 11px 18px; border-radius: 8px; border: none; background: var(--accent);
    color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .error { color: #E08787; font-size: 13px; margin-bottom: 10px; }
  .stats { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 120px; }
  .stat .num { font-family: "Fraunces", serif; font-size: 24px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .user-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .user-row:last-child { border-bottom: none; }
  .user-row:hover { opacity: 0.8; }
  .uid { font-size: 13px; font-family: monospace; }
  .badge { font-size: 12px; color: var(--muted); }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
  #loginView, #dashView { display: none; }
</style>
</head>
<body>

<div id="loginView">
  <main style="max-width:380px; padding-top:80px;">
    <div class="card">
      <h1 style="margin-bottom:16px;">Balanza — Admin</h1>
      <div id="loginError" class="error" style="display:none;"></div>
      <input id="pwInput" type="password" placeholder="Wachtwoord" autofocus>
      <button id="loginBtn" style="width:100%;">Inloggen</button>
    </div>
  </main>
</div>

<div id="dashView">
  <header>
    <h1>Balanza — Admin</h1>
    <button class="ghost" id="logoutBtn">Uitloggen</button>
  </header>
  <main>
    <div class="stats" id="statsRow"></div>

    <div id="userListCard" class="card">
      <div class="section-label">Gebruikers</div>
      <div id="userList"><div class="muted">Laden…</div></div>
    </div>

    <div id="userDetailCard" class="card" style="display:none;">
      <button class="ghost" id="backBtn" style="margin-bottom:12px;">&larr; Terug naar lijst</button>
      <div id="userDetailBody"></div>
    </div>
  </main>
</div>

<script>
  var token = null;
  try { token = sessionStorage.getItem("balanza_admin_token"); } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    if (token) headers["Authorization"] = "Bearer " + token;
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok) throw new Error(data.message || ("HTTP " + res.status));
          return data;
        });
      });
  }

  function showLogin() {
    document.getElementById("loginView").style.display = "block";
    document.getElementById("dashView").style.display = "none";
  }
  function showDash() {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashView").style.display = "block";
    loadStats();
    loadUsers();
  }

  document.getElementById("loginBtn").onclick = function () {
    var pw = document.getElementById("pwInput").value;
    var errEl = document.getElementById("loginError");
    errEl.style.display = "none";
    api("/api/admin/login", { method: "POST", body: { password: pw } }).then(function (data) {
      token = data.token;
      try { sessionStorage.setItem("balanza_admin_token", token); } catch (e) {}
      showDash();
    }).catch(function (e) {
      errEl.textContent = e.message;
      errEl.style.display = "block";
    });
  };
  document.getElementById("pwInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("logoutBtn").onclick = function () {
    token = null;
    try { sessionStorage.removeItem("balanza_admin_token"); } catch (e) {}
    showLogin();
  };
  document.getElementById("backBtn").onclick = function () {
    document.getElementById("userDetailCard").style.display = "none";
    document.getElementById("userListCard").style.display = "block";
  };

  function loadStats() {
    api("/api/admin/stats").then(function (data) {
      var row = document.getElementById("statsRow");
      row.innerHTML = "";
      [
        ["Gebruikers", data.totalUsers],
        ["Generaties vandaag", data.usageToday + " / " + data.dailyCap]
      ].forEach(function (pair) {
        var el = document.createElement("div");
        el.className = "stat";
        el.innerHTML = '<div class="num">' + pair[1] + '</div><div class="label">' + pair[0] + '</div>';
        row.appendChild(el);
      });
    }).catch(function (e) {
      if (e.message.indexOf("unauthorized") > -1 || e.message.indexOf("Niet ingelogd") > -1) showLogin();
    });
  }

  function loadUsers() {
    var listEl = document.getElementById("userList");
    listEl.innerHTML = '<div class="muted">Laden…</div>';
    api("/api/admin/users").then(function (data) {
      if (!data.users.length) {
        listEl.innerHTML = '<div class="muted">Nog geen gebruikers.</div>';
        return;
      }
      listEl.innerHTML = "";
      data.users.forEach(function (u) {
        var row = document.createElement("div");
        row.className = "user-row";
        row.innerHTML =
          '<div><div class="uid">' + u.uid + '</div>' +
          '<div class="badge">' + (u.goal || "geen doel") + (u.dietStyle ? " · " + u.dietStyle : "") + '</div></div>' +
          '<div class="badge">' + u.dishCount + ' gerechten · ' + u.plannedWeekCount + ' weken</div>';
        row.onclick = function () { openUserDetail(u.uid); };
        listEl.appendChild(row);
      });
    }).catch(function (e) {
      if (e.message.indexOf("unauthorized") > -1 || e.message.indexOf("Niet ingelogd") > -1) showLogin();
      else listEl.innerHTML = '<div class="error">' + e.message + '</div>';
    });
  }

  function openUserDetail(uid) {
    document.getElementById("userListCard").style.display = "none";
    var card = document.getElementById("userDetailCard");
    card.style.display = "block";
    var body = document.getElementById("userDetailBody");
    body.innerHTML = '<div class="muted">Laden…</div>';
    api("/api/admin/users/" + encodeURIComponent(uid)).then(function (data) {
      body.innerHTML =
        '<h2 style="font-family:Fraunces,serif; margin-top:0;">' + uid + '</h2>' +
        '<div class="section-label">Voorkeuren</div><pre>' + escapeHtml(JSON.stringify(data.prefs, null, 2)) + '</pre>' +
        '<div class="section-label">Opgeslagen gerechten</div><pre>' + escapeHtml(JSON.stringify(data.dishes, null, 2)) + '</pre>' +
        '<div class="section-label">Geplande weken</div><pre>' + escapeHtml(JSON.stringify(data.plannedWeeks, null, 2)) + '</pre>';
    }).catch(function (e) {
      body.innerHTML = '<div class="error">' + e.message + '</div>';
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  if (token) showDash(); else showLogin();
</script>
</body>
</html>
