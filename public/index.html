<style>

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1610;
      --surface: #16201A;
      --ink: #F2F4F8;
      --muted: #A7B0C2;
      --label: #8892A6;
      --line: #263A2C;
      --accent: #4F7FD1;
      --accent-ink: #0B1120;
      --accent2: #FF9E45;
      --accent2-ink: #2A1500;
      --tag-kh-bg: #1B2C4A; --tag-kh-ink: #B9CDEE;
      --tag-eiwit-bg: #232A3D; --tag-eiwit-ink: #C9CEDC;
      --tag-vet-bg: #3A2A15; --tag-vet-ink: #FFCB93;
      --dark-panel: #060B16;
      --dark-panel-ink: #F2F4F8;

  }
  :root[data-theme="dark"] {
    --bg: #0E1610;

    --ink: #F2F4F8;
    --muted: #A7B0C2;

  .shop-check {

  .variant-btn { flex: 1; min-width: 140px; }
  .tilerow { display: flex; gap: 12px; }
  .tile {

<body>
<div id="app"></div>
<div id="busyBar" class="busybar" aria-hidden="true"><div class="busybar-fill"></div></div>
<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <div id="confirmMsg" class="confirm-msg"></div>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" class="ghost-btn">Annuleren</button>
      <button id="confirmOkBtn" class="primary-btn">Bevestigen</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  function getUserId() {
    var id;
    try { id = localStorage.getItem("weekmenu_uid"); } catch (e) { id = null; }
    if (!id) {
      id = "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem("weekmenu_uid", id); } catch (e) {}
    }
    return id;
  }
  var USER_ID = getUserId();

  function parseErrorFromResponse(res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      var e = new Error(body.message || ("HTTP " + res.status));
      e.code = body.code || (res.status === 429 ? "rate_limited" : "error");
      return e;
    });
  }

  window.claude = {
    use: function (name) {
      if (name === "sample") {
        return Promise.resolve({
          json: function (prompt) {
            return fetch("/api/generate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt: prompt })
            }).then(function (res) {
              if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
              return res.json();
            }).then(function (data) { return data.result; });
          }
        });
      }
      if (name === "db") {
        return Promise.resolve({
          doc: function (path) {
            return {
              get: function () {
                return fetch("/api/db?path=" + encodeURIComponent(path)).then(function (res) {
                  if (!res.ok) return { exists: false, data: function () { return undefined; } };
                  return res.json();
                }).then(function (body) {
                  return { exists: !!body.exists, data: function () { return body.value; } };
                });
              },
              set: function (value) {
                return fetch("/api/db", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ path: path, value: value })
                }).then(function (res) {
                  if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
                });
              }
            };
          }
        });
      }
      if (name === "user") {
        return Promise.resolve({ id: function () { return Promise.resolve(USER_ID); } });
      }
      if (name === "downloads") {
        return Promise.resolve({
          save: function (opts) {
            try {
              var url = URL.createObjectURL(opts.data);
              var a = document.createElement("a");
              a.href = url;
              a.download = opts.filename || "download";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
              return Promise.resolve();
            } catch (e) {
              return Promise.reject(e);
            }
          }
        });
      }
      return Promise.resolve(null);
    }
  };
})();
</script>
<script>
(function () {
  "use strict";

  var WEEKS = [];

  WEEKS.forEach(function (w) {
    w.days.forEach(function (d) {
      if (!d.prep && !d.mealType) { d.mealType = "Diner"; }
    });
  });

  var pendingConfirmAction = null;
  function askConfirm(message, onConfirm) {
    pendingConfirmAction = onConfirm;
    var overlay = document.getElementById("confirmOverlay");
    var msgEl = document.getElementById("confirmMsg");
    if (msgEl) msgEl.textContent = message;
    if (overlay) overlay.classList.add("active");
  }
  function closeConfirm() {
    pendingConfirmAction = null;
    var overlay = document.getElementById("confirmOverlay");
    if (overlay) overlay.classList.remove("active");
  }
  (function wireConfirmOverlay() {
    var cancelBtn = document.getElementById("confirmCancelBtn");
    var okBtn = document.getElementById("confirmOkBtn");
    if (cancelBtn) cancelBtn.onclick = function () { closeConfirm(); };
    if (okBtn) okBtn.onclick = function () {
      var fn = pendingConfirmAction;
      closeConfirm();
      if (fn) fn();
    };
  })();

  var state = { view: "weeks", weekId: null, dayId: null, stepIndex: 0, generating: false, genError: null, genSuccess: null, variating: false, variateError: null, planWeekId: null, planSlotKey: null, planDayName: null, dayServings: null, dayBackView: null, dayBackWeekId: null, dayBackDayName: null };
  var busyCount = 0;
  function busyStart() {
    busyCount++;
    var el = document.getElementById("busyBar");
    if (el) el.classList.add("active");
  }
  function busyEnd() {
    busyCount = Math.max(0, busyCount - 1);
    if (busyCount === 0) {
      var el = document.getElementById("busyBar");
      if (el) el.classList.remove("active");
    }
  }
  var completed = {};
  var shoppingChecked = {};
  var plannedWeeks = [];
  var libraryFilter = "Alle";
  var libraryGoalFilter = "Alle";
  var shoppingViewMode = "week";
  var timerInterval = null;
  var timerRemaining = 0;
  var timerRunning = false;

  var PLAN_DAYS = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag", "Zondag"];
  var PLAN_MEALS = ["Ontbijt", "Lunch", "Diner", "Snack"];
  var PLAN_SLOTS = ["Ontbijt", "Snack na ontbijt", "Lunch", "Snack na lunch", "Diner", "Snack na diner"];
  var SLOT_TO_MEALTYPE = {
    "Ontbijt": "Ontbijt",
    "Snack na ontbijt": "Snack",
    "Lunch": "Lunch",
    "Snack na lunch": "Snack",
    "Diner": "Diner",
    "Snack na diner": "Snack"
  };

  var CUISINES = ["Italiaans", "Aziatisch", "Mediterraan", "Midden-Oosters", "Nederlands", "Mexicaans"];
  var FLAVORS = ["Fris", "Romig", "Pittig", "Kruidig", "Hartig", "Umami"];
  var LEVELS = ["Basic", "Home-style", "Gastronomisch"];
  var EQUIPMENT = ["Gasfornuis", "Oven", "Airfryer", "Vleesgrill"];

  var GENDERS = ["Man", "Vrouw", "Anders"];
  var ACTIVITY_LEVELS = ["Zittend", "Licht actief", "Gemiddeld actief", "Zeer actief"];

  var prefs = {
    cuisines: [],
    flavors: [],
    level: "Home-style",
    equipment: EQUIPMENT.slice(),
    exclude: "",
    count: 5,
    mealTypes: ["Diner"],
    gender: "",
    heightCm: "",
    weightKg: "",
    age: "",
    activityLevel: "Gemiddeld actief",
    goal: "Onderhoud"
  };

  function findWeek(id) { return WEEKS.filter(function (w) { return w.id === id; })[0]; }
  function findDay(week, id) { return week.days.filter(function (d) { return d.id === id; })[0]; }

  function extractDishArray(result) {
    if (Array.isArray(result)) return result;
    if (result && typeof result === "object") {
      var keys = Object.keys(result);
      for (var i = 0; i < keys.length; i++) {
        if (Array.isArray(result[keys[i]]) && result[keys[i]].length) return result[keys[i]];
      }
    }
    return null;
  }

  function findDayAnywhere(dayId) {
    for (var i = 0; i < WEEKS.length; i++) {
      var w = WEEKS[i];
      for (var j = 0; j < w.days.length; j++) {
        if (w.days[j].id === dayId) return { week: w, day: w.days[j] };
      }
    }
    return null;
  }

  function resolveAssignedDish(assigned) {
    var wk = findWeek(assigned.weekId);
    var day = wk ? findDay(wk, assigned.dayId) : null;
    if (day) return { week: wk, day: day };
    var found = findDayAnywhere(assigned.dayId);
    if (found) { assigned.weekId = found.week.id; return found; }
    return null;
  }

  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;

  var GOALS = ["Onderhoud", "Vetverlies (spierbehoud)", "Cutting", "Spieropbouw (lean bulk)", "Atleet (prestatiegericht)"];
  var GOAL_TARGETS = {
    "Onderhoud": { kh: 33, eiwit: 33, vet: 34 },
    "Vetverlies (spierbehoud)": { kh: 30, eiwit: 40, vet: 30 },
    "Cutting": { kh: 25, eiwit: 45, vet: 30 },
    "Spieropbouw (lean bulk)": { kh: 40, eiwit: 30, vet: 30 },
    "Atleet (prestatiegericht)": { kh: 45, eiwit: 25, vet: 30 }
  };
  var GOAL_DESCRIPTIONS = {
    "Onderhoud": "gelijke verdeling (±33% koolhydraten/eiwit/vet) om gewicht te behouden",
    "Vetverlies (spierbehoud)": "hoger eiwit, lager koolhydraten en vet, voor vetverlies met behoud van spiermassa (streef naar 30% koolhydraten / 40% eiwit / 30% vet)",
    "Cutting": "zeer hoog eiwit, laag koolhydraten, voor een agressiever calorietekort met maximaal spierbehoud (streef naar 25% koolhydraten / 45% eiwit / 30% vet)",
    "Spieropbouw (lean bulk)": "hoger koolhydraten en eiwit voor spieropbouw met een lichte overschot (streef naar 40% koolhydraten / 30% eiwit / 30% vet)",
    "Atleet (prestatiegericht)": "hoger koolhydraten voor trainings- en wedstrijdbrandstof, met voldoende eiwit voor herstel (streef naar 45% koolhydraten / 25% eiwit / 30% vet)"
  };

  function goalTarget() {
    return GOAL_TARGETS[prefs.goal] || GOAL_TARGETS["Onderhoud"];
  }

  function computeBalance(khPct, eiwitPct, vetPct, target) {
    var t = target || goalTarget();
    var maxDev = Math.max(Math.abs(khPct - t.kh), Math.abs(eiwitPct - t.eiwit), Math.abs(vetPct - t.vet));
    var score = Math.round(100 - 3 * maxDev);
    return Math.max(0, Math.min(100, score));
  }

  var MEALTYPE_GUIDE = {
    "Ontbijt": { min: 350, max: 450, desc: "een ontbijt (bijv. eieren, havermout, kwark, yoghurt, brood) — geen zware avondmaaltijd-gerechten" },
    "Lunch": { min: 450, max: 550, desc: "een lunch (bijv. salade, bowl, belegd brood, soep met brood) — praktisch te bereiden of mee te nemen" },
    "Diner": { min: 550, max: 650, desc: "een volwaardige warme avondmaaltijd" },
    "Snack": { min: 150, max: 250, desc: "een tussendoortje, klein en snel" }
  };

  var GOAL_KCAL_MULTIPLIER = {
    "Onderhoud": 1,
    "Vetverlies (spierbehoud)": 0.85,
    "Cutting": 0.65,
    "Spieropbouw (lean bulk)": 1.15,
    "Atleet (prestatiegericht)": 1.1

  function mealtypeGuideText(mealType) {
    var g = MEALTYPE_GUIDE[mealType];
    var mult = GOAL_KCAL_MULTIPLIER[prefs.goal] || 1;
    var min = Math.max(80, Math.round(g.min * mult / 10) * 10);
    var max = Math.max(min + 40, Math.round(g.max * mult / 10) * 10);
    return min + "-" + max + " kcal per portie; " + g.desc;
  }

  function goalInstructionText() {

  }

  function buildBodyProfileLine() {
    if (!prefs.gender && !prefs.heightCm && !prefs.weightKg && !prefs.age) return "";

    if (prefs.heightCm) bits.push(prefs.heightCm + " cm");
    if (prefs.weightKg) bits.push(prefs.weightKg + " kg");
    bits.push("activiteitsniveau: " + prefs.activityLevel.toLowerCase());
    return "- Lichaamsprofiel: " + bits.join(", ") + " — stem portiegrootte en calorieën hierop af (naast de " +
      "maaltijdmoment-richtlijn hierboven)\n";
  }

  function buildPrompt() {
    var cuisineTxt = prefs.cuisines.length ? prefs.cuisines.join(", ") : "geen specifieke voorkeur";
    var flavorTxt = prefs.flavors.length ? prefs.flavors.join(", ") : "geen specifieke voorkeur";
    var equipTxt = prefs.equipment.length ? prefs.equipment.join(", ") : "standaard fornuis en oven";
    var excludeTxt = prefs.exclude.trim() ? prefs.exclude.trim() : "geen";
    var mealTypes = prefs.mealTypes.length ? prefs.mealTypes : ["Diner"];
    var mealGuideTxt = mealTypes.map(function (mt) { return mt + " (" + mealtypeGuideText(mt) + ")"; }).join("; ");
    var totalCount = prefs.count * mealTypes.length;
    var mealInstruction = mealTypes.length === 1
      ? "Alle " + prefs.count + " gerechten zijn bedoeld als " + mealTypes[0].toLowerCase() + "."
      : "Genereer PRECIES " + prefs.count + " gerechten per maaltijdmoment (dus " + prefs.count + "x elk van: " +
        mealTypes.join(", ") + " — in totaal " + totalCount + " gerechten). Niet verdelen of afronden, exact " +
        prefs.count + " per moment.";
    return "Je bent een voedingskundige chef-kok. Genereer in totaal " + totalCount + " macro-gebalanceerde " +
      "gerechten (per 1 persoon) die voldoen aan:\n" +
      "- Maaltijdmomenten: " + mealGuideTxt + "\n" +
      mealInstruction + "\n" +
      "- Keukenstijl: " + cuisineTxt + "\n" +
      "- Smaakprofiel: " + flavorTxt + "\n" +
      "- Culinair niveau: " + prefs.level + "\n" +

      "Gebruik reële, haalbare porties en ingrediënten die passen " +
      "bij het gekozen maaltijdmoment van elk gerecht.\n" +
      "Geef ALLEEN geldig JSON terug: een array van EXACT " + totalCount + " objecten (" + prefs.count +
      " per maaltijdmoment), exact dit schema, geen markdown-opmaak, geen uitleg erbuiten:\n" +
      '[{"name": "gerechtnaam", "mealType": "' + mealTypes[0] + '", "kcal": 600, "kh_g": 50, "eiwit_g": 48, "vet_g": 22, ' +
      '"benodigdheden": "korte tekst met keukenapparatuur", "ingredienten": ["ingredient 1", "ingredient 2"], ' +
      '"steps": [{"title": "korte staptitel", "content": "volledige instructie", "timer_seconds": 300}]}]\n' +
      '"mealType" moet exact één van deze waarden zijn: ' + mealTypes.join(", ") + ". " +

  function generateMeals() {
    if (state.generating) return;
    state.genError = null;
    state.genSuccess = null;
    state.generating = true;
    busyStart();
    savePrefs();
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        state.generating = false;
        busyEnd();
        state.genError = "Genereren is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var prompt = buildPrompt();
      var mealTypesSel = prefs.mealTypes.length ? prefs.mealTypes : ["Diner"];
      sample.json(prompt, { modelTier: "default" }).then(function (result) {
        var list = extractDishArray(result);
        if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");

        var days = list.map(function (d, idx) {
          var kcal = Number(d.kcal) || 0;
          var khG = Number(d.kh_g) || 0;
          var eiwitG = Number(d.eiwit_g) || 0;
          var vetG = Number(d.vet_g) || 0;
          var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
          var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
          var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
          var balans = computeBalance(khPct, eiwitPct, vetPct);
          var dishMealType = mealTypesSel.indexOf(d.mealType) > -1 ? d.mealType : mealTypesSel[idx % mealTypesSel.length];
          var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
            var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
            if (s.timer_seconds) st.timer = Number(s.timer_seconds);
            return st;
          }) : [{ title: "Bereiding", content: "Geen bereidingsstappen ontvangen." }];
          return {
            id: "gen" + Date.now() + "_" + idx,
            label: "Gerecht " + (idx + 1),
            name: String(d.name || "Naamloos gerecht"),
            kcal: kcal, kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: balans,
            mealType: dishMealType,
            benodigdheden: String(d.benodigdheden || ""),
            ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
            steps: steps,
            profile: currentProfileSnapshot()
          };
        });

        addToCacheLibrary(days);
        persistDishesToDb(days);
        state.generating = false;
        busyEnd();
        state.genSuccess = days.length + (days.length === 1 ? " gerecht is" : " gerechten zijn") +

  function getMonday(d) {
    var date = new Date(d);
    date.setHours(0, 0, 0, 0);
    var day = date.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    return date;
  }

  function isoDateKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  var MONTHS_SHORT = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

  function formatWeekLabel(monday) {
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    if (monday.getMonth() === sunday.getMonth()) {
      return monday.getDate() + " – " + sunday.getDate() + " " + MONTHS_SHORT[monday.getMonth()] + " " + sunday.getFullYear();
    }
    return monday.getDate() + " " + MONTHS_SHORT[monday.getMonth()] + " – " + sunday.getDate() + " " + MONTHS_SHORT[sunday.getMonth()] + " " + sunday.getFullYear();
  }

  function findPlannedWeek(id) { return plannedWeeks.filter(function (w) { return w.id === id; })[0]; }

  function isCurrentWeek(monday) {
    return isoDateKey(monday) === isoDateKey(getMonday(new Date()));

  function primarySlotForDay(pw, d) {

  function aggregateDayMacros(pw, d) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_SLOTS.forEach(function (m) {
      var assigned = pw.slots[d + "|" + m];
      if (!assigned) return;
      var resolved = resolveAssignedDish(assigned);
      if (!resolved) return;
      var day = resolved.day;
      count++;
      totalKcal += day.kcal;
      totalKhG += (day.kh / 100 * day.kcal) / 4;
      totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
      totalVetG += (day.vet / 100 * day.kcal) / 9;
      totalBalans += day.balans;
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: Math.round(totalBalans / count), count: count };
  }

  function aggregateWeekMacros(pw) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var day = resolved.day;
        count++;
        totalKcal += day.kcal;
        totalKhG += (day.kh / 100 * day.kcal) / 4;
        totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
        totalVetG += (day.vet / 100 * day.kcal) / 9;
        totalBalans += day.balans;
      });
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: Math.round(totalBalans / count), count: count };
  }

  var UNIT_ALIASES = {
    "gram": "g", "grams": "g", "g": "g",
    "kilogram": "kg", "kg": "kg",
    "milliliter": "ml", "ml": "ml",
    "liter": "l", "l": "l",
    "eetlepel": "el", "eetlepels": "el", "el": "el",
    "theelepel": "tl", "theelepels": "tl", "tl": "tl",
    "stuk": "stuks", "stuks": "stuks",
    "teentje": "teentjes", "teentjes": "teentjes", "teen": "teentjes", "tenen": "teentjes",
    "blikje": "blikjes", "blikjes": "blikjes",
    "plakje": "plakjes", "plakjes": "plakjes",
    "snee": "sneetjes", "sneetjes": "sneetjes"
  };

  var UNICODE_FRACTIONS = { "½": 0.5, "⅓": 1 / 3, "⅔": 2 / 3, "¼": 0.25, "¾": 0.75, "⅕": 0.2, "⅛": 0.125, "⅜": 0.375, "⅝": 0.625, "⅞": 0.875 };

  function finishParsedIngredient(amount, rawUnitToken, restText) {
    var rawUnit = (rawUnitToken || "").toLowerCase();
    var unit = UNIT_ALIASES[rawUnit] || "";
    var rest = unit ? restText : ((rawUnitToken ? rawUnitToken + " " : "") + restText);
    rest = rest.replace(/\s+([,.;:])/g, "$1").trim();
    if (!rest) return null;
    return { amount: amount, unit: unit, name: rest };
  }

  function parseIngredientLine(raw) {
    var s = raw.trim();

    var halfWord = s.match(/^(?:halve|half)\s+(.*)$/i);
    if (halfWord) {
      var result = finishParsedIngredient(0.5, null, halfWord[1]);
      if (result) return result;
    }

    var mixedFrac = s.match(/^(\d+\s+)?(\d+)\/(\d+)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (mixedFrac) {
      var whole = mixedFrac[1] ? parseInt(mixedFrac[1], 10) : 0;
      var num = parseInt(mixedFrac[2], 10);
      var den = parseInt(mixedFrac[3], 10);
      if (den) {
        var fracAmount = whole + num / den;
        var fracResult = finishParsedIngredient(fracAmount, mixedFrac[4], mixedFrac[5]);
        if (fracResult) return fracResult;
      }
    }

    var uniFracKeys = Object.keys(UNICODE_FRACTIONS).join("");
    var uniFracRe = new RegExp("^(\\d+\\s*)?([" + uniFracKeys + "])\\s*([a-zA-Zàéèëï]+)?\\s*(.*)$");
    var uniFrac = s.match(uniFracRe);
    if (uniFrac) {
      var uniWhole = uniFrac[1] ? parseInt(uniFrac[1], 10) : 0;
      var uniAmount = uniWhole + UNICODE_FRACTIONS[uniFrac[2]];
      var uniResult = finishParsedIngredient(uniAmount, uniFrac[3], uniFrac[4]);
      if (uniResult) return uniResult;
    }

    var m = s.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (m && m[1]) {
      var plainResult = finishParsedIngredient(parseFloat(m[1].replace(",", ".")), m[2], m[3]);
      if (plainResult) return plainResult;
    }

    return { amount: null, unit: "", name: raw.trim() };
  }

  function normalizeIngredientName(name) {
    return name.trim().toLowerCase().replace(/\s+/g, " ");
  }

  var PREP_DESCRIPTORS = [
    "in blokjes", "in reepjes", "in plakjes", "in ringen", "in parten", "in stukjes", "in stukken",
    "fijngehakt", "grofgehakt", "geraspt", "geschild", "gesneden", "fijngesneden",
    "gesnipperd", "gepeld", "ontpit", "ontveld", "uitgelekt", "verse", "vers"
  ];
  var SINGULAR_EXCEPTIONS = ["kaas", "ananas", "vlees", "ijs", "roomijs", "gehakt", "sla", "rijst", "glas", "kokos", "hummus", "mayonaise", "peen"];
  var NAME_ALIASES = {
    "knoflooktenen": "knoflook", "knoflookteentjes": "knoflook", "knoflookteentje": "knoflook", "knoflookteen": "knoflook",
    "knoflookteentje(s)": "knoflook", "teentjes knoflook": "knoflook", "tenen knoflook": "knoflook",
    "citroensap": "citroen", "citroenrasp": "citroen", "limoensap": "limoen"
  };

  function singularizeWord(word) {
    if (SINGULAR_EXCEPTIONS.indexOf(word) > -1) return word;
    if (/en$/.test(word) && word.length - 2 >= 2) return word.slice(0, -2);
    if (/s$/.test(word) && !/ss$/.test(word) && word.length - 1 >= 3) return word.slice(0, -1);
    return word;
  }

  function matchKeyForName(name) {
    var s = name.toLowerCase().trim();
    s = s.split(",")[0].trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    s = " " + s + " ";
    PREP_DESCRIPTORS.forEach(function (d) {
      var re = new RegExp("\\b" + d.replace(/\s+/g, "\\s+") + "\\b", "g");
      s = s.replace(re, " ");
    });
    s = s.replace(/\s+/g, " ").trim();
    if (!s) s = name.toLowerCase().trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    return s.split(" ").map(singularizeWord).join(" ");
  }

  function formatAmount(n) {
    var rounded = Math.round(n * 100) / 100;
    return rounded % 1 === 0 ? String(rounded) : String(rounded.toFixed(2)).replace(/0+$/, "").replace(/\.$/, "");
  }

  var UNIT_CONVERSION = {
    g: { factor: 1, family: "weight" },
    kg: { factor: 1000, family: "weight" },
    ml: { factor: 1, family: "volume" },
    l: { factor: 1000, family: "volume" },
    tl: { factor: 5, family: "volume" },
    el: { factor: 15, family: "volume" }
  };

  function humanizeWeight(g) {
    if (g >= 1000) return formatAmount(g / 1000) + " kg";
    return formatAmount(g) + " g";
  }
  function humanizeVolume(ml, hadBulkUnit) {
    if (hadBulkUnit || ml >= 200) {
      if (ml >= 1000) return formatAmount(ml / 1000) + " l";
      return formatAmount(ml) + " ml";
    }
    if (ml >= 15) return formatAmount(Math.round((ml / 15) * 2) / 2) + " el";
    return formatAmount(Math.round((ml / 5) * 2) / 2) + " tl";
  }

  var CATEGORY_ORDER = ["Groente & Fruit", "Brood & Granen", "Vlees, Vis & Kip", "Zuivel & Eieren", "Overige"];
  var CATEGORY_KEYWORDS = [
    { label: "Groente & Fruit", keywords: ["aardappel", "ui", "knoflook", "paprika", "tomaat", "tomaatjes", "komkommer", "spinazie", "prei", "wortel", "broccoli", "sla", "citroen", "limoen", "appel", "banaan", "avocado", "doperwten", "groene bonen", "bloemkool", "courgette", "champignon", "peterselie", "koriander", "basilicum", "gember", "rucola", "venkel", "asperge", "framboos", "aardbei", "druif", "mango", "ananas", "selderij", "radijs", "biet", "spruitjes", "pompoen", "aubergine", "peer", "kiwi", "sinaasappel"] },
    { label: "Brood & Granen", keywords: ["brood", "wrap", "pasta", "rijst", "zilvervlies", "volkoren", "havermout", "quinoa", "bulgur", "couscous", "cracker", "beschuit", "tortilla", "noedels", "spaghetti", "penne", "cracotte", "toast"] },
    { label: "Vlees, Vis & Kip", keywords: ["kip", "kalkoen", "gehakt", "vis", "zalm", "tonijn", "garnalen", "spek", "ham", "worst", "biefstuk", "eend", "varkenshaas", "runderlappen", "kabeljauw", "kroket"] },
    { label: "Zuivel & Eieren", keywords: ["kwark", "yoghurt", "melk", "kaas", "boter", "eieren", "ei ", " ei", "room", "mozzarella", "feta", "crème fraîche", "parmezaan", "ricotta"] }
  ];
  function categorizeIngredient(name) {
    var lower = " " + name.toLowerCase() + " ";
    for (var i = 0; i < CATEGORY_KEYWORDS.length; i++) {
      var cat = CATEGORY_KEYWORDS[i];
      for (var j = 0; j < cat.keywords.length; j++) {
        if (lower.indexOf(cat.keywords[j]) > -1) return cat.label;
      }
    }
    return "Overige";
  }

  function scaleIngredientText(raw, multiplier) {
    if (!multiplier || multiplier === 1) return raw;
    var parsed = parseIngredientLine(raw);
    if (parsed.amount === null) return raw + " (x" + multiplier + ")";
    var scaled = parsed.amount * multiplier;
    var amtText = parsed.unit ? formatAmount(scaled) + " " + parsed.unit : formatAmount(scaled) + "x";
    return amtText + " " + parsed.name;
  }

  function buildAggregatedShoppingList(entries) {
    var groups = {};
    var order = [];
    entries.forEach(function (entry) {
      var multiplier = entry.servings || 1;
      entry.day.ingredienten.forEach(function (raw) {
        var parsed = parseIngredientLine(raw);
        var matchKey = matchKeyForName(parsed.name);
        var conv = UNIT_CONVERSION[parsed.unit];
        var groupUnit = conv ? conv.family : parsed.unit;
        var key = groupUnit + "|" + matchKey;
        if (!groups[key]) {
          groups[key] = { amount: 0, family: conv ? conv.family : null, rawUnit: parsed.unit, hadBulkUnit: false, names: [], hasAmount: false, raws: [] };
          order.push(key);
        }
        var g = groups[key];
        g.raws.push(raw);
        g.names.push(parsed.name);
        if (parsed.amount !== null) {
          g.amount += (conv ? parsed.amount * conv.factor : parsed.amount) * multiplier;
          g.hasAmount = true;
          if (parsed.unit === "ml" || parsed.unit === "l") g.hadBulkUnit = true;
        }
      });
    });

    var byCategory = {};
    CATEGORY_ORDER.forEach(function (c) { byCategory[c] = []; });
    order.forEach(function (key) {
      var g = groups[key];
      var displayName = g.names.reduce(function (shortest, n) { return n.length < shortest.length ? n : shortest; }, g.names[0]);
      var text;
      if (g.hasAmount) {
        var amtText;
        if (g.family === "weight") amtText = humanizeWeight(g.amount);
        else if (g.family === "volume") amtText = humanizeVolume(g.amount, g.hadBulkUnit);
        else amtText = formatAmount(g.amount) + (g.rawUnit ? " " + g.rawUnit : "x");
        text = amtText + " " + displayName;
      } else {
        text = g.raws[0];
      }
      var cat = categorizeIngredient(displayName);
      byCategory[cat].push({ key: key, text: text });
    });
    return byCategory;
  }

            : '';

        });

      });

  function generateShoppingPdfBlob(title, entries, mode) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var margin = 48;
    var y = margin;
    var lineH = 16;
    var maxY = doc.internal.pageSize.getHeight() - margin;

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function heading(text, size) {
      ensureRoom(size + 10);
      doc.setTextColor(22, 48, 92);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(20, 24, 34);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11.5);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }

    heading("Boodschappenlijst — " + title, 20);
    y += 4;

    if (mode === "day") {
      entries.forEach(function (entry) {
        var day = entry.day;
        ensureRoom(24);
        doc.setDrawColor(200, 208, 222);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(entry.label + " — " + day.name, 13);
        day.ingredienten.forEach(function (ing) { bodyLines("\u2610  " + scaleIngredientText(ing, entry.servings || 1), { size: 11.5 }); });
        y += 6;
      });
    } else {
      var byCategory = buildAggregatedShoppingList(entries);
      CATEGORY_ORDER.forEach(function (cat) {
        var items = byCategory[cat];
        if (!items.length) return;
        ensureRoom(24);
        doc.setDrawColor(200, 208, 222);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(cat, 13);
        items.forEach(function (item) { bodyLines("\u2610  " + item.text, { size: 11.5 }); });
        y += 6;
      });
    }

    return doc.output("blob");
  }

  function generatePdfBlob(title, subtitle, entries) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 48;
    var y = margin;
    var lineH = 15;
    var maxY = pageH - margin;

    var NAVY = [22, 48, 92];
    var INK = [20, 24, 34];
    var MUTED = [107, 100, 90];
    var ORANGE = [245, 130, 31];
    var ORANGE_INK = [58, 30, 0];
    var KH_BG = [232, 238, 247], KH_INK = [30, 58, 102];
    var EIWIT_BG = [238, 240, 244], EIWIT_INK = [58, 66, 87];
    var VET_BG = [253, 236, 218], VET_INK = [180, 89, 10];
    var NEUTRAL_BG = [244, 246, 250];
    var LINE = [225, 229, 238];

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function heading(text, size, color) {
      ensureRoom(size + 10);
      doc.setTextColor(color[0], color[1], color[2]);
      doc.setFont("times", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(INK[0], INK[1], INK[2]);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }
    function measureLines(text, size, bold) {
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      return doc.splitTextToSize(text, pageW - margin * 2).length;
    }
    function drawBadge(x, yTop, text, fill, ink) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      var padX = 8, h = 16;
      var w = doc.getTextWidth(text) + padX * 2;
      doc.setFillColor(fill[0], fill[1], fill[2]);
      doc.roundedRect(x, yTop, w, h, 8, 8, "F");
      doc.setTextColor(ink[0], ink[1], ink[2]);
      doc.text(text, x + padX, yTop + h / 2 + 3);
      doc.setTextColor(INK[0], INK[1], INK[2]);
      return x + w + 6;
    }

    // --- Cover page ---
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, pageW, 220, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("times", "bold");
    doc.setFontSize(30);
    doc.splitTextToSize(title, pageW - margin * 2).forEach(function (line, i) {
      doc.text(line, margin, 110 + i * 34);
    });
    if (subtitle) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(12);
      doc.setTextColor(220, 228, 240);
      doc.text(subtitle, margin, 168);
    }
    doc.setDrawColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    doc.setLineWidth(2);
    doc.line(margin, 190, margin + 60, 190);
    doc.setLineWidth(1);

    y = 260;
    doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text(entries.length + (entries.length === 1 ? " gerecht in dit menu" : " gerechten in dit menu"), margin, y);
    y += 26;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    entries.forEach(function (entry) {
      ensureRoom(lineH + 2);
      var left = entry.label + " — " + entry.day.name;
      var right = entry.day.prep ? "" : (entry.day.kcal + " kcal");
      doc.setTextColor(INK[0], INK[1], INK[2]);
      var leftLines = doc.splitTextToSize(left, pageW - margin * 2 - 70);
      doc.text(leftLines[0], margin, y);
      if (right) {
        doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text(right, pageW - margin, y, { align: "right" });
      }
      y += lineH;
    });

    // --- Dish pages ---
    doc.addPage();
    y = margin;

    entries.forEach(function (entry) {
      var day = entry.day;
      var meta = day.prep ? "" : (day.kcal + " kcal  ·  KH " + day.kh + "% / Eiwit " + day.eiwit + "% / Vet " + day.vet + "%  ·  Balans " + day.balans + "%");
      var benodigdhedenText = "Benodigdheden: " + day.benodigdheden;

      var estHeight = 26 + (20 + 8) + 26 + 4 + 4 + 10;
      estHeight += measureLines(benodigdhedenText, 11) * lineH;
      estHeight += measureLines("Ingrediënten:", 11, true) * lineH;
      day.ingredienten.forEach(function (ing) { estHeight += measureLines("• " + ing, 11) * lineH; });
      estHeight += measureLines("Bereiding:", 11, true) * lineH;
      day.steps.forEach(function (st, i) { estHeight += measureLines((i + 1) + ". " + st.title + " — " + st.content, 11) * lineH; });

      if (y > margin && y + estHeight > maxY) { doc.addPage(); y = margin; }

      if (y > margin) {
        doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
        doc.line(margin, y, pageW - margin, y);
        y += 22;
      }

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
      doc.text(entry.label.toUpperCase(), margin, y);
      y += 16;

      heading(day.name, 20, NAVY);
      y += 2;

      var bx = margin;
      if (day.prep) {
        bx = drawBadge(bx, y, day.benodigdheden, NEUTRAL_BG, INK);
      } else {
        bx = drawBadge(bx, y, day.kcal + " kcal", NEUTRAL_BG, INK);
        bx = drawBadge(bx, y, "KH " + day.kh + "%", KH_BG, KH_INK);
        bx = drawBadge(bx, y, "Eiwit " + day.eiwit + "%", EIWIT_BG, EIWIT_INK);
        bx = drawBadge(bx, y, "Vet " + day.vet + "%", VET_BG, VET_INK);
        bx = drawBadge(bx, y, "Balans " + day.balans + "%", ORANGE, ORANGE_INK);
      }
      y += 16 + 12;

      if (!day.prep) { bodyLines(benodigdhedenText, { size: 11 }); y += 4; }
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      bodyLines("Ingrediënten", { bold: true, size: 11 });
      doc.setTextColor(INK[0], INK[1], INK[2]);
      day.ingredienten.forEach(function (ing) { bodyLines("• " + ing, { size: 11 }); });
      y += 4;
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      bodyLines("Bereiding", { bold: true, size: 11 });
      doc.setTextColor(INK[0], INK[1], INK[2]);
      day.steps.forEach(function (st, i) { bodyLines((i + 1) + ". " + st.title + " — " + st.content, { size: 11 }); });
      y += 14;
    });

    var totalPages = doc.internal.getNumberOfPages();
    for (var p = 2; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text(title, margin, pageH - 24);
      doc.text((p - 1) + " / " + (totalPages - 1), pageW - margin, pageH - 24, { align: "right" });
    }

    return doc.output("blob");
  }

        if (btn) btn.textContent = resetLabel;
      }).catch(function (e) {
        if (btn) btn.textContent = e && e.code === "declined" ? resetLabel : "Download mislukt — probeer opnieuw";

      simpeler: "Maak dit gerecht simpeler en basic: minder stappen, alledaagse ingrediënten, makkelijker om te bereiden.",

      wisselkh: "Vervang de koolhydraatbron door een andere (bijv. rijst i.p.v. aardappel of andersom), maar behoud dezelfde macroverdeling."
    };
    var current = {
      name: day.name, kcal: day.kcal,

      benodigdheden: day.benodigdheden,
      steps: day.steps.map(function (s) { return s.title + ": " + s.content; })
    };
    return "Hier is een bestaand gerecht in JSON: " + JSON.stringify(current) + "\n\n" +
      "Opdracht: " + instructionMap[kind] + "\n" +
      "Streef naar een macroverdeling passend bij het doel \"" + prefs.goal + "\": " + GOAL_DESCRIPTIONS[prefs.goal] + "\n" +
      "Geef ALLEEN geldig JSON terug, exact dit schema, geen markdown, geen uitleg erbuiten:\n" +
      '{"name": "gerechtnaam", "kcal": 600, "kh_g": 50, "eiwit_g": 48, "vet_g": 22, ' +
      '"benodigdheden": "korte tekst met keukenapparatuur", "ingredienten": ["ingredient 1", "ingredient 2"], ' +
      '"steps": [{"title": "korte staptitel", "content": "volledige instructie", "timer_seconds": 300}]}\n' +
      "timer_seconds alleen toevoegen bij stappen met wachttijd; anders weglaten.";
  }

  function variateDish(week, day, kind, btnEl) {
    if (state.variating) return;
    state.variateError = null;
    state.variating = true;
    busyStart();
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        state.variating = false;
        busyEnd();
        state.variateError = "Variaties zijn in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var prompt = buildVariationPrompt(day, kind);
      sample.json(prompt, { modelTier: "default" }).then(function (d) {
        var kcal = Number(d.kcal) || 0;
        var khG = Number(d.kh_g) || 0;
        var eiwitG = Number(d.eiwit_g) || 0;
        var vetG = Number(d.vet_g) || 0;
        var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
        var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
        var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
        day.name = String(d.name || day.name);
        day.kcal = kcal;
        day.kh = khPct; day.eiwit = eiwitPct; day.vet = vetPct;
        day.balans = computeBalance(khPct, eiwitPct, vetPct);
        day.benodigdheden = String(d.benodigdheden || day.benodigdheden);
        day.ingredienten = Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : day.ingredienten;
        day.steps = Array.isArray(d.steps) && d.steps.length ? d.steps.map(function (s) {
          var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
          if (s.timer_seconds) st.timer = Number(s.timer_seconds);
          return st;
        }) : day.steps;
        day.profile = currentProfileSnapshot();
        state.variating = false;
        busyEnd();
        render();
      }).catch(function (e) {
        state.variating = false;
        busyEnd();
        state.variateError = (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." : "Variatie maken is niet gelukt. Probeer het nogmaals.";
        render();
      });
    });
  }

  function collectWeekDishes(pw) {
    var seen = {};
    var out = [];
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var dishKey = assigned.dayId;
        var servings = assigned.servings || 1;
        if (seen[dishKey]) { seen[dishKey].count += servings; return; }
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var entry = { day: resolved.day, count: servings };
        seen[dishKey] = entry;
        out.push(entry);
      });
    });
    return out;
  }

      "koolhydraatbronnen) kunnen in bulk worden voorbereid voor de hele week, gegroepeerd per keukenapparaat " +
      "(gasfornuis, oven, airfryer, vleesgrill). Schaal hoeveelheden naar het aantal keren dat elk gerecht " +
      "voorkomt. Houd het praktisch: alleen dingen die goed te bewaren/portioneren zijn (vlees, granen, " +
      "geroosterde groenten) — geen verse garnering of dressing die je beter per maaltijd apart maakt.\n" +
      "Geef ALLEEN geldig JSON terug, exact dit schema, geen markdown, geen uitleg erbuiten:\n" +
      '{"name": "Prepdag", "benodigdheden": "korte tekst met keukenapparatuur", ' +
      '"ingredienten": ["ingredient 1 met hoeveelheid", "ingredient 2 met hoeveelheid"], ' +
      '"steps": [{"title": "korte staptitel", "content": "volledige instructie", "timer_seconds": 300}]}\n' +
      "timer_seconds alleen toevoegen bij stappen met wachttijd; anders weglaten.";

  function generatePrepPlan(pw) {
    if (pw.prepGenerating) return;
    var dishes = collectWeekDishes(pw);
    if (!dishes.length) return;
    pw.prepError = null;
    pw.prepGenerating = true;
    busyStart();
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        pw.prepGenerating = false;
        busyEnd();
        pw.prepError = "Genereren is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var prompt = buildPrepPrompt(dishes);
      sample.json(prompt, { modelTier: "default" }).then(function (d) {
        var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
          var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
          if (s.timer_seconds) st.timer = Number(s.timer_seconds);
          return st;
        }) : [{ title: "Prep", content: "Geen stappen ontvangen." }];
        pw.dynamicPrep = {
          name: String(d.name || "Prepdag"),
          benodigdheden: String(d.benodigdheden || ""),
          ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
          steps: steps,
          basedOnCount: dishes.length
        };
        pw.prepGenerating = false;
        busyEnd();
        savePlannedWeeks();
        render();
      }).catch(function (e) {
        pw.prepGenerating = false;
        busyEnd();
        pw.prepError = (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." : "Prepdag samenstellen is niet gelukt. Probeer het nogmaals.";
        render();
      });
    });
  }

  var AUTOWEEK_COUNTS = { "Ontbijt": 3, "Lunch": 3, "Diner": 4, "Snack": 4 };

  function collectExistingByType() {
    var byType = {};
    PLAN_MEALS.forEach(function (m) { byType[m] = []; });
    var seenIds = {};
    WEEKS.forEach(function (w) {
      w.days.forEach(function (d) {
        if (d.prep || !d.mealType || !byType[d.mealType]) return;
        if (seenIds[d.id]) return;
        seenIds[d.id] = true;
        byType[d.mealType].push({ week: w, day: d });
      });
    });
    return byType;
  }

  function generateAutoWeek(pw, btn) {
    if (pw.autoFilling) return;
    pw.autoFillError = null;

    try {
      var existingByType = collectExistingByType();
      var needed = {};
      var anyNeeded = false;
      PLAN_MEALS.forEach(function (m) {
        var have = existingByType[m].length;
        var want = AUTOWEEK_COUNTS[m];
        if (have < want) { needed[m] = want - have; anyNeeded = true; }
      });

      var finishFill = function (newDays) {
        var buckets = {};
        PLAN_MEALS.forEach(function (m) {
          var pool = existingByType[m].slice(0, AUTOWEEK_COUNTS[m]);
          var extra = newDays.filter(function (d) { return d.mealType === m; }).map(function (d) {
            return { week: findWeek(d.__weekId), day: d };
          });
          buckets[m] = pool.concat(extra);
        });
        var cursors = {};
        PLAN_MEALS.forEach(function (m) { cursors[m] = 0; });
        PLAN_DAYS.forEach(function (d) {
          PLAN_SLOTS.forEach(function (slot) {
            var key = d + "|" + slot;
            if (pw.slots[key]) return;
            var m = SLOT_TO_MEALTYPE[slot];
            var bucket = buckets[m];
            if (!bucket || !bucket.length) return;
            var item = bucket[cursors[m] % bucket.length];
            cursors[m]++;
            pw.slots[key] = { name: item.day.name, weekId: item.week.id, dayId: item.day.id, balans: item.day.balans };
          });
        });
        pw.autoFilling = false;
        savePlannedWeeks();
        render();
      };

      if (!anyNeeded) {
        // Everything needed is already available from previously saved/generated dishes — no generation required.
        finishFill([]);
        return;
      }

      pw.autoFilling = true;
      busyStart();
      render();

      claude.use("sample").then(function (sample) {
        if (!sample) {
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = "Genereren is in deze weergave niet beschikbaar.";
          render();
          return;
        }
        var prompt = buildBackgroundPrompt(needed);
        sample.json(prompt, { modelTier: "default" }).then(function (result) {
          try {
            var list = extractDishArray(result);
            if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");

            var days = dishesFromAiList(list, "auto");
            var monday = new Date(pw.weekStart);
            var newWeek = {
              id: "auto" + Date.now(),
              title: "Automatisch ingevuld",
              subtitle: formatWeekLabel(monday),
              days: days
            };
            WEEKS.unshift(newWeek);
            persistDishesToDb(days);
            days.forEach(function (d) { d.__weekId = newWeek.id; });

            busyEnd();
            finishFill(days);
          } catch (innerErr) {
            console.error("Auto-fill week: verwerken van resultaat mislukt", innerErr, result);
            pw.autoFilling = false;
            busyEnd();
            pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
            render();
          }
        }).catch(function (e) {
          console.error("Auto-fill week: genereren mislukt", e);
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." : "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
          render();
        });
      });
    } catch (e) {
      console.error("Auto-fill week: onverwachte fout", e);
      pw.autoFilling = false;
      busyEnd();
      pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
      render();
    }
  }

  function persistDishImageUpdate(day) {
    if (!dbCap || !userCap || !day.mealType) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var ref = dbCap.doc("data/users/" + uid + "/dishes");

        if (!snap.exists) return;
        var current = deepClone(snap.data() || {});

        var idx = -1;
        for (var i = 0; i < arr.length; i++) { if (arr[i].id === day.id) { idx = i; break; } }
        if (idx === -1) return;
        arr[idx].imageUrl = day.imageUrl;
        arr[idx].imageCredit = day.imageCredit || null;
        ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});

  function loadDishImageInto(day, imgEl, captionEl) {
    if (day.imageUrl) { imgEl.src = day.imageUrl; imgEl.style.display = ""; return; }
    if (day.imageUrl === null) { imgEl.style.display = "none"; return; }
    fetch("/api/image?query=" + encodeURIComponent(day.name)).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null };
    }).then(function (data) {
      day.imageUrl = data.url || null;
      day.imageCredit = data.credit || null;
      if (day.imageUrl) {
        imgEl.src = day.imageUrl;
        imgEl.style.display = "";
        if (captionEl && day.imageCredit && day.imageCredit.name) {
          captionEl.textContent = "Foto: " + day.imageCredit.name + " (Unsplash)";
          captionEl.style.display = "";
        }
      } else {
        imgEl.style.display = "none";
      }
      persistDishImageUpdate(day);
    }).catch(function () {
      day.imageUrl = null;
      imgEl.style.display = "none";
    });
  }

  function persistDishesToDb(daysList) {
    if (!dbCap || !userCap || !daysList || !daysList.length) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var ref = dbCap.doc("data/users/" + uid + "/dishes");
      ref.get().then(function (snap) {
        var current = snap.exists ? deepClone(snap.data() || {}) : {};
        PLAN_MEALS.forEach(function (m) {
          var toAdd = daysList.filter(function (d) { return d.mealType === m; }).map(dishToPlainObject);
          if (!toAdd.length) return;
          var existing = Array.isArray(current[m]) ? current[m] : [];
          var merged = existing.concat(toAdd);
          if (merged.length > 40) merged = merged.slice(merged.length - 40);
          current[m] = merged;
        });
        ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

  function deleteDishFromDb(dishId) {
    if (!dbCap || !userCap) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var ref = dbCap.doc("data/users/" + uid + "/dishes");
      ref.get().then(function (snap) {
        if (!snap.exists) return;
        var current = deepClone(snap.data() || {});
        var changed = false;
        PLAN_MEALS.forEach(function (m) {
          if (!Array.isArray(current[m])) return;
          var before = current[m].length;
          current[m] = current[m].filter(function (d) { return d.id !== dishId; });
          if (current[m].length !== before) changed = true;
        });
        if (changed) ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

  function buildBackgroundPrompt(needed) {
    var cuisineTxt = prefs.cuisines.length ? prefs.cuisines.join(", ") : "geen specifieke voorkeur";
    var flavorTxt = prefs.flavors.length ? prefs.flavors.join(", ") : "geen specifieke voorkeur";
    var equipTxt = prefs.equipment.length ? prefs.equipment.join(", ") : "standaard fornuis en oven";
    var types = Object.keys(needed);
    var totalCount = types.reduce(function (sum, m) { return sum + needed[m]; }, 0);
    var countTxt = types.map(function (m) { return needed[m] + "x " + m + " (" + mealtypeGuideText(m) + ")"; }).join(", ");
    return "Je bent een voedingskundige chef-kok. Genereer in totaal " + totalCount + " macro-gebalanceerde " +
      "gerechten (per 1 persoon), verdeeld als: " + countTxt + ". Precies deze aantallen per maaltijdmoment.\n" +
      "- Keukenstijl: " + cuisineTxt + "\n- Smaakprofiel: " + flavorTxt + "\n- Culinair niveau: " + prefs.level + "\n" +
      "- Beschikbare apparatuur: " + equipTxt + "\n" +
      buildBodyProfileLine() +
      goalInstructionText() + "\n" +
      "Geef ALLEEN geldig JSON terug: een array van EXACT " + totalCount + " objecten, exact dit schema, " +
      "geen markdown-opmaak, geen uitleg erbuiten:\n" +
      '[{"name": "gerechtnaam", "mealType": "' + types[0] + '", "kcal": 600, "kh_g": 50, "eiwit_g": 48, "vet_g": 22, ' +
      '"benodigdheden": "korte tekst met keukenapparatuur", "ingredienten": ["ingredient 1", "ingredient 2"], ' +
      '"steps": [{"title": "korte staptitel", "content": "volledige instructie", "timer_seconds": 300}]}]\n' +
      '"mealType" moet exact één van deze waarden zijn: ' + types.join(", ") + ". " +
      "timer_seconds alleen toevoegen bij stappen met wachttijd; anders weglaten.";
  }

  function dishesFromAiList(list, prefix) {
    return list.map(function (d, idx) {
      var kcal = Number(d.kcal) || 0;
      var khG = Number(d.kh_g) || 0;
      var eiwitG = Number(d.eiwit_g) || 0;
      var vetG = Number(d.vet_g) || 0;
      var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
      var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
      var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
      var dishMealType = PLAN_MEALS.indexOf(d.mealType) > -1 ? d.mealType : "Diner";
      var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
        var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
        if (s.timer_seconds) st.timer = Number(s.timer_seconds);
        return st;
      }) : [{ title: "Bereiding", content: "Geen bereidingsstappen ontvangen." }];
      return {
        id: prefix + Date.now() + "_" + idx,
        label: "Gerecht " + (idx + 1),
        name: String(d.name || "Naamloos gerecht"),
        kcal: kcal, kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: computeBalance(khPct, eiwitPct, vetPct),
        mealType: dishMealType,
        benodigdheden: String(d.benodigdheden || ""),
        ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
        steps: steps,
        profile: currentProfileSnapshot()
      };
    });
  }

  function backgroundGenerate(needed) {
    claude.use("sample").then(function (sample) {

  function renderCook() {
    var week = findWeek(state.weekId);
    var day = findDay(week, state.dayId);
    var step = day.steps[state.stepIndex];
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar(day.name, true, function () { goto("day", { weekId: week.id, dayId: day.id }); }));
    var main = document.createElement("main");

    var progress = document.createElement("div");
    progress.className = "cook-progress";
    day.steps.forEach(function (s, i) {
      var dot = document.createElement("div");
      dot.className = "cook-dot" + (i < state.stepIndex ? " done" : i === state.stepIndex ? " current" : "");
      progress.appendChild(dot);
    });
    main.appendChild(progress);

    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Stap " + (state.stepIndex + 1) + " van " + day.steps.length;
    main.appendChild(eyebrow);

    var title = document.createElement("h2");
    title.className = "cook-step-title";
    title.textContent = step.title;
    main.appendChild(title);

    var body = document.createElement("div");
    body.className = "cook-step-body";
    body.textContent = step.content;
    main.appendChild(body);

    if (step.timer) {
      timerRemaining = timerRemaining && timerRunning ? timerRemaining : step.timer;
      var box = document.createElement("div");
      box.className = "timer-box";
      var clock = document.createElement("div");
      clock.className = "timer-clock";
      clock.id = "timerClock";
      clock.textContent = fmtClock(timerRemaining);
      var tbtn = document.createElement("button");
      tbtn.className = "ghost-btn";
      tbtn.id = "timerToggle";
      tbtn.textContent = timerRunning ? "Pauzeer" : "Start timer";
      tbtn.onclick = function () { toggleTimer(step.timer); };
      box.appendChild(clock);
      box.appendChild(tbtn);
      main.appendChild(box);
    } else {
      timerRemaining = 0;
      stopTimer();
    }

    var spacer = document.createElement("div");
    spacer.style.flex = "1";
    main.appendChild(spacer);

    var nav = document.createElement("div");
    nav.className = "cook-nav";
    if (state.stepIndex > 0) {
      var prev = document.createElement("button");
      prev.className = "ghost-btn";
      prev.textContent = "Vorige";
      prev.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex - 1 }); };
      nav.appendChild(prev);
    }
    var next = document.createElement("button");
    next.className = "primary-btn";
    if (state.stepIndex < day.steps.length - 1) {
      next.textContent = "Volgende stap";
      next.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex + 1 }); };
    } else {
      next.textContent = "Klaar — eet smakelijk";
      next.onclick = function () { goto("day", { weekId: week.id, dayId: day.id }); };
    }
    nav.appendChild(next);
    main.appendChild(nav);

    app.appendChild(main);
  }

  function toggleTimer(total) {
    if (timerRunning) {
      stopTimer();
      var btn = document.getElementById("timerToggle");
      if (btn) btn.textContent = "Hervat";
      return;
    }
    if (timerRemaining <= 0) timerRemaining = total;
    timerRunning = true;
    var btn2 = document.getElementById("timerToggle");
    if (btn2) btn2.textContent = "Pauzeer";
    timerInterval = setInterval(function () {
      timerRemaining -= 1;
      var clock = document.getElementById("timerClock");
      if (clock) clock.textContent = fmtClock(Math.max(timerRemaining, 0));
      if (timerRemaining <= 0) {
        stopTimer();
        var btn3 = document.getElementById("timerToggle");
        if (btn3) btn3.textContent = "Start timer";
      }
    }, 1000);
  }

  function render() {
    try {
      if (state.view === "weeks") renderWeeks();
      else if (state.view === "library") renderLibrary();
      else if (state.view === "prefs") renderPrefs();
      else if (state.view === "plan") renderPlan();
      else if (state.view === "planadd") renderPlanAdd();
      else if (state.view === "planweek") renderPlanWeek();
      else if (state.view === "planday") renderPlanDay();
      else if (state.view === "planprep") renderPlanPrep();
      else if (state.view === "planpick") renderPlanPick();
      else if (state.view === "week") renderWeek();
      else if (state.view === "shopping") renderShopping();
      else if (state.view === "planshopping") renderPlanShopping();
      else if (state.view === "day") renderDay();
      else if (state.view === "cook") renderCook();
      else renderWeeks();
    } catch (e) {
      console.error("Render error op scherm '" + state.view + "':", e);
      document.getElementById("app").innerHTML =
        '<div class="empty-hint">Er ging iets mis bij het laden van dit scherm.<br><br>' +
        '<span style="font-size:12px;color:var(--muted);">' + (e && e.message ? String(e.message).replace(/</g,"&lt;") : "Onbekende fout") + '</span></div>';
    }
  }

  initPersistence();
  render();
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
