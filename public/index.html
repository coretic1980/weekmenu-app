<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balanza">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0805">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Balanza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0A0805;
    --surface: #17130C;
    --ink: #F3EEE2;
    --muted: #A89A80;
    --label: #8C8270;
    --line: #2E2517;
    --accent: #C6A15B;
    --accent-ink: #14110C;
    --accent2: #D4A24A;
    --accent2-ink: #241800;
    --tag-kh-bg: #1C1912; --tag-kh-ink: #DCD7C6;
    --tag-eiwit-bg: #1A1712; --tag-eiwit-ink: #D6CFBC;
    --tag-vet-bg: #241A0C; --tag-vet-ink: #E8C583;
    --dark-panel: #241C0E;
    --dark-panel-ink: #F3EEE2;
  }
  :root[data-theme="light"] {
    --bg: #F7F2E7;
    --surface: #FFFDF8;
    --ink: #10182B;
    --muted: #6B6152;
    --label: #8C8270;
    --line: #E7DFCC;
    --accent: #0A0805;
    --accent-ink: #F7F2E7;
    --accent2: #B8863B;
    --accent2-ink: #2A1C00;
    --tag-kh-bg: #E9E7DE; --tag-kh-ink: #10182B;
    --tag-eiwit-bg: #EDEAE1; --tag-eiwit-ink: #4A4438;
    --tag-vet-bg: #F3E6D0; --tag-vet-ink: #8A6220;
    --dark-panel: #0A1120;
    --dark-panel-ink: #F7F2E7;
  }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header.topbar {
    position: sticky; top: 0;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;
    background: var(--bg);
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .backbtn {
    appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: none;
  }
  .backbtn:hover { border-color: var(--accent2); color: var(--accent2); }
  .topbar h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.01em; }
  main { flex: 1; padding: 26px 22px 64px; display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
  .dish-thumb {
    width: 100%; height: 140px; object-fit: cover; border-radius: 12px; background: var(--bg);
    display: block; margin: -4px 0 2px;
  }
  .dish-hero {
    width: 100%; height: 200px; object-fit: cover; border-radius: 16px; background: var(--bg);
    display: block;
  }
  .photo-credit { font-size: 11px; color: var(--muted); margin-top: -8px; display: none; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 26px;
    display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer;
    font-family: inherit; color: inherit; width: 100%;
    box-shadow: 0 2px 14px rgba(20, 16, 8, 0.055);
  }
  button.card { appearance: none; }
  .card:hover { border-color: var(--accent2); }
  .card h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  .card .sub { color: var(--muted); font-size: 14px; }
  .tagrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .tag.neutral { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .tag.kh { background: var(--tag-kh-bg); color: var(--tag-kh-ink); }
  .tag.eiwit { background: var(--tag-eiwit-bg); color: var(--tag-eiwit-ink); }
  .tag.vet { background: var(--tag-vet-bg); color: var(--tag-vet-ink); }
  .tag.balans { background: var(--accent2); color: var(--accent2-ink); }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--label); margin: 4px 0 4px; }
  .prepcard { background: var(--dark-panel); color: var(--dark-panel-ink); border-radius: 13px; padding: 26px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; border: none; text-align: left; width: 100%; font-family: inherit; }
  .prepcard h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 24px; margin: 0; color: inherit; }
  .ingr-list { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.8; }
  .plainbox { font-size: 15px; line-height: 1.7; }
  .primary-btn {
    appearance: none; border: none; background: var(--accent); color: var(--accent-ink);
    font-family: "Public Sans", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.01em;
    padding: 15px 22px; border-radius: 11px; cursor: pointer; width: 100%;
  }
  .primary-btn:hover { filter: brightness(1.1); }
  .ghost-btn {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
    font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 15px;
    padding: 13px 20px; border-radius: 11px; cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .cook-progress { display: flex; gap: 6px; }
  .cook-dot { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
  .cook-dot.done { background: var(--accent); }
  .cook-dot.current { background: var(--accent); opacity: 0.5; }
  .cook-step-title { font-family: "Fraunces", serif; font-weight: 700; font-size: 26px; margin: 0; }
  .cook-step-body { font-size: 17px; line-height: 1.7; color: var(--ink); }
  .timer-box {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px;
  }
  .timer-clock { font-family: "Fraunces", serif; font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; }
  .cook-nav { display: flex; gap: 12px; margin-top: auto; padding-top: 8px; }
  .cook-nav .primary-btn, .cook-nav .ghost-btn { flex: 1; }
  .empty-hint { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }
  .busybar {
    position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    z-index: 50;
  }
  .busybar.active { opacity: 1; }
  .busybar-text {
    background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px 999px 0 0; margin-bottom: -1px;
  }
  .busybar-track { position: relative; width: 100%; height: 3px; overflow: hidden; background: var(--line); }
  .busybar-fill {
    position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
    background: var(--accent);
    animation: busybar-slide 1.1s ease-in-out infinite;
  }
  @keyframes busybar-slide {
    0% { left: -40%; }
    50% { left: 60%; }
    100% { left: 100%; }
  }
  .toast {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%;
    transform: translateX(-50%) translateY(-20px);
    max-width: min(90vw, 420px); background: var(--tag-kh-bg); color: var(--tag-kh-ink);
    font-size: 14px; font-weight: 600; padding: 14px 18px; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(10, 18, 36, 0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60; text-align: center;
  }
  .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .guide-step { display: flex; gap: 16px; align-items: flex-start; }
  .guide-num {
    flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    font-family: "Fraunces", serif; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .guide-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .guide-body h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 19px; margin: 0; }
  .guide-body p { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--muted); }
  .guide-divider { height: 1px; background: var(--line); margin: 2px 0; }
  .wizard-progress { display: flex; gap: 6px; justify-content: center; }
  .wizard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background 0.2s; }
  .wizard-dot.active { background: var(--accent2); }
  .wizard-dot.done { background: var(--accent); }
  .wizard-skip {
    appearance: none; background: none; border: none; text-align: center; font-size: 13px;
    color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .wizard-nav { display: flex; gap: 12px; margin-top: auto; padding-top: 8px; }
  .wizard-nav .primary-btn, .wizard-nav .ghost-btn { flex: 1; }
  .fact-card {
    background: var(--dark-panel); color: var(--dark-panel-ink); border-radius: 13px; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .fact-card .eyebrow { color: var(--accent2); }
  .fact-card p { margin: 0; font-family: "Fraunces", serif; font-size: 17px; line-height: 1.5; font-style: italic; min-height: 3.2em; }
  .fact-dots { display: flex; gap: 6px; justify-content: center; }
  .fact-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .fact-dot.active { background: var(--accent2); }
  .pdf-preview-overlay {
    position: fixed; inset: 0; z-index: 70; background: var(--bg);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .pdf-preview-overlay.active { opacity: 1; pointer-events: auto; }
  .pdf-preview-header {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .pdf-preview-title { font-family: "Fraunces", serif; font-weight: 600; font-size: 17px; }
  .pdf-preview-frame { flex: 1; width: 100%; border: none; background: #525659; }
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(22, 35, 63, 0.5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 100;
  }
  .confirm-overlay.active { opacity: 1; pointer-events: auto; }
  .confirm-box {
    background: var(--surface); border-radius: 13px; padding: 26px; max-width: 360px; width: 100%;
    box-shadow: 0 12px 36px rgba(16, 12, 4, 0.25);
  }
  .confirm-msg { font-size: 15px; line-height: 1.6; color: var(--ink); margin-bottom: 18px; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions .ghost-btn, .confirm-actions .primary-btn { flex: 1; width: auto; }
  .field-label { font-size: 13px; font-weight: 700; color: var(--ink); margin: 8px 0 2px; }
  .field-hint { font-size: 12.5px; color: var(--muted); margin: -4px 0 4px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font-family: "Public Sans", sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 11px 16px; border-radius: 999px; cursor: pointer; min-height: 40px;
  }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .segrow { display: flex; gap: 8px; }
  .segrow .chip { flex: 1; text-align: center; }
  .textinput {
    width: 100%; font-family: "Public Sans", sans-serif; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .selectinput {
    width: 100%; font-family: "Public Sans", sans-serif; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .genstatus { font-size: 14px; color: var(--muted); text-align: center; padding: 6px 0; }
  .gencard { background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
  .gencard h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 20px; margin: 0; }
  .gencard .sub { color: var(--muted); font-size: 14px; }
  .errorbox { background: var(--tag-vet-bg); color: var(--tag-vet-ink); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
  .successbox { background: var(--tag-kh-bg); color: var(--tag-kh-ink); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
  .card-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; }
  .donebtn {
    width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; color: var(--ink);
  }
  .donebtn.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .prepcard .donebtn { border-color: rgba(255,255,255,0.3); background: transparent; color: inherit; }
  .prepcard .donebtn.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .actionrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .actionrow .ghost-btn { flex: 1; }
  .shop-group { display: flex; flex-direction: column; gap: 4px; }
  .shop-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; font-size: 15px;
  }
  .shop-item.checked { color: var(--muted); text-decoration: line-through; }
  .shop-check {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line); flex: none;
    display: flex; align-items: center; justify-content: center; background: var(--surface);
  }
  .shop-check.on { background: var(--accent2); border-color: var(--accent2); color: var(--accent2-ink); }
  .variant-btn { flex: 1; min-width: 140px; }
  .tilerow { display: flex; gap: 12px; }
  .tile {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 22px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer;
    font-family: inherit; color: inherit; appearance: none; text-align: left;
    box-shadow: 0 2px 14px rgba(20, 16, 8, 0.055);
  }
  .tile:hover { border-color: var(--accent2); }
  .ticon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--bg); color: var(--accent2);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .tile h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 17px; margin: 0; }
  .tile .sub { font-size: 12.5px; color: var(--muted); }
  .plan-day { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .plan-slot {
    appearance: none; width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px;
    cursor: pointer; font-family: inherit; color: inherit; text-align: left; gap: 12px;
  }
  .plan-slot:hover { border-color: var(--accent2); }
  .plan-slot.has-macros { flex-direction: column; align-items: stretch; gap: 10px; }
  .plan-slot .mealname { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); }
  .plan-slot .dishname { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .plan-slot.empty .dishname { color: var(--muted); font-weight: 500; }
  .pickgroup { display: flex; flex-direction: column; gap: 10px; }
  .plan-slot-row { display: flex; gap: 8px; align-items: stretch; }
  .plan-slot-row .plan-slot { flex: 1; }
  .plan-edit-btn {
    width: 44px; flex: none; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .plan-edit-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .weekrow { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 14px rgba(20, 16, 8, 0.055); }
  .weekrow-head { appearance: none; border: none; background: transparent; padding: 0; margin: 0; text-align: left; cursor: pointer; color: inherit; font-family: inherit; display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .weekrow-head h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 24px; margin: 0; }
  .weekrow-head .sub { color: var(--muted); font-size: 14px; }
  .weekrow-head:hover h2 { color: var(--accent2); }
</style>
</head>
<body>
<div id="app"></div>
<div id="busyBar" class="busybar" aria-hidden="true">
  <div id="busyText" class="busybar-text"></div>
  <div class="busybar-track"><div class="busybar-fill"></div></div>
</div>
<div id="toast" class="toast"><span id="toastText"></span></div>
<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <div id="confirmMsg" class="confirm-msg"></div>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" class="ghost-btn">Annuleren</button>
      <button id="confirmOkBtn" class="primary-btn">Bevestigen</button>
    </div>
  </div>
</div>
<div id="pdfPreviewOverlay" class="pdf-preview-overlay">
  <div class="pdf-preview-header">
    <span class="pdf-preview-title">Voorbeeld</span>
    <button id="pdfPreviewClose" class="backbtn" aria-label="Sluiten">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <iframe id="pdfPreviewFrame" class="pdf-preview-frame"></iframe>
</div>
<script>
(function () {
  "use strict";

  function getUserId() {
    var id;
    try { id = localStorage.getItem("weekmenu_uid"); } catch (e) { id = null; }
    if (!id) {
      id = "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem("weekmenu_uid", id); } catch (e) {}
    }
    return id;
  }
  var USER_ID = getUserId();

  function parseErrorFromResponse(res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      var e = new Error(body.message || ("HTTP " + res.status));
      e.code = body.code || (res.status === 429 ? "rate_limited" : "error");
      return e;
    });
  }

  window.claude = {
    use: function (name) {
      if (name === "sample") {
        return Promise.resolve({
          json: function (payload) {
            return fetch("/api/generate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).then(function (res) {
              if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
              return res.json();
            }).then(function (data) { return data.result; });
          }
        });
      }
      if (name === "db") {
        return Promise.resolve({
          doc: function (path) {
            return {
              get: function () {
                return fetch("/api/db?path=" + encodeURIComponent(path)).then(function (res) {
                  if (!res.ok) return { exists: false, data: function () { return undefined; } };
                  return res.json();
                }).then(function (body) {
                  return { exists: !!body.exists, data: function () { return body.value; } };
                });
              },
              set: function (value) {
                return fetch("/api/db", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ path: path, value: value })
                }).then(function (res) {
                  if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
                });
              }
            };
          }
        });
      }
      if (name === "user") {
        return Promise.resolve({ id: function () { return Promise.resolve(USER_ID); } });
      }
      if (name === "downloads") {
        return Promise.resolve({
          save: function (opts) {
            try {
              var url = URL.createObjectURL(opts.data);
              var a = document.createElement("a");
              a.href = url;

  var GOALS = ["Onderhoud", "Vetverlies (spierbehoud)", "Cutting", "Spieropbouw (lean bulk)", "Atleet (prestatiegericht)"];
  var GOAL_TARGETS = {
    "Onderhoud": { kh: 33, eiwit: 33, vet: 34 },
    "Vetverlies (spierbehoud)": { kh: 30, eiwit: 40, vet: 30 },
    "Cutting": { kh: 25, eiwit: 45, vet: 30 },
    "Spieropbouw (lean bulk)": { kh: 40, eiwit: 30, vet: 30 },
    "Atleet (prestatiegericht)": { kh: 45, eiwit: 25, vet: 30 }
  };
  var GOAL_DESCRIPTIONS = {
    "Onderhoud": "gelijke verdeling (±33% koolhydraten/eiwit/vet) om gewicht te behouden",
    "Vetverlies (spierbehoud)": "hoger eiwit, lager koolhydraten en vet, voor vetverlies met behoud van spiermassa (streef naar 30% koolhydraten / 40% eiwit / 30% vet)",
    "Cutting": "zeer hoog eiwit, laag koolhydraten, voor een agressiever calorietekort met maximaal spierbehoud (streef naar 25% koolhydraten / 45% eiwit / 30% vet)",
    "Spieropbouw (lean bulk)": "hoger koolhydraten en eiwit voor spieropbouw met een lichte overschot (streef naar 40% koolhydraten / 30% eiwit / 30% vet)",
    "Atleet (prestatiegericht)": "hoger koolhydraten voor trainings- en wedstrijdbrandstof, met voldoende eiwit voor herstel (streef naar 45% koolhydraten / 25% eiwit / 30% vet)"
  };

  function goalTarget() {
    return GOAL_TARGETS[prefs.goal] || GOAL_TARGETS["Onderhoud"];
  }

  function computeBalance(khPct, eiwitPct, vetPct, target) {
    var t = target || goalTarget();
    var maxDev = Math.max(Math.abs(khPct - t.kh), Math.abs(eiwitPct - t.eiwit), Math.abs(vetPct - t.vet));
    var score = Math.round(100 - 3 * maxDev);
    return Math.max(0, Math.min(100, score));
  }

  function plannedGenerationCount() {
    var n = prefs.mealTypes.length || 1;
    return prefs.count * n;
  }

  function estimateGenerationSeconds(count, withImages) {
    var base = 4;
    var perDish = 4.5;
    var imageOverhead = withImages ? 3 : 0;
    return base + count * perDish + imageOverhead;
  }
  function formatEstimateRange(seconds) {
    var low = Math.max(3, Math.round(seconds * 0.7));
    var high = Math.round(seconds * 1.4);
    return "~" + low + "-" + high + " sec";
  }

  function fetchImageForDish(day) {
    return fetch("/api/image?query=" + encodeURIComponent(day.name)).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null };
    }).then(function (data) {
      day.imageUrl = data.url || null;
      day.imageCredit = data.credit || null;
    }).catch(function () {
      day.imageUrl = null;
    });
  }

  function generateMeals(withImages) {
    if (state.generating) return;
    state.genError = null;
    state.genSuccess = null;
    state.generating = true;
    var estRange = formatEstimateRange(estimateGenerationSeconds(plannedGenerationCount(), withImages));
    busyStart("Gerechten worden gegenereerd… (" + estRange + ")");
    savePrefs();
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        state.generating = false;
        busyEnd();
        state.genError = "Genereren is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var genParams = {
        mealTypes: prefs.mealTypes, count: prefs.count, cuisines: prefs.cuisines, flavors: prefs.flavors,
        level: prefs.level, dietStyle: prefs.dietStyle, equipment: prefs.equipment, exclude: prefs.exclude,
        goal: prefs.goal, gender: prefs.gender, heightCm: prefs.heightCm, weightKg: prefs.weightKg,
        age: prefs.age, activityLevel: prefs.activityLevel
      };
      var mealTypesSel = prefs.mealTypes.length ? prefs.mealTypes : ["Diner"];
      sample.json({ action: "generate", params: genParams }, { modelTier: "default" }).then(function (result) {
        var list = extractDishArray(result);
        if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");

        var days = list.map(function (d, idx) {
          var kcal = Number(d.kcal) || 0;
          var khG = Number(d.kh_g) || 0;
          var eiwitG = Number(d.eiwit_g) || 0;
          var vetG = Number(d.vet_g) || 0;
          var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
          var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
          var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
          var balans = computeBalance(khPct, eiwitPct, vetPct);
          var dishMealType = mealTypesSel.indexOf(d.mealType) > -1 ? d.mealType : mealTypesSel[idx % mealTypesSel.length];
          var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
            var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
            if (s.timer_seconds) st.timer = Number(s.timer_seconds);
            return st;
          }) : [{ title: "Bereiding", content: "Geen bereidingsstappen ontvangen." }];
          return {
            id: "gen" + Date.now() + "_" + idx,
            label: "Gerecht " + (idx + 1),
            name: String(d.name || "Naamloos gerecht"),
            kcal: kcal, kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: balans,
            khG: khG, eiwitG: eiwitG, vetG: vetG,
            mealType: dishMealType,
            benodigdheden: String(d.benodigdheden || ""),
            ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
            steps: steps,
            profile: currentProfileSnapshot()
          };
        });

        if (withImages) {
          busyEnd();
          busyStart("Afbeeldingen worden opgehaald…");
        }
        Promise.resolve(withImages ? Promise.all(days.map(fetchImageForDish)) : null).then(function () {
          busyEnd();
          addToCacheLibrary(days);
          persistDishesToDb(days);
          state.generating = false;
          var successMsg = days.length + (days.length === 1 ? " gerecht is" : " gerechten zijn") +
            " gegenereerd en toegevoegd aan de lijst met opgeslagen gerechten.";
          state.genSuccess = successMsg;
          showToast(successMsg);
          render();
        });
      }).catch(function (e) {
        state.generating = false;
        busyEnd();
        var msg = (e && e.code === "not_granted") ? "Je hebt genereren niet toegestaan voor deze pagina." :
                   (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." :
                   "Genereren is niet gelukt. Probeer het nogmaals.";
        state.genError = msg;
        render();
      });
    });
  }

  function getMonday(d) {
    var date = new Date(d);
    date.setHours(0, 0, 0, 0);
    var day = date.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    return date;
  }

  function isoDateKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  var MONTHS_SHORT = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

  function formatWeekLabel(monday) {
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    if (monday.getMonth() === sunday.getMonth()) {
      return monday.getDate() + " – " + sunday.getDate() + " " + MONTHS_SHORT[monday.getMonth()] + " " + sunday.getFullYear();
    }
    return monday.getDate() + " " + MONTHS_SHORT[monday.getMonth()] + " – " + sunday.getDate() + " " + MONTHS_SHORT[sunday.getMonth()] + " " + sunday.getFullYear();
  }

  function findPlannedWeek(id) { return plannedWeeks.filter(function (w) { return w.id === id; })[0]; }

  function isCurrentWeek(monday) {
    return isoDateKey(monday) === isoDateKey(getMonday(new Date()));
  }

  var DAY_PRIORITY = ["Diner", "Lunch", "Ontbijt", "Snack na diner", "Snack na lunch", "Snack na ontbijt"];

  function primarySlotForDay(pw, d) {
    for (var i = 0; i < DAY_PRIORITY.length; i++) {
      var key = d + "|" + DAY_PRIORITY[i];
      if (pw.slots[key]) return { meal: DAY_PRIORITY[i], key: key, assigned: pw.slots[key] };
    }
    return null;
  }

  function aggregateDayMacros(pw, d) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_SLOTS.forEach(function (m) {
      var assigned = pw.slots[d + "|" + m];
      if (!assigned) return;
      var resolved = resolveAssignedDish(assigned);
      if (!resolved) return;
      var day = resolved.day;
      count++;
      totalKcal += day.kcal;
      totalKhG += (day.kh / 100 * day.kcal) / 4;
      totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
      totalVetG += (day.vet / 100 * day.kcal) / 9;
      totalBalans += day.balans;
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct,
      khG: Math.round(totalKhG), eiwitG: Math.round(totalEiwitG), vetG: Math.round(totalVetG),
      balans: Math.round(totalBalans / count), count: count };
  }

  function aggregateWeekMacros(pw) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var day = resolved.day;
        count++;
        totalKcal += day.kcal;
        totalKhG += (day.kh / 100 * day.kcal) / 4;
        totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
        totalVetG += (day.vet / 100 * day.kcal) / 9;
        totalBalans += day.balans;
      });
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct,
      khG: Math.round(totalKhG), eiwitG: Math.round(totalEiwitG), vetG: Math.round(totalVetG),
      balans: Math.round(totalBalans / count), count: count };
  }

  function finishParsedIngredient(amount, rawUnitToken, restText) {
    var rawUnit = (rawUnitToken || "").toLowerCase();
    var unit = UNIT_ALIASES[rawUnit] || "";
    var rest = unit ? restText : ((rawUnitToken ? rawUnitToken + " " : "") + restText);
    rest = rest.replace(/\s+([,.;:])/g, "$1").trim();
    if (!rest) return null;
    return { amount: amount, unit: unit, name: rest };
  }

  function parseIngredientLine(raw) {
    var s = raw.trim();

    var halfWord = s.match(/^(?:halve|half)\s+(.*)$/i);
    if (halfWord) {
      var result = finishParsedIngredient(0.5, null, halfWord[1]);
      if (result) return result;
    }

    var mixedFrac = s.match(/^(\d+\s+)?(\d+)\/(\d+)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (mixedFrac) {
      var whole = mixedFrac[1] ? parseInt(mixedFrac[1], 10) : 0;
      var num = parseInt(mixedFrac[2], 10);
      var den = parseInt(mixedFrac[3], 10);
      if (den) {
        var fracAmount = whole + num / den;
        var fracResult = finishParsedIngredient(fracAmount, mixedFrac[4], mixedFrac[5]);
        if (fracResult) return fracResult;
      }
    }

    var uniFracKeys = Object.keys(UNICODE_FRACTIONS).join("");
    var uniFracRe = new RegExp("^(\\d+\\s*)?([" + uniFracKeys + "])\\s*([a-zA-Zàéèëï]+)?\\s*(.*)$");
    var uniFrac = s.match(uniFracRe);
    if (uniFrac) {
      var uniWhole = uniFrac[1] ? parseInt(uniFrac[1], 10) : 0;
      var uniAmount = uniWhole + UNICODE_FRACTIONS[uniFrac[2]];
      var uniResult = finishParsedIngredient(uniAmount, uniFrac[3], uniFrac[4]);
      if (uniResult) return uniResult;
    }

    var m = s.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (m && m[1]) {
      var plainResult = finishParsedIngredient(parseFloat(m[1].replace(",", ".")), m[2], m[3]);
      if (plainResult) return plainResult;
    }

    return { amount: null, unit: "", name: raw.trim() };
  }

  function matchKeyForName(name) {

    var lower = " " + name.toLowerCase() + " ";
    for (var key in CATEGORY_OVERRIDES) {
      if (lower.indexOf(key) > -1) return CATEGORY_OVERRIDES[key];
    }
    for (var i = 0; i < CATEGORY_KEYWORDS.length; i++) {
      var cat = CATEGORY_KEYWORDS[i];
      for (var j = 0; j < cat.keywords.length; j++) {
        if (lower.indexOf(cat.keywords[j]) > -1) return cat.label;
      }
    }
    return "Overige";
  }

  function scaleIngredientText(raw, multiplier) {
    if (!multiplier || multiplier === 1) return raw;
    var parsed = parseIngredientLine(raw);
    if (parsed.amount === null) return raw + " (x" + multiplier + ")";
    var scaled = parsed.amount * multiplier;
    var amtText = parsed.unit ? formatAmount(scaled) + " " + parsed.unit : formatAmount(scaled) + "x";
    return amtText + " " + parsed.name;
  }

  var TAP_WATER_NAMES = ["water", "kraanwater", "koud water", "warm water", "heet water", "lauw water"];
  function isTapWater(name) {
    return TAP_WATER_NAMES.indexOf(name.trim().toLowerCase()) > -1;
  }

  function buildAggregatedShoppingList(entries) {
    var groups = {};
    var order = [];
    entries.forEach(function (entry) {
      var multiplier = entry.servings || 1;
      entry.day.ingredienten.forEach(function (raw) {
        var parsed = parseIngredientLine(raw);
        if (isTapWater(parsed.name)) return;
        var matchKey = matchKeyForName(parsed.name);
        var conv = UNIT_CONVERSION[parsed.unit];
        var groupUnit = conv ? conv.family : parsed.unit;
        var key = groupUnit + "|" + matchKey;
        if (!groups[key]) {
          groups[key] = { amount: 0, family: conv ? conv.family : null, rawUnit: parsed.unit, hadBulkUnit: false, names: [], hasAmount: false, raws: [] };
          order.push(key);
        }
        var g = groups[key];
        g.raws.push(raw);
        g.names.push(parsed.name);
        if (parsed.amount !== null) {
          g.amount += (conv ? parsed.amount * conv.factor : parsed.amount) * multiplier;
          g.hasAmount = true;
          if (parsed.unit === "ml" || parsed.unit === "l") g.hadBulkUnit = true;
        }
      });
    });

    var byCategory = {};
    CATEGORY_ORDER.forEach(function (c) { byCategory[c] = []; });
    order.forEach(function (key) {
      var g = groups[key];
      var displayName = g.names.reduce(function (shortest, n) { return n.length < shortest.length ? n : shortest; }, g.names[0]);
      var text;
      if (g.hasAmount) {
        var amtText;
        if (g.family === "weight") amtText = humanizeWeight(g.amount);
        else if (g.family === "volume") amtText = humanizeVolume(g.amount, g.hadBulkUnit);
        else amtText = formatAmount(g.amount) + (g.rawUnit ? " " + g.rawUnit : "x");
        text = amtText + " " + displayName;
      } else {
        text = g.raws[0];
      }
      var cat = categorizeIngredient(displayName);
      byCategory[cat].push({ key: key, text: text });
    });
    return byCategory;
  }

  function estimateShoppingPrices(itemTexts) {
    var uncached = [];
    itemTexts.forEach(function (t) { if (!priceCache[t] && uncached.indexOf(t) === -1) uncached.push(t); });
    if (!uncached.length) return;
    shoppingPriceLoading = true;
    shoppingPriceError = null;
    render();
    claude.use("sample").then(function (sample) {
      if (!sample) {
        shoppingPriceLoading = false;
        shoppingPriceError = "Prijsschatting is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var prompt = "Je bent een prijsexpert voor Nederlandse supermarkten (zoals Albert Heijn en Jumbo). " +
        "Geef voor elk van de onderstaande boodschappenlijst-items een realistische geschatte prijsrange in euro\'s, " +
        "gebaseerd op de vermelde hoeveelheid en een gemiddeld huismerk/A-merk. " +
        "Geef ALLEEN geldig JSON terug: een array van exact " + uncached.length + " objecten, in dezelfde volgorde " +
        "als de items hieronder, elk exact dit schema: {\"laag\": number, \"hoog\": number} (bedragen in euro\'s, " +
        "afgerond op 2 decimalen, laag <= hoog). Geen markdown, geen uitleg erbuiten.\n\nItems:\n" +
        uncached.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n");
      sample.json(prompt, { modelTier: "default" }).then(function (result) {
        var arr = extractDishArray(result);
        if (arr) {
          uncached.forEach(function (t, i) {
            var p = arr[i];
            if (p && typeof p.laag === "number" && typeof p.hoog === "number") {
              priceCache[t] = { laag: p.laag, hoog: p.hoog };
            }
          });
        }
        shoppingPriceLoading = false;
        if (!arr) shoppingPriceError = "Kon geen prijzen ophalen — probeer opnieuw.";
        render();
      }).catch(function () {
        shoppingPriceLoading = false;
        shoppingPriceError = "Prijsschatting mislukt — probeer opnieuw.";
        render();
      });
    });
  }

  function formatEuro(n) {
    return "€" + n.toFixed(2).replace(".", ",");
  }

  function renderShoppingList(title, entries, backFn) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar("Boodschappenlijst", true, backFn));
    var main = document.createElement("main");

    var headerRow = document.createElement("div");
    headerRow.style.display = "flex";
    headerRow.style.alignItems = "center";
    headerRow.style.justifyContent = "space-between";
    headerRow.style.gap = "12px";
    headerRow.style.flexWrap = "wrap";

    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = title;
    headerRow.appendChild(eyebrow);

    var exportBtn = document.createElement("button");
    exportBtn.className = "ghost-btn";
    exportBtn.id = "shopPdfExportBtn";
    exportBtn.textContent = "Exporteer boodschappenlijst";
    exportBtn.onclick = function () { exportShoppingPdf(title, entries, exportBtn, shoppingViewMode); };
    headerRow.appendChild(exportBtn);

    main.appendChild(headerRow);

    var byCategory = shoppingViewMode === "day" ? null : buildAggregatedShoppingList(entries);
    var pricingCategories = byCategory || buildAggregatedShoppingList(entries);
    var currentItemTexts = [];
    CATEGORY_ORDER.forEach(function (cat) { pricingCategories[cat].forEach(function (item) { currentItemTexts.push(item.text); }); });

    var priceRow = document.createElement("div");
    priceRow.style.display = "flex";
    priceRow.style.alignItems = "center";
    priceRow.style.gap = "12px";
    priceRow.style.flexWrap = "wrap";

    var knownPrices = currentItemTexts.map(function (t) { return priceCache[t]; }).filter(Boolean);
    var allPriced = currentItemTexts.length > 0 && knownPrices.length === currentItemTexts.length;

    if (allPriced) {
      var totalLow = knownPrices.reduce(function (s, p) { return s + p.laag; }, 0);
      var totalHigh = knownPrices.reduce(function (s, p) { return s + p.hoog; }, 0);
      var totalBadge = document.createElement("div");
      totalBadge.className = "tag balans";
      totalBadge.textContent = "Geschat totaal: " + formatEuro(totalLow) + " – " + formatEuro(totalHigh);
      priceRow.appendChild(totalBadge);
    } else {
      var priceBtn = document.createElement("button");
      priceBtn.className = "ghost-btn";
      priceBtn.disabled = shoppingPriceLoading || !currentItemTexts.length;
      priceBtn.textContent = shoppingPriceLoading ? "Prijzen worden geschat…" : "Schat de kosten";
      priceBtn.onclick = function () { estimateShoppingPrices(currentItemTexts); };
      priceRow.appendChild(priceBtn);
    }
    main.appendChild(priceRow);

    if (shoppingPriceError) {
      var priceErr = document.createElement("div");
      priceErr.className = "errorbox";
      priceErr.textContent = shoppingPriceError;
      main.appendChild(priceErr);
    }
    if (currentItemTexts.length > 0) {
      var priceNote = document.createElement("div");
      priceNote.style.fontSize = "12px";
      priceNote.style.color = "var(--muted)";
      priceNote.textContent = shoppingViewMode === "day"
        ? "Het geschatte totaal is gebaseerd op de samengevoegde hoeveelheden per ingrediënt (zie \u201cPer week\u201d voor de prijs per ingrediënt) — een online-inschatting, geen actuele of gegarandeerde prijzen."
        : "Prijzen zijn een online-inschatting op basis van gemiddelde Nederlandse supermarktprijzen, geen actuele of gegarandeerde prijzen.";
      main.appendChild(priceNote);
    }

    var modeRow = document.createElement("div");
    modeRow.className = "segrow";
    [["week", "Per week (samengevoegd)"], ["day", "Per dag"]].forEach(function (pair) {
      var chip = document.createElement("button");
      chip.className = "chip" + (shoppingViewMode === pair[0] ? " selected" : "");
      chip.textContent = pair[1];
      chip.onclick = function () { shoppingViewMode = pair[0]; render(); };
      modeRow.appendChild(chip);
    });
    main.appendChild(modeRow);

    if (!entries.length) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Nog geen gerechten om een boodschappenlijst voor te maken.";
      main.appendChild(hint);
    }

    if (shoppingViewMode === "day") {
      entries.forEach(function (entry) {
        var day = entry.day;
        var label = document.createElement("div");
        label.className = "section-label";
        label.textContent = entry.label + " — " + day.name;
        main.appendChild(label);

        var group = document.createElement("div");
        group.className = "shop-group";
        day.ingredienten.forEach(function (ing, idx) {
          if (isTapWater(parseIngredientLine(ing).name)) return;
          var key = entry.key + "|" + idx;
          var isChecked = !!shoppingChecked[key];
          var row = document.createElement("div");
          row.className = "shop-item" + (isChecked ? " checked" : "");
          var box = document.createElement("span");
          box.className = "shop-check" + (isChecked ? " on" : "");
          box.innerHTML = isChecked
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '';
          var txt = document.createElement("span");
          txt.textContent = scaleIngredientText(ing, entry.servings || 1);
          row.appendChild(box);
          row.appendChild(txt);
          row.onclick = function () {
            shoppingChecked[key] = !shoppingChecked[key];
            render();
          };
          group.appendChild(row);
        });
        main.appendChild(group);
      });
    } else {
      CATEGORY_ORDER.forEach(function (cat) {
        var items = byCategory[cat];
        if (!items.length) return;

        var label = document.createElement("div");
        label.className = "section-label";
        label.textContent = cat + " (" + items.length + ")";
        main.appendChild(label);

        var group = document.createElement("div");
        group.className = "shop-group";
        items.forEach(function (item) {
          var isChecked = !!shoppingChecked[item.key];
          var row = document.createElement("div");
          row.className = "shop-item" + (isChecked ? " checked" : "");
          var box = document.createElement("span");
          box.className = "shop-check" + (isChecked ? " on" : "");
          box.innerHTML = isChecked
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '';
          var txt = document.createElement("span");
          var itemPriceInfo = priceCache[item.text];
          txt.textContent = item.text + (itemPriceInfo ? " (" + formatEuro(itemPriceInfo.laag) + " – " + formatEuro(itemPriceInfo.hoog) + ")" : "");
          row.appendChild(box);
          row.appendChild(txt);
          row.onclick = function () {
            shoppingChecked[item.key] = !shoppingChecked[item.key];
            render();
          };
          group.appendChild(row);
        });
        main.appendChild(group);
      });
    }

    app.appendChild(main);
  }

  function generateShoppingPdfBlob(title, entries, mode) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var margin = 48;
    var y = margin;
    var lineH = 16;
    var maxY = doc.internal.pageSize.getHeight() - margin;

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function measureWrappedLines(text, size) {
      var s = size || 11.5;
      var boxSize = s * 0.65;
      var textIndent = boxSize + 8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(s);
      return doc.splitTextToSize(text, pageW - margin * 2 - textIndent).length;
    }
    function heading(text, size) {
      ensureRoom(size + 10);
      doc.setTextColor(14, 26, 48);
      doc.setFont("times", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(16, 24, 43);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11.5);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }
    function checkboxLine(text, opts) {
      var size = opts && opts.size ? opts.size : 11.5;
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(size);
      var boxSize = size * 0.65;
      var textIndent = boxSize + 8;
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2 - textIndent);
      wrapped.forEach(function (line, idx) {
        ensureRoom(lineH);
        if (idx === 0) {
          doc.setDrawColor(150, 142, 125);
          doc.rect(margin, y - boxSize + 2, boxSize, boxSize);
        }
        doc.text(line, margin + textIndent, y);
        y += lineH;
      });
    }

    heading("Boodschappenlijst — " + title, 20);
    doc.setDrawColor(184, 134, 59);
    doc.setLineWidth(2);
    doc.line(margin, y - 2, margin + 50, y - 2);
    doc.setLineWidth(1);
    y += 10;

    if (mode === "day") {
      entries.forEach(function (entry) {
        var day = entry.day;
        var visibleIngs = day.ingredienten.filter(function (ing) { return !isTapWater(parseIngredientLine(ing).name); });
        var estHeight = 16 + 13 + 8;
        visibleIngs.forEach(function (ing) { estHeight += measureWrappedLines(scaleIngredientText(ing, entry.servings || 1), 11.5) * lineH; });
        estHeight += 6;
        var availableOnFreshPage = maxY - margin;
        if (y > margin && y + estHeight > maxY && estHeight <= availableOnFreshPage) { doc.addPage(); y = margin; }
        ensureRoom(24);
        doc.setDrawColor(231, 223, 204);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(entry.label + " — " + day.name, 13);
        visibleIngs.forEach(function (ing) { checkboxLine(scaleIngredientText(ing, entry.servings || 1), { size: 11.5 }); });
        y += 6;
      });
    } else {
      var byCategory = buildAggregatedShoppingList(entries);
      CATEGORY_ORDER.forEach(function (cat) {
        var items = byCategory[cat];
        if (!items.length) return;
        var estHeight = 16 + 13 + 8;
        items.forEach(function (item) { estHeight += measureWrappedLines(item.text, 11.5) * lineH; });
        estHeight += 6;
        var availableOnFreshPage = maxY - margin;
        if (y > margin && y + estHeight > maxY && estHeight <= availableOnFreshPage) { doc.addPage(); y = margin; }
        ensureRoom(24);
        doc.setDrawColor(231, 223, 204);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(cat, 13);
        items.forEach(function (item) { checkboxLine(item.text, { size: 11.5 }); });
        y += 6;
      });
    }

    return doc.output("blob");
  }

  function exportShoppingPdf(title, entries, btn, mode) {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      if (btn) btn.textContent = "PDF-bibliotheek niet geladen";
      return;
    }
    if (btn) btn.textContent = "PDF wordt gemaakt…";
    var blob = generateShoppingPdfBlob(title, entries, mode);
    downloadPdf(blob, "boodschappenlijst-" + title, btn, "Exporteer boodschappenlijst");
  }

  function renderShopping() {
    var week = findWeek(state.weekId);
    renderShoppingList(week.title, buildDayEntries(week), function () { goto("week", { weekId: week.id }); });
  }

  function renderPlanShopping() {
    var pw = findPlannedWeek(state.planWeekId);
    var monday = new Date(pw.weekStart);
    renderShoppingList(formatWeekLabel(monday), buildPlanEntries(pw), function () { goto("planweek", { planWeekId: pw.id }); });
  }

  function generatePdfBlob(title, subtitle, entries) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 48;
    var y = margin;
    var lineH = 15;
    var maxY = pageH - margin;

    var NAVY = [14, 26, 48];
    var INK = [16, 24, 43];
    var MUTED = [107, 97, 82];
    var ORANGE = [184, 134, 59];
    var ORANGE_INK = [42, 28, 0];
    var KH_BG = [233, 231, 222], KH_INK = [16, 24, 43];
    var EIWIT_BG = [237, 234, 225], EIWIT_INK = [74, 68, 56];
    var VET_BG = [243, 230, 208], VET_INK = [138, 98, 32];
    var NEUTRAL_BG = [247, 242, 231];
    var LINE = [231, 223, 204];

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function heading(text, size, color) {
      ensureRoom(size + 10);
      doc.setTextColor(color[0], color[1], color[2]);
      doc.setFont("times", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(INK[0], INK[1], INK[2]);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }
    function measureLines(text, size, bold) {
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      return doc.splitTextToSize(text, pageW - margin * 2).length;
    }
    function drawBadge(x, yTop, text, fill, ink) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      var padX = 8, h = 16;
      var w = doc.getTextWidth(text) + padX * 2;
      doc.setFillColor(fill[0], fill[1], fill[2]);
      doc.roundedRect(x, yTop, w, h, 8, 8, "F");
      doc.setTextColor(ink[0], ink[1], ink[2]);
      doc.text(text, x + padX, yTop + h / 2 + 3);
      doc.setTextColor(INK[0], INK[1], INK[2]);
      return x + w + 6;
    }

    // --- Cover page ---
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, pageW, 220, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("times", "bold");
    doc.setFontSize(30);
    doc.splitTextToSize(title, pageW - margin * 2).forEach(function (line, i) {
      doc.text(line, margin, 110 + i * 34);
    });
    if (subtitle) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(12);
      doc.setTextColor(224, 216, 196);
      doc.text(subtitle, margin, 168);
    }
    doc.setDrawColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    doc.setLineWidth(2);
    doc.line(margin, 190, margin + 60, 190);
    doc.setLineWidth(1);

    y = 260;
    doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text(entries.length + (entries.length === 1 ? " gerecht in dit menu" : " gerechten in dit menu"), margin, y);
    y += 26;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    entries.forEach(function (entry) {
      ensureRoom(lineH + 2);
      var left = entry.label + " — " + entry.day.name;
      var right = entry.day.prep ? "" : (entry.day.kcal + " kcal");
      doc.setTextColor(INK[0], INK[1], INK[2]);
      var leftLines = doc.splitTextToSize(left, pageW - margin * 2 - 70);
      doc.text(leftLines[0], margin, y);
      if (right) {
        doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text(right, pageW - margin, y, { align: "right" });
      }
      y += lineH;
    });

    // --- Dish pages ---
    doc.addPage();
    y = margin;

    entries.forEach(function (entry) {
      var day = entry.day;
      var meta = day.prep ? "" : (day.kcal + " kcal  ·  KH " + day.kh + "%" + (day.khG !== undefined ? " (" + day.khG + "g)" : "") +
        " / Eiwit " + day.eiwit + "%" + (day.eiwitG !== undefined ? " (" + day.eiwitG + "g)" : "") +
        " / Vet " + day.vet + "%" + (day.vetG !== undefined ? " (" + day.vetG + "g)" : "") +
        "  ·  Balans " + day.balans + "%");
      var benodigdhedenText = "Benodigdheden: " + day.benodigdheden;

      var estHeight = 26 + (20 + 8) + 26 + 4 + 4 + 10;
      estHeight += measureLines(benodigdhedenText, 11) * lineH;
      estHeight += measureLines("Ingrediënten:", 11, true) * lineH;
      day.ingredienten.forEach(function (ing) { estHeight += measureLines("• " + ing, 11) * lineH; });
      estHeight += measureLines("Bereiding:", 11, true) * lineH;
      day.steps.forEach(function (st, i) { estHeight += measureLines((i + 1) + ". " + st.title + " — " + st.content, 11) * lineH; });

      if (y > margin && y + estHeight > maxY) { doc.addPage(); y = margin; }

      if (y > margin) {
        doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
        doc.line(margin, y, pageW - margin, y);
        y += 22;
      }

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
      doc.text(entry.label.toUpperCase(), margin, y);
      y += 16;

      heading(day.name, 20, NAVY);
      y += 2;

      var bx = margin;
      if (day.prep) {
        bx = drawBadge(bx, y, day.benodigdheden, NEUTRAL_BG, INK);
      } else {
        bx = drawBadge(bx, y, day.kcal + " kcal", NEUTRAL_BG, INK);
        bx = drawBadge(bx, y, "KH " + day.kh + "%" + (day.khG !== undefined ? " (" + day.khG + "g)" : ""), KH_BG, KH_INK);
        bx = drawBadge(bx, y, "Eiwit " + day.eiwit + "%" + (day.eiwitG !== undefined ? " (" + day.eiwitG + "g)" : ""), EIWIT_BG, EIWIT_INK);
        bx = drawBadge(bx, y, "Vet " + day.vet + "%" + (day.vetG !== undefined ? " (" + day.vetG + "g)" : ""), VET_BG, VET_INK);
        bx = drawBadge(bx, y, "Balans " + day.balans + "%", ORANGE, ORANGE_INK);
      }
      y += 16 + 12;

      if (!day.prep) { bodyLines(benodigdhedenText, { size: 11 }); y += 4; }

    var totalPages = doc.internal.getNumberOfPages();

    if (state.variating) return;
    state.variateError = null;

    render();

    claude.use("sample").then(function (sample) {

        state.variating = false;
        busyEnd();

      }
      var variationCurrent = {
        name: day.name, kcal: day.kcal,
        ingredienten: day.ingredienten,
        benodigdheden: day.benodigdheden,
        steps: day.steps.map(function (s) { return s.title + ": " + s.content; })
      };
      sample.json({ action: "variation", current: variationCurrent, kind: kind, params: { goal: prefs.goal, dietStyle: prefs.dietStyle } }, { modelTier: "default" }).then(function (d) {
        var kcal = Number(d.kcal) || 0;
        var khG = Number(d.kh_g) || 0;
        var eiwitG = Number(d.eiwit_g) || 0;
        var vetG = Number(d.vet_g) || 0;
        var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
        var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
        var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
        day.name = String(d.name || day.name);

        day.khG = khG; day.eiwitG = eiwitG; day.vetG = vetG;
        day.balans = computeBalance(khPct, eiwitPct, vetPct);
        day.benodigdheden = String(d.benodigdheden || day.benodigdheden);
        day.ingredienten = Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : day.ingredienten;
        day.steps = Array.isArray(d.steps) && d.steps.length ? d.steps.map(function (s) {
          var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
          if (s.timer_seconds) st.timer = Number(s.timer_seconds);
          return st;
        }) : day.steps;
        day.profile = currentProfileSnapshot();

  function collectWeekDishes(pw) {
    var seen = {};
    var out = [];
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var dishKey = assigned.dayId;
        var servings = assigned.servings || 1;
        if (seen[dishKey]) { seen[dishKey].count += servings; return; }
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var entry = { day: resolved.day, count: servings };
        seen[dishKey] = entry;
        out.push(entry);
      });
    });
    return out;
  }

  function collectExistingByType() {
    var byType = {};
    PLAN_MEALS.forEach(function (m) { byType[m] = []; });
    var seenIds = {};
    WEEKS.forEach(function (w) {
      w.days.forEach(function (d) {
        if (d.prep || !d.mealType || !byType[d.mealType]) return;
        if (seenIds[d.id]) return;
        seenIds[d.id] = true;
        byType[d.mealType].push({ week: w, day: d });
      });
    });
    return byType;
  }

  function generateAutoWeek(pw, onlyExisting) {
    if (pw.autoFilling) return;
    pw.autoFillError = null;

    try {
      var existingByType = collectExistingByType();
      var needed = {};
      var anyNeeded = false;
      PLAN_MEALS.forEach(function (m) {
        var have = existingByType[m].length;
        var want = AUTOWEEK_COUNTS[m];
        if (have < want) { needed[m] = want - have; anyNeeded = true; }
      });

      var finishFill = function (newDays) {
        var buckets = {};
        PLAN_MEALS.forEach(function (m) {
          var pool = existingByType[m].slice(0, AUTOWEEK_COUNTS[m]);
          var extra = newDays.filter(function (d) { return d.mealType === m; }).map(function (d) {
            return { week: findWeek(d.__weekId), day: d };
          });
          buckets[m] = pool.concat(extra);
        });
        var cursors = {};
        PLAN_MEALS.forEach(function (m) { cursors[m] = 0; });
        PLAN_DAYS.forEach(function (d) {
          PLAN_SLOTS.forEach(function (slot) {
            var key = d + "|" + slot;
            if (pw.slots[key]) return;
            var m = SLOT_TO_MEALTYPE[slot];
            var bucket = buckets[m];
            if (!bucket || !bucket.length) return;
            var item = bucket[cursors[m] % bucket.length];
            cursors[m]++;
            pw.slots[key] = { name: item.day.name, weekId: item.week.id, dayId: item.day.id, balans: item.day.balans };
          });
        });
        pw.autoFilling = false;
        savePlannedWeeks();
        showToast("Week is automatisch ingevuld.");
        render();
      };

      if (!anyNeeded || onlyExisting) {
        // Everything needed is already available, or the user chose to use only saved dishes — no generation.
        finishFill([]);
        return;
      }

      pw.autoFilling = true;
      busyStart("Week wordt automatisch ingevuld…");
      render();

      claude.use("sample").then(function (sample) {
        if (!sample) {
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = "Genereren is in deze weergave niet beschikbaar.";
          render();
          return;
        }
        var bgParams = {
          cuisines: prefs.cuisines, flavors: prefs.flavors, level: prefs.level, dietStyle: prefs.dietStyle,
          equipment: prefs.equipment, goal: prefs.goal, gender: prefs.gender, heightCm: prefs.heightCm,
          weightKg: prefs.weightKg, age: prefs.age, activityLevel: prefs.activityLevel
        };
        sample.json({ action: "background", needed: needed, params: bgParams }, { modelTier: "default" }).then(function (result) {
          try {
            var list = extractDishArray(result);
            if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");

            var days = dishesFromAiList(list, "auto");
            var monday = new Date(pw.weekStart);
            var newWeek = {
              id: "auto" + Date.now(),
              title: "Automatisch ingevuld",
              subtitle: formatWeekLabel(monday),
              days: days
            };
            WEEKS.unshift(newWeek);
            persistDishesToDb(days);
            days.forEach(function (d) { d.__weekId = newWeek.id; });

            busyEnd();
            finishFill(days);
          } catch (innerErr) {
            console.error("Auto-fill week: verwerken van resultaat mislukt", innerErr, result);
            pw.autoFilling = false;
            busyEnd();
            pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
            render();
          }
        }).catch(function (e) {
          console.error("Auto-fill week: genereren mislukt", e);
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." : "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
          render();
        });
      });
    } catch (e) {
      console.error("Auto-fill week: onverwachte fout", e);
      pw.autoFilling = false;
      busyEnd();
      pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
      render();
    }
  }

  function persistDishImageUpdate(day) {
    if (!dbCap || !userCap || !day.mealType) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var ref = dbCap.doc("data/users/" + uid + "/dishes");

        if (!snap.exists) return;
        var current = deepClone(snap.data() || {});
        var arr = current[day.mealType];
        if (!Array.isArray(arr)) return;
        var idx = -1;
        for (var i = 0; i < arr.length; i++) { if (arr[i].id === day.id) { idx = i; break; } }
        if (idx === -1) return;
        arr[idx].imageUrl = day.imageUrl;
        arr[idx].imageCredit = day.imageCredit || null;
        ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

  function loadDishImageInto(day, imgEl, captionEl) {
    if (day.imageUrl) { imgEl.src = day.imageUrl; imgEl.style.display = ""; return; }
    if (day.imageUrl === null) { imgEl.style.display = "none"; return; }
    fetch("/api/image?query=" + encodeURIComponent(day.name)).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null };
    }).then(function (data) {
      day.imageUrl = data.url || null;
      day.imageCredit = data.credit || null;
      if (day.imageUrl) {
        imgEl.src = day.imageUrl;
        imgEl.style.display = "";
        if (captionEl && day.imageCredit && day.imageCredit.name) {
          captionEl.textContent = "Foto: " + day.imageCredit.name + " (Unsplash)";
          captionEl.style.display = "";
        }
      } else {
        imgEl.style.display = "none";
      }
      persistDishImageUpdate(day);
    }).catch(function () {
      day.imageUrl = null;
      imgEl.style.display = "none";
    });
  }

  function persistDishesToDb(daysList) {
    if (!dbCap || !userCap || !daysList || !daysList.length) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var ref = dbCap.doc("data/users/" + uid + "/dishes");
      ref.get().then(function (snap) {
        var current = snap.exists ? deepClone(snap.data() || {}) : {};
        PLAN_MEALS.forEach(function (m) {
          var toAdd = daysList.filter(function (d) { return d.mealType === m; }).map(dishToPlainObject);
          if (!toAdd.length) return;
          var existing = Array.isArray(current[m]) ? current[m] : [];
          var merged = existing.concat(toAdd);
          if (merged.length > 40) merged = merged.slice(merged.length - 40);
          current[m] = merged;
        });
        ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

      ref.get().then(function (snap) {
        if (!snap.exists) return;
        var current = deepClone(snap.data() || {});
        var changed = false;
        PLAN_MEALS.forEach(function (m) {
          if (!Array.isArray(current[m])) return;
          var before = current[m].length;
          current[m] = current[m].filter(function (d) { return d.id !== dishId; });
          if (current[m].length !== before) changed = true;
        });
        if (changed) ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

  function clearAllDishesFromDb() {
    if (!dbCap || !userCap) return;
    userCap.id().then(function (uid) {
      if (!uid) return;
      var empty = {};
      PLAN_MEALS.forEach(function (m) { empty[m] = []; });
      dbCap.doc("data/users/" + uid + "/dishes").set(empty).catch(function () {});
    }).catch(function () {});
  }

  function deleteOneStoredDish(item) {
    askConfirm("\"" + item.day.name + "\" verwijderen?", function () {
      var dishId = item.day.id;
      WEEKS.forEach(function (w) { w.days = w.days.filter(function (d) { return d.id !== dishId; }); });
      var changed = false;
      plannedWeeks.forEach(function (pw) {
        Object.keys(pw.slots).forEach(function (key) {
          if (pw.slots[key].dayId === dishId) { delete pw.slots[key]; changed = true; }
        });
      });
      deleteDishFromDb(dishId);
      if (changed) savePlannedWeeks();
      render();
    });
  }

  function clearAllStoredDishes() {
    askConfirm("Alle opgeslagen gerechten verwijderen? Dit maakt ook je huidige weekplanning leeg en kan niet ongedaan gemaakt worden.", function () {
      WEEKS.length = 0;
      plannedWeeks.forEach(function (pw) { pw.slots = {}; });
      clearAllDishesFromDb();
      savePlannedWeeks();
      render();
    });
  }

  function addToCacheLibrary(daysList) {
    if (!daysList || !daysList.length) return;
    var cacheWeek = WEEKS.filter(function (w) { return w.id === "cache"; })[0];
    if (!cacheWeek) {
      cacheWeek = { id: "cache", title: "Opgeslagen gerechten", subtitle: "Eerder gegenereerd — direct te gebruiken", days: [] };
      WEEKS.push(cacheWeek);
    }
    cacheWeek.days = cacheWeek.days.concat(daysList);
  }

  function dishesFromAiList(list, prefix) {
    return list.map(function (d, idx) {
      var kcal = Number(d.kcal) || 0;
      var khG = Number(d.kh_g) || 0;
      var eiwitG = Number(d.eiwit_g) || 0;
      var vetG = Number(d.vet_g) || 0;
      var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
      var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
      var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
      var dishMealType = PLAN_MEALS.indexOf(d.mealType) > -1 ? d.mealType : "Diner";
      var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
        var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
        if (s.timer_seconds) st.timer = Number(s.timer_seconds);
        return st;
      }) : [{ title: "Bereiding", content: "Geen bereidingsstappen ontvangen." }];
      return {
        id: prefix + Date.now() + "_" + idx,
        label: "Gerecht " + (idx + 1),
        name: String(d.name || "Naamloos gerecht"),
        kcal: kcal, kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: computeBalance(khPct, eiwitPct, vetPct),
        khG: khG, eiwitG: eiwitG, vetG: vetG,
        mealType: dishMealType,
        benodigdheden: String(d.benodigdheden || ""),
        ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
        steps: steps,
        profile: currentProfileSnapshot()
      };
    });
  }

  function backgroundGenerate(needed) {
    claude.use("sample").then(function (sample) {
      if (!sample) return;
      busyStart("Gerechten worden aangevuld op de achtergrond…");
      var bgParams2 = {
        cuisines: prefs.cuisines, flavors: prefs.flavors, level: prefs.level, dietStyle: prefs.dietStyle,
        equipment: prefs.equipment, goal: prefs.goal, gender: prefs.gender, heightCm: prefs.heightCm,
        weightKg: prefs.weightKg, age: prefs.age, activityLevel: prefs.activityLevel
      };
      sample.json({ action: "background", needed: needed, params: bgParams2 }, { modelTier: "default" }).then(function (result) {
        busyEnd();
        var list = extractDishArray(result);
        if (!list || !list.length) return;
        var days = dishesFromAiList(list, "bg");
        addToCacheLibrary(days);
        persistDishesToDb(days);
        showToast(days.length + " nieuwe gerechten zijn toegevoegd aan je bibliotheek.");
        render();
      }).catch(function () { busyEnd(); });
    });
  }

  function initPersistence() {
    claude.use("db").then(function (db) {
      dbCap = db;
      if (!db) return;
      claude.use("user").then(function (u) {
        userCap = u;
        if (!u) return;
        u.id().then(function (uid) {
          if (!uid) return;
          var prefsRef = db.doc("data/users/" + uid + "/prefs");
          prefsRef.get().then(function (psnap) {
            if (!psnap.exists) {
              if (state.view === "weeks") { state.wizardStep = 0; state.view = "wizard"; render(); }
              return;
            }
            var pdata = psnap.data() || {};
            ["cuisines", "flavors", "level", "dietStyle", "equipment", "exclude", "count", "mealTypes", "gender", "heightCm", "weightKg", "age", "activityLevel", "goal"].forEach(function (k) {
              if (pdata[k] !== undefined) prefs[k] = deepClone(pdata[k]);
            });
            render();
          }).catch(function () {});

          var planRef = db.doc("data/users/" + uid + "/plannedWeeks");
          planRef.get().then(function (plansnap) {
            if (!plansnap.exists) return;
            var pldata = plansnap.data() || {};
            var list = Array.isArray(pldata.list) ? pldata.list : [];
            list.forEach(function (item) {
              plannedWeeks.push({
                id: item.id,
                weekStart: item.weekStart,
                slots: item.slots ? deepClone(item.slots) : {},
                dynamicPrep: item.dynamicPrep ? deepClone(item.dynamicPrep) : null,
                prepGenerating: false,
                prepError: null,
                autoFilling: false,
                autoFillError: null
              });
            });
            if (list.length) render();
          }).catch(function () {});

          var ref = db.doc("data/users/" + uid + "/dishes");
          ref.get().then(function (snap) {
            var data = snap.exists ? (snap.data() || {}) : {};
            var cached = [];
            PLAN_MEALS.forEach(function (m) {
              var arr = Array.isArray(data[m]) ? data[m] : [];
              arr.forEach(function (d) {
                var clone = deepClone(d);
                if (clone.label) clone.label = String(clone.label).replace(/^AI-/i, "");
                cached.push(clone);
              });
            });
            if (cached.length) {
              addToCacheLibrary(cached);
              render();
            }
          }).catch(function () {});
        }).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
  }

  function renderCook() {
    var week = findWeek(state.weekId);
    var day = findDay(week, state.dayId);
    var step = day.steps[state.stepIndex];
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar(day.name, true, function () { goto("day", { weekId: week.id, dayId: day.id }); }));
    var main = document.createElement("main");

    var progress = document.createElement("div");
    progress.className = "cook-progress";
    day.steps.forEach(function (s, i) {
      var dot = document.createElement("div");
      dot.className = "cook-dot" + (i < state.stepIndex ? " done" : i === state.stepIndex ? " current" : "");
      progress.appendChild(dot);
    });
    main.appendChild(progress);

    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Stap " + (state.stepIndex + 1) + " van " + day.steps.length;
    main.appendChild(eyebrow);

    var title = document.createElement("h2");
    title.className = "cook-step-title";
    title.textContent = step.title;
    main.appendChild(title);

    var body = document.createElement("div");
    body.className = "cook-step-body";
    body.textContent = step.content;
    main.appendChild(body);

    if (step.timer) {
      timerRemaining = timerRemaining && timerRunning ? timerRemaining : step.timer;
      var box = document.createElement("div");
      box.className = "timer-box";
      var clock = document.createElement("div");
      clock.className = "timer-clock";
      clock.id = "timerClock";
      clock.textContent = fmtClock(timerRemaining);
      var tbtn = document.createElement("button");
      tbtn.className = "ghost-btn";
      tbtn.id = "timerToggle";
      tbtn.textContent = timerRunning ? "Pauzeer" : "Start timer";
      tbtn.onclick = function () { toggleTimer(step.timer); };
      box.appendChild(clock);
      box.appendChild(tbtn);
      main.appendChild(box);
    } else {
      timerRemaining = 0;
      stopTimer();
    }

    var spacer = document.createElement("div");
    spacer.style.flex = "1";
    main.appendChild(spacer);

    var nav = document.createElement("div");
    nav.className = "cook-nav";
    if (state.stepIndex > 0) {
      var prev = document.createElement("button");
      prev.className = "ghost-btn";
      prev.textContent = "Vorige";
      prev.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex - 1 }); };
      nav.appendChild(prev);
    }
    var next = document.createElement("button");
    next.className = "primary-btn";
    if (state.stepIndex < day.steps.length - 1) {
      next.textContent = "Volgende stap";
      next.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex + 1 }); };
    } else {
      next.textContent = "Klaar — eet smakelijk";
      next.onclick = function () { goto("day", { weekId: week.id, dayId: day.id }); };
    }
    nav.appendChild(next);
    main.appendChild(nav);

    app.appendChild(main);
  }

  function toggleTimer(total) {
    if (timerRunning) {
      stopTimer();
      var btn = document.getElementById("timerToggle");
      if (btn) btn.textContent = "Hervat";
      return;
    }
    if (timerRemaining <= 0) timerRemaining = total;
    timerRunning = true;
    var btn2 = document.getElementById("timerToggle");
    if (btn2) btn2.textContent = "Pauzeer";
    timerInterval = setInterval(function () {
      timerRemaining -= 1;
      var clock = document.getElementById("timerClock");
      if (clock) clock.textContent = fmtClock(Math.max(timerRemaining, 0));
      if (timerRemaining <= 0) {
        stopTimer();
        var btn3 = document.getElementById("timerToggle");
        if (btn3) btn3.textContent = "Start timer";
      }
    }, 1000);
  }

  function render() {
    try {
      if (state.view === "weeks") renderWeeks();
      else if (state.view === "library") renderLibrary();
      else if (state.view === "guide") renderGuide();
      else if (state.view === "wizard") renderWizard();
      else if (state.view === "prefs") renderPrefs();
      else if (state.view === "plan") renderPlan();
      else if (state.view === "planadd") renderPlanAdd();
      else if (state.view === "planweek") renderPlanWeek();
      else if (state.view === "planday") renderPlanDay();
      else if (state.view === "planprep") renderPlanPrep();
      else if (state.view === "planpick") renderPlanPick();
      else if (state.view === "week") renderWeek();
      else if (state.view === "shopping") renderShopping();
      else if (state.view === "planshopping") renderPlanShopping();
      else if (state.view === "day") renderDay();
      else if (state.view === "cook") renderCook();
      else renderWeeks();
    } catch (e) {
      console.error("Render error op scherm '" + state.view + "':", e);
      document.getElementById("app").innerHTML =
        '<div class="empty-hint">Er ging iets mis bij het laden van dit scherm.<br><br>' +
        '<span style="font-size:12px;color:var(--muted);">' + (e && e.message ? String(e.message).replace(/</g,"&lt;") : "Onbekende fout") + '</span></div>';
    }
  }

  initPersistence();
  render();
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
