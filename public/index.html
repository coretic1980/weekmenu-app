  // ---- live stand van een gedeelde lijst ----
  function loadPending(token) {
    try {
      var all = JSON.parse(localStorage.getItem(SHARE_PENDING_KEY) || "{}") || {};
      return all[token] && typeof all[token] === "object" ? all[token] : {};
    } catch (e) { return {}; }
  }
  function savePending(token, pending) {
    try {
      var all = JSON.parse(localStorage.getItem(SHARE_PENDING_KEY) || "{}") || {};
      if (Object.keys(pending).length) all[token] = pending; else delete all[token];
      localStorage.setItem(SHARE_PENDING_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function liveFor(token) {
    if (!sharedLive[token]) {
      sharedLive[token] = { loaded: false, gone: false, items: {}, order: [], state: {}, rev: 0, pending: loadPending(token), online: true, flushing: null, ticking: null };
    }
    return sharedLive[token];
  }
  function liveStatus(live, id) {
    if (Object.prototype.hasOwnProperty.call(live.pending, id)) return live.pending[id];
    return live.state[id] || null;
  }
  function liveCounts(live) {
    var basket = 0, skip = 0;
    live.order.forEach(function (id) {
      var s = liveStatus(live, id);
      if (s === "basket") basket++; else if (s === "skip") skip++;
    });
    return { total: live.order.length, basket: basket, skip: skip, todo: live.order.length - basket - skip };
  }
  function forgetShare(token) {
    var shares = loadShares();
    Object.keys(shares).forEach(function (k) { if (shares[k] === token) delete shares[k]; });
    saveShares(shares);
    setShareMeta(token, null);
  }

  // Verstuurt eigen, nog niet bevestigde tikken één voor één. Lukt dat niet (geen bereik), dan blijven ze
  // bewaard en proberen we het bij de volgende ronde opnieuw.
  function liveFlush(token) {
    var live = liveFor(token);
    if (live.flushing) return live.flushing;
    function next() {
      var ids = Object.keys(live.pending);
      if (!ids.length) return Promise.resolve();
      var id = ids[0], status = live.pending[id];
      return fetch("/api/lists/" + token + "/item", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: id, status: status })
      }).then(function (res) {
        if (res.status === 404 || res.status === 400) {
          // product staat niet meer op de gedeelde lijst (of de lijst is weg): niet blijven proberen
          if (live.pending[id] === status) delete live.pending[id];
          return;
        }
        if (!res.ok) throw new Error("http " + res.status);
        if (live.pending[id] === status) {
          delete live.pending[id];
          if (status) live.state[id] = status; else delete live.state[id];
        }
      }).then(function () { savePending(token, live.pending); return next(); });
    }
    live.flushing = next().then(function () { live.online = true; }, function () { live.online = false; }).then(function () {
      live.flushing = null;
      refreshShareUi(false);
    });
    return live.flushing;
  }

  // Haalt de stand van de server op. Geeft true terug als er iets veranderd is.
  function livePoll(token) {
    var live = liveFor(token);
    return fetch("/api/lists/" + token + (live.rev ? "?rev=" + live.rev : "")).then(function (res) {
      if (res.status === 404) return { gone: true };
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    }).then(function (body) {
      live.online = true;
      if (body.gone) {
        live.gone = true;
        forgetShare(token);
        return true;
      }
      if (!body.unchanged && Array.isArray(body.items)) {
        live.items = {};
        live.order = [];
        body.items.forEach(function (it) { live.items[it.id] = it; live.order.push(it.id); });
        live.state = body.state || {};
        live.rev = body.rev;
        live.fetchedAt = Date.now();
        live.loaded = true;
        Object.keys(live.pending).forEach(function (id) { if (!live.items[id]) delete live.pending[id]; });
        savePending(token, live.pending);
        return true;
      }
      live.loaded = true;
      return false;
    }).catch(function () {
      live.online = false;
      return false;
    });
  }

  function liveTick(token) {
    var live = liveFor(token);
    if (live.ticking) return live.ticking;
    live.ticking = liveFlush(token).then(function () { return livePoll(token); }).then(function (changed) {
      live.ticking = null;
      refreshShareUi(changed);
    });
    return live.ticking;
  }

  // Tik van de gebruiker op een product van de gedeelde lijst ("basket" = in mandje, "skip" = niet nodig).
  function liveToggle(token, id, kind) {
    var live = liveFor(token);
    var current = liveStatus(live, id);
    live.pending[id] = current === kind ? null : kind;
    savePending(token, live.pending);
    shareLastTapAt = Date.now();
    render();
    liveFlush(token);
  }

  function shareStatusLine(token) {
    var live = sharedLive[token];
    if (!live || (!live.loaded && !live.gone)) return "Gedeelde lijst \u00b7 stand ophalen\u2026";
    if (live.gone) return "Deze gedeelde lijst bestaat niet meer (verlopen of gestopt).";
    var c = liveCounts(live);
    var pend = Object.keys(live.pending).length;
    var line = "Gedeelde lijst \u00b7 " + c.basket + " in mandje" + (c.skip ? " \u00b7 " + c.skip + " niet nodig" : "") + " \u00b7 " + c.todo + " nog te doen";
    if (!live.online) line += " \u00b7 geen verbinding" + (pend ? " (" + pend + " wijziging" + (pend === 1 ? "" : "en") + " volgt)" : "");
    if (shareDrifting[token]) {
      var rt = autoSyncRt[token];
      if (!loadShareMeta()[token]) line += " \u00b7 de lijst is aangepast sinds je deelde";
      else if (rt && rt.retryAt && Date.now() < rt.retryAt) line += " \u00b7 bijwerken lukte niet, nieuwe poging volgt";
      else line += " \u00b7 wordt zo automatisch bijgewerkt";
    }
    return line;
  }

  // Is de lijst in de app anders dan wat gedeeld is (bijvoorbeeld door een aangepast plan)?
  function shareDrift(token, info) {
    var live = sharedLive[token];
    if (!live || !live.loaded || live.gone) return false;
    if (info.items.length !== live.order.length) return true;
    return info.items.some(function (it) { var s = live.items[it.id]; return !s || s.text !== it.text || s.cat !== it.cat; });
  }

  // Ververst het scherm als er iets veranderd is (niet midden in een tik van de gebruiker), en anders alleen de statusregel.
  function refreshShareUi(changed) {
    if (!onShoppingView()) return;
    if (changed) {
      var wait = 1200 - (Date.now() - shareLastTapAt);
      if (wait > 0) setTimeout(function () { if (onShoppingView()) render(); }, wait + 50);
      else render();
      return;
    }
    if (shareStatusEl && shareStatusToken) shareStatusEl.textContent = shareStatusLine(shareStatusToken);
  }

  // Elke 8 seconden bijwerken zolang je op het boodschappenscherm bent.
  function startShareTimer() {
    if (shareTimer) return;
    shareTimer = setInterval(function () {
      if (!onShoppingView() || !shareStatusToken) { clearInterval(shareTimer); shareTimer = null; return; }
      if (typeof document !== "undefined" && document.hidden) return;
      liveTick(shareStatusToken);
    }, SHARE_POLL_MS);
  }

  // ---- automatisch bijwerken ----
  // Wijzig je het plan (gerecht erbij, eraf, andere porties), dan werken we de gedeelde lijst na een paar
  // seconden rust vanzelf bij, ook als je niet op het boodschappenscherm bent. We vergelijken steeds wat de
  // lijst nu zou zijn met wat we het laatst deelden. Zo hoeft er geen aparte handeling; wel alleen zolang
  // de app openstaat. De server maakt hier nooit een nieuwe lijst voor aan (updateOnly).
  function shareSignature(items) {
    return items.map(function (i) { return i.id + "|" + i.cat + "|" + i.text; }).join("\n");
  }
  function loadShareMeta() {
    try { return JSON.parse(localStorage.getItem(SHARE_META_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function setShareMeta(token, meta) {
    try {
      var all = loadShareMeta();
      if (meta) all[token] = meta; else delete all[token];
      localStorage.setItem(SHARE_META_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function currentShareSource() {
    if (state.view === "planshopping") return { kind: "plan", refId: state.planWeekId };
    if (state.view === "shopping") return { kind: "week", refId: state.weekId };
    return null;
  }
  // Bouwt de gerechten van een gedeelde lijst opnieuw op uit het plan waar hij van komt.
  function shareSourceFor(meta) {
    if (meta.kind === "plan") {
      var pw = findPlannedWeek(meta.refId);
      return pw ? { title: formatWeekLabel(new Date(pw.weekStart)), entries: buildPlanEntries(pw) } : null;
    }
    if (meta.kind === "week") {
      var wk = findWeek(meta.refId);
      return wk ? { title: wk.title, entries: buildDayEntries(wk) } : null;
    }
    return null;
  }

  function autoSyncPush(token, title, built, sig) {
    var rt = autoSyncRt[token];
    rt.sending = true;
    fetch("/api/lists", {
      method: "POST",
      headers: shareHeaders(),
      body: JSON.stringify({ token: token, updateOnly: true, title: title, items: built.items, state: built.state })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) { return { status: res.status, data: data }; });
    }).then(function (r) {
      if (r.status === 200 && r.data.token === token) {
        var all = loadShareMeta();
        if (all[token]) { all[token].sig = sig; all[token].title = title; try { localStorage.setItem(SHARE_META_KEY, JSON.stringify(all)); } catch (e) {} }
        rt.pendingSig = null;
        rt.retryAt = 0;
        showToast("Gedeelde boodschappenlijst bijgewerkt.");
        if (sharedLive[token]) liveTick(token);
      } else if (r.status === 404) {
        // de lijst bestaat niet meer: niet stilletjes een nieuwe maken naast een link die niet meer werkt
        forgetShare(token);
        delete sharedLive[token];
        delete shareDrifting[token];
        showToast("De gedeelde boodschappenlijst bestaat niet meer.");
      } else {
        rt.retryAt = Date.now() + 60000;
      }
    }).catch(function () {
      rt.retryAt = Date.now() + 30000;
    }).then(function () {
      rt.sending = false;
    });
  }

  function autoSyncTick() {
    var metas = loadShareMeta();
    var tokens = Object.keys(metas);
    if (!tokens.length) { if (autoSyncTimer) { clearInterval(autoSyncTimer); autoSyncTimer = null; } return; }
    if (typeof document !== "undefined" && document.hidden) return;
    var shares = loadShares(), active = {};
    Object.keys(shares).forEach(function (k) { active[shares[k]] = true; });
    tokens.forEach(function (token) {
      if (!active[token]) { setShareMeta(token, null); return; }      // delen is gestopt of vergeten
      var meta = metas[token];
      var src = shareSourceFor(meta);
      if (!src || !src.entries.length) return;                        // bron weg of leeg: gedeelde lijst blijft zoals hij is
      var built = buildShareItems(src.entries, listKeyFor(meta.kind, src.title));
      var sig = shareSignature(built.items);
      var rt = autoSyncRt[token] || (autoSyncRt[token] = {});
      if (sig === meta.sig) { rt.pendingSig = null; return; }
      if (rt.pendingSig !== sig) { rt.pendingSig = sig; rt.since = Date.now(); return; }   // nieuw verschil: even afwachten
      if (rt.sending || Date.now() - rt.since < AUTO_SYNC_STABLE_MS) return;
      if (rt.retryAt && Date.now() < rt.retryAt) return;
      autoSyncPush(token, src.title, built, sig);
    });
  }

  function startAutoSyncTimer() {
    if (autoSyncTimer) return;
    autoSyncTimer = setInterval(autoSyncTick, AUTO_SYNC_MS);
  }

  function shareMessageText(title, url, count) {
    return "\uD83D\uDED2 Boodschappenlijst: " + title + "\n" + count +
      (count === 1 ? " product" : " producten") + ". Vink af wat in je mandje ligt, of tik \u201cNiet nodig\u201d.\n" + url;
  }

  // Opent WhatsApp met de tekst alvast ingevuld (op de telefoon kies je daar het contact, op de computer
  // opent WhatsApp Web). Via een link met target=_blank: dat mag ook binnen een ge\u00efnstalleerde app.
  function openExternal(url) {
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function openWhatsApp(text) {
    openExternal("https://wa.me/?text=" + encodeURIComponent(text));
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var copied = document.execCommand("copy");
        document.body.removeChild(ta);
        if (copied) resolve(); else reject(new Error("kopi\u00ebren mislukt"));
      } catch (e) { reject(e); }
    });
  }

  function shareHeaders() {
    var h = { "Content-Type": "application/json" };
    var a = window.authHeaders ? window.authHeaders() : {};
    for (var k in a) h[k] = a[k];
    return h;
  }

  // Deelt de lijst, of werkt een al gedeelde lijst bij (zelfde link). Met quiet=true zonder WhatsApp-venster.
  function shareShoppingList(title, entries, btn, quiet, onReady) {
    var built = buildShareItems(entries, shareKeyFor(title));
    if (!built.items.length) { showToast("Er zijn nog geen producten om te delen."); return; }
    var shares = loadShares();
    var key = shareKeyFor(title);
    var existing = shares[key] || null;
    var label = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = quiet ? "Bijwerken\u2026" : "Lijst wordt klaargezet\u2026"; }

    fetch("/api/lists", {
      method: "POST",
      headers: shareHeaders(),
      body: JSON.stringify({ token: existing, title: title, items: built.items, state: built.state })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) { var err = new Error(data.message || "Delen mislukt."); err.status = res.status; throw err; }
        return data;
      });
    }).then(function (data) {
      var updated = existing && data.token === existing;
      shares[key] = data.token;
      saveShares(shares);
      delete sharedLive[data.token];      // stand opnieuw ophalen
      delete shareDrifting[data.token];
      var src = currentShareSource();
      if (src) {
        setShareMeta(data.token, { kind: src.kind, refId: src.refId, title: title, sig: shareSignature(built.items) });
        autoSyncRt[data.token] = {};
        startAutoSyncTimer();
      }
      var url = window.location.origin + data.path;
      var text = shareMessageText(title, url, built.items.length);
      if (onReady) {
        onReady(data, url);
      } else if (quiet) {
        showToast("Gedeelde lijst bijgewerkt.");
      } else {
        askConfirm(
          updated
            ? "Je gedeelde lijst is bijgewerkt (" + built.items.length + " producten). De link die je eerder deelde blijft gewoon werken."
            : "Je lijst is klaar om te delen (" + built.items.length + " producten). Wie de link opent, kan producten afvinken als \u201cin mandje\u201d of \u201cniet nodig\u201d, en jullie zien elkaars vinkjes direct.",
          function () { openWhatsApp(text); },
          "Deel via WhatsApp",
          "Kopieer link",
          function () {
            copyToClipboard(url).then(function () { showToast("Link gekopieerd."); }).catch(function () { showToast("Kopi\u00ebren lukte niet. Link: " + url); });
          }
        );
      }
      render();
    }).catch(function (e) {
      showToast(e.status === 401 ? "Log eerst in om een lijst te kunnen delen." : (e.status ? e.message : "Delen mislukt. Controleer je verbinding en probeer het opnieuw."));
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = label; }
    });
  }

  // ---------- Importeren in Bring! ----------
  // Bring! heeft een officiële "web-to-app"-import: we geven Bring! het adres van een openbare pagina met de
  // producten (/l/<code>/bring, met schema.org-markup, of /l/<code>/bring.json), Bring! haalt die op en opent
  // de app om te importeren. Daarvoor staat de lijst online onder dezelfde geheime link als bij delen. Wat al
  // in het mandje ligt of "niet nodig" is, wordt niet meegenomen. Bring! laat dit alleen via de app doen: er
  // is (in de documentatie) geen manier om zonder de app rechtstreeks in een bepaalde lijst te schrijven.
  //
  // Voordat je kunt importeren vraagt de app om de link van jouw Bring!-lijst. Die staat niet in de code: hij
  // wordt bij jouw voorkeuren bewaard (prefs.bringListLink) en je kunt hem op het boodschappenscherm of bij
  // Voorkeuren wijzigen. Het import-adres van Bring! zelf komt van de server (/api/config).

  // Geeft het genormaliseerde adres terug als het een geldige https-link is, anders null.
  function validBringLink(value) {
    var s = String(value == null ? "" : value).trim();
    if (!s || s.length > 500) return null;
    var u;
    try { u = new URL(s); } catch (e) { return null; }
    if (u.protocol !== "https:" || !u.hostname || u.username || u.password) return null;
    return u.toString();
  }
  // Alleen een waarschuwing (geen blokkade): een link van Bring! bevat "bring" in de domeinnaam.
  function looksLikeBring(link) {
    try { return /bring/i.test(new URL(link).hostname); } catch (e) { return false; }
  }
  // Korte weergave van de link: domein en het einde (dat onderscheidt links van elkaar), het midden vervalt.
  function bringLinkLabel(link) {
    var u = new URL(link);
    var path = u.pathname.replace(/\/$/, "");
    var full = u.hostname + path;
    if (full.length <= 34) return full;
    var segs = path.split("/").filter(Boolean);
    var last = segs.length ? segs[segs.length - 1] : "";
    if (last.length > 16) last = "\u2026" + last.slice(-16);
    return u.hostname + (segs.length > 1 ? "/\u2026/" : "/") + last;
  }

  var bringDialog = { onSave: null, warned: false, saveLabel: "Opslaan" };
  function bringEl(id) { return document.getElementById(id); }
  function showBringError(message) {
    var err = bringEl("bringError");
    err.textContent = message || "";
    err.style.display = message ? "" : "none";
  }
  function closeBringDialog() {
    var o = bringEl("bringOverlay");
    if (o) o.classList.remove("active");
    bringDialog.onSave = null;
  }
  function openBringLinkDialog(opts) {
    bringDialog.onSave = opts.onSave || null;
    bringDialog.warned = false;
    bringDialog.saveLabel = opts.saveLabel || "Opslaan";
    bringEl("bringTitle").textContent = opts.title;
    bringEl("bringMsg").textContent = opts.message;
    var input = bringEl("bringInput");
    input.value = opts.value || "";
    showBringError(opts.error || "");
    bringEl("bringSaveBtn").textContent = bringDialog.saveLabel;
    bringEl("bringOverlay").classList.add("active");
    try { input.focus(); } catch (e) {}
  }
  function submitBringDialog() {
    var link = validBringLink(bringEl("bringInput").value);
    if (!link) {
      bringDialog.warned = false;
      bringEl("bringSaveBtn").textContent = bringDialog.saveLabel;
      showBringError("Dit is geen geldige link. Plak de volledige link, beginnend met https://");
      return;
    }
    if (!looksLikeBring(link) && !bringDialog.warned) {
      bringDialog.warned = true;
      bringEl("bringSaveBtn").textContent = "Toch opslaan";
      showBringError("Dit adres lijkt niet van Bring! te zijn. Controleer of je de juiste link hebt geplakt, of kies \u201cToch opslaan\u201d.");
      return;
    }
    prefs.bringListLink = link;
    savePrefs();
    var next = bringDialog.onSave;
    closeBringDialog();
    if (next) next(link); else render();
  }
  (function wireBringOverlay() {
    var input = bringEl("bringInput"), save = bringEl("bringSaveBtn"), cancel = bringEl("bringCancelBtn");
    if (save) save.onclick = submitBringDialog;
    if (cancel) cancel.onclick = closeBringDialog;
    if (input) {
      input.onkeydown = function (e) { if (e && e.key === "Enter") submitBringDialog(); };
      input.oninput = function () {
        if (bringDialog.warned) {
          bringDialog.warned = false;
          bringEl("bringSaveBtn").textContent = bringDialog.saveLabel;
        }
        showBringError("");
      };
    }
  })();

  // Zorgt dat er een geldige Bring!-lijstlink is voordat de import verder gaat; vraagt er anders om.
  function ensureBringLink(next) {
    var stored = String(prefs.bringListLink || "").trim();
    var link = validBringLink(stored);
    if (link) { next(link); return; }
    openBringLinkDialog({
      title: "Koppel je Bring!-lijst",
      message: "Plak hier de link van je (gedeelde) Bring!-lijst, bijvoorbeeld de link die Bring! geeft als je je lijst deelt. " +
        "Je hebt hem nodig om verder te gaan. Hij wordt bij jouw voorkeuren bewaard en je kunt hem later wijzigen.",
      value: stored,
      error: stored ? "De opgeslagen link is niet geldig. Plak hem opnieuw." : "",
      saveLabel: "Opslaan en verder",
      onSave: next
    });
  }
  function editBringLink() {
    openBringLinkDialog({
      title: "Bring!-link wijzigen",
      message: "Plak de nieuwe link van je Bring!-lijst.",
      value: String(prefs.bringListLink || ""),
      saveLabel: "Opslaan",
      onSave: null
    });
  }

  function bringDeeplink(pageUrl) {
    return window.bringImportEndpoint + "?url=" + encodeURIComponent(pageUrl) + "&source=web";
  }
  function isPublicHttps(origin) {
    return /^https:\/\//.test(origin) && !/^https:\/\/(localhost|127\.|10\.|192\.168\.)/.test(origin);
  }
  function importToBring(title, entries, btn) {
    if (!window.bringImportEndpoint) {
      showToast("De Bring!-koppeling is op de server niet beschikbaar.");
      return;
    }
    if (!isPublicHttps(window.location.origin)) {
      showToast("Bring! kan alleen een openbare https-pagina importeren, dus niet vanaf dit adres.");
      return;
    }
    ensureBringLink(function () {
      shareShoppingList(title, entries, btn, false, function (data) {
        var remaining = data.counts.total - data.counts.basket - data.counts.skip;
        if (remaining <= 0) {
          showToast("Alles staat al in het mandje of is niet nodig: er valt niets te importeren.");
          return;
        }
        var page = window.location.origin + "/l/" + data.token;
        askConfirm(
          "Je lijst staat klaar voor Bring! (" + remaining + (remaining === 1 ? " product" : " producten") + "; wat al in het mandje ligt of op \u201cniet nodig\u201d staat, blijft weg). " +
          "Bring! haalt de lijst op en opent de app om te importeren, dus doe dit op het apparaat waar Bring! op staat. " +
          "Welke Bring!-lijst het wordt, kies je in de app. " +
          "De lijst staat daarvoor online onder dezelfde geheime link als bij delen. Komt er iets raars in Bring! te staan? Probeer dan de andere methode.",
          function () { openExternal(bringDeeplink(page + "/bring")); },
          "Open in Bring!",
          "Andere methode",
          function () { openExternal(bringDeeplink(page + "/bring.json")); }
        );
      });
    });
  }

  // ---------- Delen en exporteren: één menu met alle opties ----------
  // Eén knop op het boodschappenscherm opent dit menu. Wat er in staat:
  //   - Deel via WhatsApp        live lijst met een link (jullie vinken samen af); daar kun je ook de link kopiëren
  //   - Stuur als tekst / kopieer / andere app   een gewoon lijstje zonder link, alleen wat nog nodig is
  //   - Importeer in Bring!      zie hierboven
  //   - Exporteer als PDF
  var SHEET_ICONS = {
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20l1.2-5A8.4 8.4 0 1 1 21 11.5z"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
    basket: '<path d="M3 9h18l-2 11H5L3 9z"/><path d="M8 9l3-5M16 9l-3-5"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'
  };

  // De producten die nog gekocht moeten worden, per categorie. Wat al in het mandje ligt of op "niet nodig" staat, blijft weg.
  function stillNeededByCategory(title, entries) {
    var agg = buildAggregatedShoppingList(entries);
    var token = loadShares()[shareKeyFor(title)];
    var live = token ? sharedLive[token] : null;
    var info = live && live.loaded && !live.gone ? assignShareIds(agg) : null;
    var listKey = shareKeyFor(title);
    var groups = [], count = 0;
    CATEGORY_ORDER.forEach(function (cat) {
      var lines = [];
      agg[cat].forEach(function (item) {
        if (shoppingChecked[item.key]) return;
        if (itemStatusByKey(listKey, item.key, info, live) === "skip") return;
        lines.push(item.text);
      });
      if (lines.length) { groups.push({ cat: cat, lines: lines }); count += lines.length; }
    });
    return { groups: groups, count: count };
  }
  function shoppingListText(title, groups) {
    return "\uD83D\uDED2 Boodschappenlijst: " + title + "\n\n" + groups.map(function (g) {
      return g.cat + "\n" + g.lines.map(function (l) { return "\u2022 " + l; }).join("\n");
    }).join("\n\n");
  }

  function closeShareMenu() {
    var o = document.getElementById("shareMenuOverlay");
    if (o) o.classList.remove("active");
  }
  function sheetSection(parent, label) {
    var s = document.createElement("div");
    s.className = "sheet-section";
    s.textContent = label;
    parent.appendChild(s);
  }
  // Een regel in het menu. Het menu sluit eerst (direct, zodat acties die een tik van de gebruiker nodig hebben,
  // zoals de systeem-deelknop, gewoon werken) en voert dan de actie uit.
  function sheetItem(parent, id, iconKey, label, sub, action) {
    var b = document.createElement("button");
    b.className = "sheet-item";
    b.id = id;
    var icon = document.createElement("span");
    icon.className = "sheet-icon";
    icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SHEET_ICONS[iconKey] + "</svg>";
    var text = document.createElement("span");
    var l = document.createElement("span");
    l.className = "sheet-label";
    l.textContent = label;
    var s = document.createElement("span");
    s.className = "sheet-sub";
    s.textContent = sub;
    text.appendChild(l);
    text.appendChild(s);
    b.appendChild(icon);
    b.appendChild(text);
    b.onclick = function () { closeShareMenu(); action(); };
    parent.appendChild(b);
  }

  function openShareMenu(title, entries, trigger) {
    var body = document.getElementById("shareMenuBody");
    body.innerHTML = "";

    // Voor de tekst-opties: bepaalt op het moment van tikken wat er nog nodig is.
    function withNeeded(next) {
      var needed = stillNeededByCategory(title, entries);
      if (!needed.count) { showToast("Er is niets meer te delen: alles staat al in het mandje of is niet nodig."); return; }
      next(shoppingListText(title, needed.groups));
    }

    if (moduleOn("sharing")) {
      sheetSection(body, "Samen afvinken");
      sheetItem(body, "shareMenuWhatsApp", "chat", "Deel via WhatsApp",
        "Stuurt een link waarmee jullie samen afvinken. Daar kun je de link ook kopi\u00ebren.",
        function () { shareShoppingList(title, entries, trigger); });
    }

    sheetSection(body, "Als tekst");
    sheetItem(body, "shareMenuTextWhatsApp", "list", "Stuur als tekst via WhatsApp",
      "Een gewoon lijstje, zonder link. Alleen wat nog nodig is.",
      function () { withNeeded(function (text) { openWhatsApp(text); }); });
    sheetItem(body, "shareMenuCopyText", "copy", "Kopieer als tekst",
      "Om te plakken in een andere app.",
      function () {
        withNeeded(function (text) {
          copyToClipboard(text).then(function () { showToast("Tekst gekopieerd."); }).catch(function () { showToast("Kopi\u00ebren lukte niet."); });
        });
      });
    if (typeof navigator !== "undefined" && typeof navigator.share === "function") {
      sheetItem(body, "shareMenuNative", "share", "Deel via een andere app\u2026",
        "Kies zelf een app op je apparaat.",
        function () {
          withNeeded(function (text) {
            try {
              var p = navigator.share({ title: "Boodschappenlijst: " + title, text: text });
              if (p && p.catch) p.catch(function () {});   // geannuleerd door de gebruiker: geen melding
            } catch (e) {}
          });
        });
    }

    var showBring = moduleOn("sharing") && moduleOn("bring"), showPdf = moduleOn("pdf");
    if (showBring || showPdf) sheetSection(body, "Apps en bestanden");
    if (showBring) sheetItem(body, "shareMenuBring", "basket", "Importeer in Bring!",
      "Zet de producten in je Bring!-lijst.",
      function () { importToBring(title, entries, trigger); });
    if (showPdf) sheetItem(body, "shareMenuPdf", "file", "Exporteer als PDF",
      "Om te printen of te bewaren.",
      function () {
        if (!window.jspdf || !window.jspdf.jsPDF) { showToast("De PDF-bibliotheek is niet geladen. Controleer je verbinding en probeer het opnieuw."); return; }
        exportShoppingPdf(title, entries, null, shoppingViewMode);
      });

    document.getElementById("shareMenuOverlay").classList.add("active");
  }
  (function wireShareMenu() {
    var overlay = document.getElementById("shareMenuOverlay"), close = document.getElementById("shareMenuClose");
    if (close) close.onclick = closeShareMenu;
    if (overlay) overlay.onclick = function (e) { if (e && e.target === overlay) closeShareMenu(); };
    if (typeof document.addEventListener === "function") {
      document.addEventListener("keydown", function (e) { if (e && e.key === "Escape") closeShareMenu(); });
    }
  })();

  function stopSharing(title, token) {
    askConfirm("Delen stoppen? De link werkt daarna niet meer, ook niet voor wie de lijst nog open heeft staan. Wat jullie al hebben afgevinkt blijft in je eigen lijst staan.", function () {
      fetch("/api/lists/" + token + "/delete", { method: "POST", headers: shareHeaders(), body: "{}" }).then(function (res) {
        if (!res.ok && res.status !== 404) throw new Error("http " + res.status);
        var shares = loadShares();
        delete shares[shareKeyFor(title)];
        saveShares(shares);
        delete sharedLive[token];
        delete shareDrifting[token];
        setShareMeta(token, null);
        delete autoSyncRt[token];
        savePending(token, {});
        showToast("Delen gestopt.");
        render();
      }).catch(function () { showToast("Stoppen mislukt. Probeer het opnieuw."); });
    }, "Delen stoppen", "Annuleren");
  }

  function renderShoppingList(title, entries, backFn) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar("Boodschappenlijst", true, backFn));
    var main = document.createElement("main");

    var headerRow = document.createElement("div");
    headerRow.style.display = "flex";
    headerRow.style.alignItems = "center";
    headerRow.style.justifyContent = "space-between";
    headerRow.style.gap = "12px";
    headerRow.style.flexWrap = "wrap";

    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = title;
    headerRow.appendChild(eyebrow);

    if (entries.length) {
      var menuBtn = document.createElement("button");
      menuBtn.className = "ghost-btn";
      menuBtn.id = "shopMenuBtn";
      menuBtn.textContent = "Delen en exporteren";
      menuBtn.onclick = function () { openShareMenu(title, entries, menuBtn); };
      headerRow.appendChild(menuBtn);
    }

    main.appendChild(headerRow);

    var myBringLink = validBringLink(prefs.bringListLink);
    if (myBringLink && entries.length) {
      var bringBox = document.createElement("div");
      bringBox.className = "share-box";
      var bringText = document.createElement("div");
      bringText.className = "share-text";
      bringText.textContent = "Jouw Bring!-lijst \u00b7 " + bringLinkLabel(myBringLink);
      bringBox.appendChild(bringText);
      var bringActions = document.createElement("div");
      bringActions.className = "share-actions";
      var bringOpen = document.createElement("a");
      bringOpen.className = "ghost-btn";
      bringOpen.href = myBringLink;
      bringOpen.target = "_blank";
      bringOpen.rel = "noopener";
      bringOpen.textContent = "Openen";
      bringActions.appendChild(bringOpen);
      var bringEdit = document.createElement("button");
      bringEdit.className = "ghost-btn";
      bringEdit.textContent = "Wijzigen";
      bringEdit.onclick = editBringLink;
      bringActions.appendChild(bringEdit);
      bringBox.appendChild(bringActions);
      main.appendChild(bringBox);
    }

    var sharedToken = loadShares()[shareKeyFor(title)];
    var shareInfo = null, live = null;
    if (sharedToken && entries.length) {
      shareInfo = assignShareIds(buildAggregatedShoppingList(entries));
      live = liveFor(sharedToken);
      var drifting = shareDrift(sharedToken, shareInfo);
      shareDrifting[sharedToken] = drifting;
      if (live.loaded && !live.gone && !loadShareMeta()[sharedToken]) {
        // een lijst die gedeeld is met een eerdere versie van de app: alsnog vastleggen waar hij vandaan komt
        var legacySrc = currentShareSource();
        if (legacySrc) {
          setShareMeta(sharedToken, { kind: legacySrc.kind, refId: legacySrc.refId, title: title, sig: drifting ? "" : shareSignature(shareInfo.items) });
          startAutoSyncTimer();
        }
      }
      var shareBox = document.createElement("div");
      shareBox.className = "share-box";
      var shareText = document.createElement("div");
      shareText.className = "share-text";
      shareText.textContent = shareStatusLine(sharedToken);
      shareBox.appendChild(shareText);
      var shareActions = document.createElement("div");
      shareActions.className = "share-actions";
      if (drifting) {
        var updateBtn = document.createElement("button");
        updateBtn.className = "ghost-btn";
        updateBtn.textContent = "Bijwerken";
        updateBtn.onclick = function () { shareShoppingList(title, entries, updateBtn, true); };
        shareActions.appendChild(updateBtn);
      }
      var openLink = document.createElement("a");
      openLink.className = "ghost-btn";
      openLink.href = "/l/" + sharedToken;
      openLink.target = "_blank";
      openLink.rel = "noopener";
      openLink.textContent = "Openen";
      shareActions.appendChild(openLink);
      var stopBtn = document.createElement("button");
      stopBtn.className = "ghost-btn";
      stopBtn.textContent = "Stoppen";
      stopBtn.onclick = function () { stopSharing(title, sharedToken); };
      shareActions.appendChild(stopBtn);
      shareBox.appendChild(shareActions);
      main.appendChild(shareBox);
      shareStatusEl = shareText;
      shareStatusToken = sharedToken;
      if (!live.loaded && !live.gone && !live.ticking) liveTick(sharedToken);
      startShareTimer();
    } else {
      shareStatusEl = null;
      shareStatusToken = null;
      sharedToken = null;
    }

    var byCategory = shoppingViewMode === "day" ? null : buildAggregatedShoppingList(entries);
    var pricingCategories = byCategory || buildAggregatedShoppingList(entries);
    var listKey = shareKeyFor(title);
    // Gedeelde lijst: de stand van de server bepaalt; die spiegelen we lokaal (vinkje en "niet nodig").
    if (shareInfo && live && live.loaded && !live.gone) {
      CATEGORY_ORDER.forEach(function (cat) {
        pricingCategories[cat].forEach(function (item) {
          var sid0 = syncedIdFor(shareInfo, live, item.key);
          if (!sid0) return;
          var st0 = liveStatus(live, sid0);
          shoppingChecked[item.key] = st0 === "basket";
          setSkipped(listKey, item.key, st0 === "skip");
        });
      });
    }
    // Uitgesloten ("niet nodig") producten tellen niet mee in de kostenschatting.
    var currentItemTexts = [];
    var skippedTotal = 0;
    CATEGORY_ORDER.forEach(function (cat) {
      pricingCategories[cat].forEach(function (item) {
        if (itemStatusByKey(listKey, item.key, shareInfo, live) === "skip") { skippedTotal++; return; }
        currentItemTexts.push(item.text);
      });
    });

    var priceRow = document.createElement("div");
    priceRow.style.display = "flex";
    priceRow.style.alignItems = "center";
    priceRow.style.gap = "12px";
    priceRow.style.flexWrap = "wrap";

    var knownPrices = currentItemTexts.map(function (t) { return priceCache[t]; }).filter(Boolean);
    var allPriced = currentItemTexts.length > 0 && knownPrices.length === currentItemTexts.length;

    if (allPriced) {
      var totalLow = knownPrices.reduce(function (s, p) { return s + p.laag; }, 0);
      var totalHigh = knownPrices.reduce(function (s, p) { return s + p.hoog; }, 0);
      var totalBadge = document.createElement("div");
      totalBadge.className = "tag balans";
      totalBadge.textContent = "Geschat totaal: " + formatEuro(totalLow) + " – " + formatEuro(totalHigh);
      priceRow.appendChild(totalBadge);
    } else if (moduleOn("prices")) {
      var priceBtn = document.createElement("button");
      priceBtn.className = "ghost-btn";
      priceBtn.disabled = shoppingPriceLoading || !currentItemTexts.length;
      priceBtn.textContent = shoppingPriceLoading ? "Prijzen worden geschat…" : "Schat de kosten";
      priceBtn.onclick = function () { estimateShoppingPrices(currentItemTexts); };
      priceRow.appendChild(priceBtn);
    }
    main.appendChild(priceRow);

    if (shoppingPriceError) {
      var priceErr = document.createElement("div");
      priceErr.className = "errorbox";
      priceErr.textContent = shoppingPriceError;
      main.appendChild(priceErr);
    }
    if (currentItemTexts.length > 0) {
      var priceNote = document.createElement("div");
      priceNote.style.fontSize = "12px";
      priceNote.style.color = "var(--muted)";
      priceNote.textContent = shoppingViewMode === "day"
        ? "Het geschatte totaal is gebaseerd op de samengevoegde hoeveelheden per ingrediënt (zie \u201cPer week\u201d voor de prijs per ingrediënt) — een online-inschatting, geen actuele of gegarandeerde prijzen."
        : "Prijzen zijn een online-inschatting op basis van gemiddelde Nederlandse supermarktprijzen, geen actuele of gegarandeerde prijzen.";
      main.appendChild(priceNote);
    }

    if (skippedTotal > 0) {
      var skipSummary = document.createElement("div");
      skipSummary.className = "share-note";
      skipSummary.style.display = "flex";
      skipSummary.style.alignItems = "center";
      skipSummary.style.gap = "10px";
      skipSummary.style.flexWrap = "wrap";
      var skipSummaryText = document.createElement("span");
      skipSummaryText.textContent = skippedTotal + (skippedTotal === 1 ? " product staat" : " producten staan") + " op \u201cniet nodig\u201d en tel" + (skippedTotal === 1 ? "t" : "len") + " niet mee bij delen, tekst, PDF en kosten.";
      skipSummary.appendChild(skipSummaryText);
      var skipAllBtn = document.createElement("button");
      skipAllBtn.className = "ghost-btn";
      skipAllBtn.id = "shopSkipResetBtn";
      skipAllBtn.textContent = "Alles weer nodig";
      skipAllBtn.onclick = function () {
        CATEGORY_ORDER.forEach(function (cat) {
          pricingCategories[cat].forEach(function (item) {
            var sidX = syncedIdFor(shareInfo, live, item.key);
            if (sidX && liveStatus(live, sidX) === "skip") liveToggle(sharedToken, sidX, "skip");
          });
        });
        clearSkipped(listKey);
        render();
      };
      skipSummary.appendChild(skipAllBtn);
      main.appendChild(skipSummary);
    }

    var modeRow = document.createElement("div");
    modeRow.className = "segrow";
    [["week", "Per week (samengevoegd)"], ["day", "Per dag"]].forEach(function (pair) {
      var chip = document.createElement("button");
      chip.className = "chip" + (shoppingViewMode === pair[0] ? " selected" : "");
      chip.textContent = pair[1];
      chip.onclick = function () { shoppingViewMode = pair[0]; render(); };
      modeRow.appendChild(chip);
    });
    main.appendChild(modeRow);

    if (!entries.length) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Nog geen gerechten om een boodschappenlijst voor te maken.";
      main.appendChild(hint);
    }

    if (shoppingViewMode === "day") {
      var dayNote = document.createElement("div");
      dayNote.className = "share-note";
      dayNote.textContent = sharedToken
        ? "Vinkjes in deze weergave worden niet gedeeld, \u201cNiet nodig\u201d w\u00e9l: dat geldt voor het hele product. Kies \u201cPer week (samengevoegd)\u201d om samen af te vinken."
        : "\u201cNiet nodig\u201d geldt voor het hele product (ook in de weekweergave) en telt niet mee bij delen, PDF en kosten.";
      main.appendChild(dayNote);
      entries.forEach(function (entry) {
        var day = entry.day;
        var label = document.createElement("div");
        label.className = "section-label";
        label.textContent = entry.label + " — " + day.name;
        main.appendChild(label);

        var group = document.createElement("div");
        group.className = "shop-group";
        day.ingredienten.forEach(function (ing, idx) {
          if (isTapWater(parseIngredientLine(ing).name)) return;
          var key = entry.key + "|" + idx;
          var aggKey = aggKeyForLine(ing);
          var dSid = syncedIdFor(shareInfo, live, aggKey);
          var dSkipped = itemStatusByKey(listKey, aggKey, shareInfo, live) === "skip";
          var isChecked = !!shoppingChecked[key];
          var row = document.createElement("div");
          row.className = "shop-item" + (isChecked ? " checked" : "") + (dSkipped ? " skipped" : "");
          var box = document.createElement("span");
          box.className = "shop-check" + (isChecked ? " on" : "");
          box.innerHTML = isChecked
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '';
          var txt = document.createElement("span");
          txt.textContent = scaleIngredientText(ing, entry.servings || 1);
          row.appendChild(box);
          row.appendChild(txt);
          var dSkipBtn = document.createElement("button");
          dSkipBtn.className = "shop-skip";
          dSkipBtn.textContent = dSkipped ? "Toch nodig" : "Niet nodig";
          dSkipBtn.onclick = function (ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            if (dSid) { liveToggle(sharedToken, dSid, "skip"); return; }
            toggleLocalSkip(listKey, aggKey);
            render();
          };
          row.appendChild(dSkipBtn);
          row.onclick = function () {
            if (dSkipped) {                                   // tikken op een uitgesloten regel maakt het weer nodig
              if (dSid) liveToggle(sharedToken, dSid, "skip"); else { toggleLocalSkip(listKey, aggKey); render(); }
              return;
            }
            shoppingChecked[key] = !shoppingChecked[key];
            render();
          };
          group.appendChild(row);
        });
        main.appendChild(group);
      });
    } else {
      CATEGORY_ORDER.forEach(function (cat) {
        var items = byCategory[cat];
        if (!items.length) return;

        var label = document.createElement("div");
        label.className = "section-label";
        label.textContent = cat + " (" + items.length + ")";
        main.appendChild(label);

        var group = document.createElement("div");
        group.className = "shop-group";
        items.forEach(function (item) {
          var sid = syncedIdFor(shareInfo, live, item.key);
          var synced = !!sid;
          var st = itemStatusByKey(listKey, item.key, shareInfo, live);
          var isChecked = st === "basket";
          var row = document.createElement("div");
          row.className = "shop-item" + (isChecked ? " checked" : "") + (st === "skip" ? " skipped" : "");
          var box = document.createElement("span");
          box.className = "shop-check" + (isChecked ? " on" : "");
          box.innerHTML = isChecked
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
            : '';
          var txt = document.createElement("span");
          var itemPriceInfo = priceCache[item.text];
          txt.textContent = item.text + (itemPriceInfo ? " (" + formatEuro(itemPriceInfo.laag) + " – " + formatEuro(itemPriceInfo.hoog) + ")" : "");
          row.appendChild(box);
          row.appendChild(txt);
          if (synced) {
            var srvItem = live.items[sid];
            var srvFlag = srvItem && srvItem.flag;
            if (srvFlag && srvFlag.ageSec + (Date.now() - (live.fetchedAt || Date.now())) / 1000 < OWNER_FLAG_SECONDS) {
              var flagPill = document.createElement("span");
              flagPill.className = "shop-flag";
              flagPill.textContent = srvFlag.kind === "new" ? "Nieuw" : "Aangepast";
              row.appendChild(flagPill);
            }
          }
          var skipBtn = document.createElement("button");
          skipBtn.className = "shop-skip";
          skipBtn.textContent = st === "skip" ? "Toch nodig" : "Niet nodig";
          skipBtn.onclick = function (ev) {
            if (ev && ev.stopPropagation) ev.stopPropagation();
            if (synced) { liveToggle(sharedToken, sid, "skip"); return; }
            toggleLocalSkip(listKey, item.key);
            render();
          };
          row.appendChild(skipBtn);
          row.onclick = function () {
            if (synced) { liveToggle(sharedToken, sid, "basket"); return; }
            toggleLocalBasket(listKey, item.key);
            render();
          };
          group.appendChild(row);
        });
        main.appendChild(group);
      });
    }

    app.appendChild(main);
  }

  function generateShoppingPdfBlob(title, entries, mode) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var margin = 48;
    var y = margin;
    var lineH = 16;
    var maxY = doc.internal.pageSize.getHeight() - margin;

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function measureWrappedLines(text, size) {
      var s = size || 11.5;
      var boxSize = s * 0.65;
      var textIndent = boxSize + 8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(s);
      return doc.splitTextToSize(text, pageW - margin * 2 - textIndent).length;
    }
    function heading(text, size) {
      ensureRoom(size + 10);
      doc.setTextColor(14, 26, 48);
      doc.setFont("times", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(16, 24, 43);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11.5);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }
    function checkboxLine(text, opts) {
      var size = opts && opts.size ? opts.size : 11.5;
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(size);
      var boxSize = size * 0.65;
      var textIndent = boxSize + 8;
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2 - textIndent);
      wrapped.forEach(function (line, idx) {
        ensureRoom(lineH);
        if (idx === 0) {
          doc.setDrawColor(150, 142, 125);
          doc.rect(margin, y - boxSize + 2, boxSize, boxSize);
        }
        doc.text(line, margin + textIndent, y);
        y += lineH;
      });
    }

    heading("Boodschappenlijst — " + title, 20);
    doc.setDrawColor(184, 134, 59);
    doc.setLineWidth(2);
    doc.line(margin, y - 2, margin + 50, y - 2);
    doc.setLineWidth(1);
    y += 10;

    var pdfListKey = shareKeyFor(title);
    if (mode === "day") {
      entries.forEach(function (entry) {
        var day = entry.day;
        var visibleIngs = day.ingredienten.filter(function (ing) { return !isTapWater(parseIngredientLine(ing).name) && !isSkipped(pdfListKey, aggKeyForLine(ing)); });
        if (!visibleIngs.length) return;
        var estHeight = 16 + 13 + 8;
        visibleIngs.forEach(function (ing) { estHeight += measureWrappedLines(scaleIngredientText(ing, entry.servings || 1), 11.5) * lineH; });
        estHeight += 6;
        var availableOnFreshPage = maxY - margin;
        if (y > margin && y + estHeight > maxY && estHeight <= availableOnFreshPage) { doc.addPage(); y = margin; }
        ensureRoom(24);
        doc.setDrawColor(231, 223, 204);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(entry.label + " — " + day.name, 13);
        visibleIngs.forEach(function (ing) { checkboxLine(scaleIngredientText(ing, entry.servings || 1), { size: 11.5 }); });
        y += 6;
      });
    } else {
      var byCategory = buildAggregatedShoppingList(entries);
      CATEGORY_ORDER.forEach(function (cat) {
        var items = byCategory[cat].filter(function (it) { return !isSkipped(pdfListKey, it.key); });
        if (!items.length) return;
        var estHeight = 16 + 13 + 8;
        items.forEach(function (item) { estHeight += measureWrappedLines(item.text, 11.5) * lineH; });
        estHeight += 6;
        var availableOnFreshPage = maxY - margin;
        if (y > margin && y + estHeight > maxY && estHeight <= availableOnFreshPage) { doc.addPage(); y = margin; }
        ensureRoom(24);
        doc.setDrawColor(231, 223, 204);
        doc.line(margin, y, pageW - margin, y);
        y += 16;
        heading(cat, 13);
        items.forEach(function (item) { checkboxLine(item.text, { size: 11.5 }); });
        y += 6;
      });
    }

    return doc.output("blob");
  }

  function exportShoppingPdf(title, entries, btn, mode) {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      if (btn) btn.textContent = "PDF-bibliotheek niet geladen";
      return;
    }
    if (btn) btn.textContent = "PDF wordt gemaakt…";
    var blob = generateShoppingPdfBlob(title, entries, mode);
    downloadPdf(blob, "boodschappenlijst-" + title, btn, "Exporteer boodschappenlijst");
  }

  function renderShopping() {
    var week = findWeek(state.weekId);
    renderShoppingList(week.title, buildDayEntries(week), function () { goto("week", { weekId: week.id }); });
  }

  function renderPlanShopping() {
    var pw = findPlannedWeek(state.planWeekId);
    var monday = new Date(pw.weekStart);
    renderShoppingList(formatWeekLabel(monday), buildPlanEntries(pw), function () { goto("planweek", { planWeekId: pw.id }); });
  }

  // ---------- Foto's in de PDF ----------
  // Elk gerecht met een foto krijgt in de PDF een banner, met de fotograaf erbij (dat vraagt
  // Unsplash). De foto komt via onze eigen server (/api/photo), omdat een browser plaatjes van
  // een andere site niet mag uitlezen om ze in een PDF te zetten. Gerechten waar nog geen foto
  // aan hangt, worden hier alsnog opgezocht. Lukt iets niet, dan wordt de foto overgeslagen en
  // krijg je gewoon de PDF zonder; de PDF blijft altijd kunnen worden gemaakt.
  var PDF_BANNER_H = 170;                       // punten (pt)
  var PDF_CONTENT_W = 595.28 - 96;              // A4-breedte min de marges van generatePdfBlob
  var PDF_BANNER_PX_W = 1100;
  var PDF_IMAGES_DEADLINE_MS = 60000;           // daarna gaan we verder met wat er dan is

  function fetchWithTimeout(url, opts, ms) {
    return new Promise(function (resolve, reject) {
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error("timeout")); }, ms);
      var o = {};
      for (var k in (opts || {})) o[k] = opts[k];
      if (ctrl) o.signal = ctrl.signal;
      fetch(url, o).then(function (r) { clearTimeout(timer); resolve(r); }, function (e) { clearTimeout(timer); reject(e); });
    });
  }

  // Snijdt de foto bij tot de vaste bannerverhouding (vanuit het midden, iets naar boven, waar het
  // eten meestal staat) en geeft een JPEG als data-URL terug.
  function imageBlobToBanner(blob, targetW, targetH) {
    return new Promise(function (resolve, reject) {
      var objUrl = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement("canvas");
          canvas.width = targetW;
          canvas.height = targetH;
          var ctx = canvas.getContext("2d");
          var scale = Math.max(targetW / img.naturalWidth, targetH / img.naturalHeight);
          var sw = targetW / scale, sh = targetH / scale;
          var sx = (img.naturalWidth - sw) / 2;
          var sy = (img.naturalHeight - sh) * 0.4;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, targetW, targetH);
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.82);
          URL.revokeObjectURL(objUrl);
          resolve(dataUrl);
        } catch (e) { URL.revokeObjectURL(objUrl); reject(e); }
      };
      img.onerror = function () { URL.revokeObjectURL(objUrl); reject(new Error("foto niet leesbaar")); };
      img.src = objUrl;
    });
  }

  // Geeft { url, credit } voor een gerecht (zo nodig opzoeken), of null als er geen foto is.
  function resolvePhotoForPdf(day) {
    if (day.imageUrl) return Promise.resolve({ url: day.imageUrl, credit: day.imageCredit || null });
    if (day.imageUrl === null && day.imageV === IMAGE_V) return Promise.resolve(null);
    var key = day.id || day.name;
    if (imageRetryAt[key] && Date.now() < imageRetryAt[key]) return Promise.resolve(null);
    return fetchWithTimeout(imageRequestUrl(day), {}, 12000).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null, final: false };
    }).then(function (data) {
      var definitive = applyImageResult(day, data);
      if (definitive) persistDishImageUpdate(day);
      return day.imageUrl ? { url: day.imageUrl, credit: day.imageCredit || null } : null;
    }).catch(function () { return null; });
  }

  // Levert een lijst op die parallel loopt aan "entries": per gerecht { dataUrl, alias, credit } of null.
  function loadPdfImages(entries) {
    var empty = entries.map(function () { return null; });
    if (!window.isStandalone) return Promise.resolve(empty);
    var lookups = {}, banners = {};
    var bannerPxH = Math.round(PDF_BANNER_PX_W * PDF_BANNER_H / PDF_CONTENT_W);
    function photoFor(day) {
      var k = day.id || day.name;
      if (!lookups[k]) lookups[k] = resolvePhotoForPdf(day);
      return lookups[k];
    }
    function bannerFor(url) {
      if (!banners[url]) {
        banners[url] = fetchWithTimeout("/api/photo?url=" + encodeURIComponent(url) + "&w=" + PDF_BANNER_PX_W,
          { headers: window.authHeaders ? window.authHeaders() : {} }, 20000).then(function (res) {
          if (!res.ok) throw new Error("foto niet beschikbaar");
          return res.blob();
        }).then(function (blob) {
          return imageBlobToBanner(blob, PDF_BANNER_PX_W, bannerPxH);
        }).catch(function () { return null; });
      }
      return banners[url];
    }
    var results = empty.slice();
    var next = 0;
    function worker() {
      if (next >= entries.length) return Promise.resolve();
      var i = next++;
      var day = entries[i] && entries[i].day;
      if (!day || day.prep) return worker();
      return photoFor(day).then(function (photo) {
        if (!photo) return null;
        return bannerFor(photo.url).then(function (dataUrl) {
          return dataUrl ? { dataUrl: dataUrl, alias: photo.url, credit: photo.credit } : null;
        });
      }).catch(function () { return null; }).then(function (r) { results[i] = r; }).then(worker);
    }
    return new Promise(function (resolve) {
      var finished = false;
      var timer = setTimeout(function () { if (!finished) { finished = true; resolve(results.slice()); } }, PDF_IMAGES_DEADLINE_MS);
      Promise.all([worker(), worker(), worker(), worker()]).then(function () {
        if (!finished) { finished = true; clearTimeout(timer); resolve(results); }
      });
    });
  }

  // Haalt eerst de foto's op en maakt daarna de PDF. Gaat het ophalen mis, dan zonder foto's.
  function buildPdfWithImages(entries, makeBlob) {
    busyStart("PDF wordt gemaakt…");
    return loadPdfImages(entries).catch(function () { return []; }).then(function (images) {
      try { return makeBlob(images); } finally { busyEnd(); }
    }, function (e) { busyEnd(); throw e; });
  }

  function generatePdfBlob(title, subtitle, entries, images) {
    var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 48;
    var y = margin;
    var lineH = 15;
    var maxY = pageH - margin;

    var NAVY = [14, 26, 48];
    var INK = [16, 24, 43];
    var MUTED = [107, 97, 82];
    var ORANGE = [184, 134, 59];
    var ORANGE_INK = [42, 28, 0];
    var KH_BG = [233, 231, 222], KH_INK = [16, 24, 43];
    var EIWIT_BG = [237, 234, 225], EIWIT_INK = [74, 68, 56];
    var VET_BG = [243, 230, 208], VET_INK = [138, 98, 32];
    var NEUTRAL_BG = [247, 242, 231];
    var LINE = [231, 223, 204];

    function ensureRoom(h) {
      if (y + h > maxY) { doc.addPage(); y = margin; }
    }
    function heading(text, size, color) {
      ensureRoom(size + 10);
      doc.setTextColor(color[0], color[1], color[2]);
      doc.setFont("times", "bold");
      doc.setFontSize(size);
      doc.text(text, margin, y);
      y += size + 8;
      doc.setTextColor(INK[0], INK[1], INK[2]);
    }
    function bodyLines(text, opts) {
      doc.setFont("helvetica", opts && opts.bold ? "bold" : "normal");
      doc.setFontSize(opts && opts.size ? opts.size : 11);
      var wrapped = doc.splitTextToSize(text, pageW - margin * 2);
      wrapped.forEach(function (line) {
        ensureRoom(lineH);
        doc.text(line, margin, y);
        y += lineH;
      });
    }
    function measureLines(text, size, bold) {
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      return doc.splitTextToSize(text, pageW - margin * 2).length;
    }
    function drawBadge(x, yTop, text, fill, ink) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      var padX = 8, h = 16;
      var w = doc.getTextWidth(text) + padX * 2;
      doc.setFillColor(fill[0], fill[1], fill[2]);
      doc.roundedRect(x, yTop, w, h, 8, 8, "F");
      doc.setTextColor(ink[0], ink[1], ink[2]);
      doc.text(text, x + padX, yTop + h / 2 + 3);
      doc.setTextColor(INK[0], INK[1], INK[2]);
      return x + w + 6;
    }

    // --- Cover page ---
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, pageW, 220, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("times", "bold");
    doc.setFontSize(30);
    doc.splitTextToSize(title, pageW - margin * 2).forEach(function (line, i) {
      doc.text(line, margin, 110 + i * 34);
    });
    if (subtitle) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(12);
      doc.setTextColor(224, 216, 196);
      doc.text(subtitle, margin, 168);
    }
    doc.setDrawColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    doc.setLineWidth(2);
    doc.line(margin, 190, margin + 60, 190);
    doc.setLineWidth(1);

    y = 260;
    doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text(entries.length + (entries.length === 1 ? " gerecht in dit menu" : " gerechten in dit menu"), margin, y);
    y += 26;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    entries.forEach(function (entry) {
      ensureRoom(lineH + 2);
      var left = entry.label + " — " + entry.day.name;
      var right = entry.day.prep ? "" : (entry.day.kcal + " kcal");
      doc.setTextColor(INK[0], INK[1], INK[2]);
      var leftLines = doc.splitTextToSize(left, pageW - margin * 2 - 70);
      doc.text(leftLines[0], margin, y);
      if (right) {
        doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text(right, pageW - margin, y, { align: "right" });
      }
      y += lineH;
    });

    // --- Dish pages ---
    doc.addPage();
    y = margin;

    entries.forEach(function (entry, entryIdx) {
      var day = entry.day;
      var pdfImg = images && images[entryIdx] && images[entryIdx].dataUrl ? images[entryIdx] : null;
      var meta = day.prep ? "" : (day.kcal + " kcal  ·  KH " + day.kh + "%" + (day.khG !== undefined ? " (" + day.khG + "g)" : "") +
        " / Eiwit " + day.eiwit + "%" + (day.eiwitG !== undefined ? " (" + day.eiwitG + "g)" : "") +
        " / Vet " + day.vet + "%" + (day.vetG !== undefined ? " (" + day.vetG + "g)" : "") +
        "  ·  Balans " + day.balans + "%");
      var benodigdhedenText = "Benodigdheden: " + day.benodigdheden;

      var estHeight = 26 + (20 + 8) + 26 + 4 + 4 + 10;
      if (pdfImg) estHeight += PDF_BANNER_H + 22;
      estHeight += measureLines(benodigdhedenText, 11) * lineH;
      estHeight += measureLines("Ingrediënten:", 11, true) * lineH;
      day.ingredienten.forEach(function (ing) { estHeight += measureLines("• " + ing, 11) * lineH; });
      estHeight += measureLines("Bereiding:", 11, true) * lineH;
      day.steps.forEach(function (st, i) { estHeight += measureLines((i + 1) + ". " + st.title + " — " + st.content, 11) * lineH; });

      if (y > margin && y + estHeight > maxY) { doc.addPage(); y = margin; }

      if (y > margin) {
        doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
        doc.line(margin, y, pageW - margin, y);
        y += 22;
      }

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
      doc.text(entry.label.toUpperCase(), margin, y);
      y += 16;

      heading(day.name, 20, NAVY);
      y += 2;

      var bx = margin;
      if (day.prep) {
        bx = drawBadge(bx, y, day.benodigdheden, NEUTRAL_BG, INK);
      } else {
        bx = drawBadge(bx, y, day.kcal + " kcal", NEUTRAL_BG, INK);
        bx = drawBadge(bx, y, "KH " + day.kh + "%" + (day.khG !== undefined ? " (" + day.khG + "g)" : ""), KH_BG, KH_INK);
        bx = drawBadge(bx, y, "Eiwit " + day.eiwit + "%" + (day.eiwitG !== undefined ? " (" + day.eiwitG + "g)" : ""), EIWIT_BG, EIWIT_INK);
        bx = drawBadge(bx, y, "Vet " + day.vet + "%" + (day.vetG !== undefined ? " (" + day.vetG + "g)" : ""), VET_BG, VET_INK);
        bx = drawBadge(bx, y, "Balans " + day.balans + "%", ORANGE, ORANGE_INK);
      }
      y += 16 + 12;

      if (pdfImg) {
        var imgW = pageW - margin * 2;
        if (y + PDF_BANNER_H + 22 > maxY) { doc.addPage(); y = margin; }
        try {
          doc.addImage(pdfImg.dataUrl, "JPEG", margin, y, imgW, PDF_BANNER_H, pdfImg.alias, "FAST");
          doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
          doc.rect(margin, y, imgW, PDF_BANNER_H);
          y += PDF_BANNER_H;
          if (pdfImg.credit && pdfImg.credit.name) {
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7.5);
            doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
            doc.text("Foto: " + pdfImg.credit.name + " (Unsplash)", pageW - margin, y + 10, { align: "right" });
            doc.setTextColor(INK[0], INK[1], INK[2]);
            y += 22;
          } else {
            y += 12;
          }
        } catch (imgErr) { /* foto overslaan als het toevoegen mislukt; de rest van het gerecht blijft */ }
      }

      if (!day.prep) { bodyLines(benodigdhedenText, { size: 11 }); y += 4; }
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      bodyLines("Ingrediënten", { bold: true, size: 11 });
      doc.setTextColor(INK[0], INK[1], INK[2]);
      day.ingredienten.forEach(function (ing) { bodyLines("• " + ing, { size: 11 }); });
      y += 4;
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      bodyLines("Bereiding", { bold: true, size: 11 });
      doc.setTextColor(INK[0], INK[1], INK[2]);
      day.steps.forEach(function (st, i) { bodyLines((i + 1) + ". " + st.title + " — " + st.content, { size: 11 }); });
      y += 14;
    });

    var totalPages = doc.internal.getNumberOfPages();
    for (var p = 2; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text(title, margin, pageH - 24);
      doc.text((p - 1) + " / " + (totalPages - 1), pageW - margin, pageH - 24, { align: "right" });
    }

    return doc.output("blob");
  }

  var pdfPreviewUrl = null;
  function showPdfPreview(blob) {
    try {
      if (pdfPreviewUrl) { URL.revokeObjectURL(pdfPreviewUrl); pdfPreviewUrl = null; }
      var url = URL.createObjectURL(blob);
      pdfPreviewUrl = url;
      var frame = document.getElementById("pdfPreviewFrame");
      var overlay = document.getElementById("pdfPreviewOverlay");
      if (frame) frame.src = url;
      if (overlay) overlay.classList.add("active");
    } catch (e) {}
  }
  function closePdfPreview() {
    var overlay = document.getElementById("pdfPreviewOverlay");
    if (overlay) overlay.classList.remove("active");
    var frame = document.getElementById("pdfPreviewFrame");
    if (frame) frame.src = "about:blank";
    if (pdfPreviewUrl) { URL.revokeObjectURL(pdfPreviewUrl); pdfPreviewUrl = null; }
  }
  (function wirePdfPreviewOverlay() {
    var closeBtn = document.getElementById("pdfPreviewClose");
    if (closeBtn) closeBtn.onclick = function () { closePdfPreview(); };
  })();

  function downloadPdf(blob, filenameBase, btn, resetLabel) {
    showPdfPreview(blob);
    claude.use("downloads").then(function (downloads) {
      if (!downloads) {
        if (btn) btn.textContent = "Downloaden niet beschikbaar hier";
        return;
      }
      var filename = filenameBase.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".pdf";
      downloads.save({ filename: filename, data: blob }).then(function () {
        if (btn) btn.textContent = resetLabel;
      }).catch(function (e) {
        if (btn) btn.textContent = e && e.code === "declined" ? resetLabel : "Download mislukt — probeer opnieuw";
      });
    });
  }

  function exportWeekPdf(week) {
    var btn = document.getElementById("pdfExportBtn");
    if (!window.jspdf || !window.jspdf.jsPDF) {
      if (btn) btn.textContent = "PDF-bibliotheek niet geladen";
      return;
    }
    if (btn) btn.textContent = "PDF wordt gemaakt…";
    var entries = buildDayEntries(week);
    buildPdfWithImages(entries, function (images) {
      return generatePdfBlob(week.title, week.subtitle, entries, images);
    }).then(function (blob) {
      downloadPdf(blob, week.title, btn, "Exporteer Week Menu");
    }).catch(function () {
      if (btn) btn.textContent = "PDF maken mislukt — probeer opnieuw";
    });
  }

  function exportPlanPdf(pw) {
    var btn = document.getElementById("planPdfExportBtn") || document.getElementById("planRowPdfBtn-" + pw.id);
    if (!window.jspdf || !window.jspdf.jsPDF) {
      if (btn) btn.textContent = "PDF-bibliotheek niet geladen";
      return;
    }
    var monday = new Date(pw.weekStart);
    var label = formatWeekLabel(monday);
    if (btn) btn.textContent = "PDF wordt gemaakt…";
    var resetLabel = btn && btn.dataset && btn.dataset.label ? btn.dataset.label : "Exporteer Week Menu";
    var entries = buildPlanEntries(pw);
    buildPdfWithImages(entries, function (images) {
      return generatePdfBlob(label, "Weekplanning", entries, images);
    }).then(function (blob) {
      downloadPdf(blob, "weekplanning-" + label, btn, resetLabel);
    }).catch(function () {
      if (btn) btn.textContent = "PDF maken mislukt — probeer opnieuw";
    });
  }

  function renderDay() {
    var week = findWeek(state.weekId);
    var day = week ? findDay(week, state.dayId) : null;
    if (!day) {
      var found = findDayAnywhere(state.dayId);
      if (found) { week = found.week; day = found.day; state.weekId = week.id; }
    }
    if (!day) { goto("weeks"); return; }
    var app = document.getElementById("app");
    app.innerHTML = "";
    var backFn;
    if (state.dayBackView === "planday") {
      backFn = function () { goto("planday", { planWeekId: state.dayBackWeekId, planDayName: state.dayBackDayName }); };
    } else if (state.dayBackView === "library") {
      backFn = function () { goto("library"); };
    } else {
      backFn = function () { goto("week", { weekId: week.id }); };
    }
    app.appendChild(renderTopbar(day.label, true, backFn));
    var main = document.createElement("main");

    var hero = document.createElement("img");
    hero.className = "dish-hero";
    hero.style.display = "none";
    hero.alt = day.name;
    main.appendChild(hero);
    var heroCredit = document.createElement("div");
    heroCredit.className = "photo-credit";
    main.appendChild(heroCredit);
    loadDishImageInto(day, hero, heroCredit);

    var h2 = document.createElement("h2");
    h2.style.fontFamily = "Fraunces, serif";
    h2.style.fontWeight = "600";
    h2.style.fontSize = "26px";
    h2.style.margin = "0";
    h2.textContent = day.name;
    main.appendChild(h2);

    main.appendChild(macroTags(day));

    var servingsForView = state.dayServings || 1;
    if (servingsForView > 1) {

      servingsNote.style.marginTop = "-4px";

      var li = document.createElement("li");

    var l3 = document.createElement("div");

      ol.appendChild(li);

    if (!day.prep) {

        ["Pittiger", "pittiger"],

  function variateDish(week, day, kind, btnEl) {
    if (state.variating) return;
    state.variateError = null;
    state.variating = true;
    busyStart("Variant wordt gemaakt…");
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        state.variating = false;
        busyEnd();
        state.variateError = "Variaties zijn in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var variationCurrent = {
        name: day.name, kcal: day.kcal,
        ingredienten: day.ingredienten,
        benodigdheden: day.benodigdheden,
        steps: day.steps.map(function (s) { return s.title + ": " + s.content; })
      };
      sample.json({ action: "variation", current: variationCurrent, kind: kind, params: { goal: prefs.goal, dietStyle: prefs.dietStyle } }, { modelTier: "default" }).then(function (d) {
        var kcal = Number(d.kcal) || 0;
        var khG = Number(d.kh_g) || 0;
        var eiwitG = Number(d.eiwit_g) || 0;
        var vetG = Number(d.vet_g) || 0;
        var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
        var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;

  function collectWeekDishes(pw) {
    var seen = {};
    var out = [];
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var dishKey = assigned.dayId;
        var servings = assigned.servings || 1;
        if (seen[dishKey]) { seen[dishKey].count += servings; return; }
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var entry = { day: resolved.day, count: servings };
        seen[dishKey] = entry;
        out.push(entry);
      });
    });
    return out;
  }

  var AUTOWEEK_COUNTS = { "Ontbijt": 3, "Lunch": 3, "Diner": 4, "Snack": 4 };

  function hasAnyDishes() {
    for (var i = 0; i < WEEKS.length; i++) {
      var days = WEEKS[i].days;
      for (var j = 0; j < days.length; j++) {
        if (!days[j].prep) return true;
      }
    }
    return false;

  function collectExistingByType() {
    var byType = {};
    PLAN_MEALS.forEach(function (m) { byType[m] = []; });
    var seenIds = {};
    WEEKS.forEach(function (w) {
      w.days.forEach(function (d) {
        if (d.prep || !d.mealType || !byType[d.mealType]) return;
        if (seenIds[d.id]) return;
        seenIds[d.id] = true;
        byType[d.mealType].push({ week: w, day: d });
      });
    });
    return byType;
  }

  function generateAutoWeek(pw, onlyExisting) {
    if (pw.autoFilling) return;
    pw.autoFillError = null;

    try {
      var existingByType = collectExistingByType();
      var needed = {};
      var anyNeeded = false;
      PLAN_MEALS.forEach(function (m) {
        var have = existingByType[m].length;
        var want = AUTOWEEK_COUNTS[m];
        if (have < want) { needed[m] = want - have; anyNeeded = true; }
      });

      var finishFill = function (newDays) {
        var buckets = {};
        PLAN_MEALS.forEach(function (m) {
          var pool = existingByType[m].slice(0, AUTOWEEK_COUNTS[m]);
          var extra = newDays.filter(function (d) { return d.mealType === m; }).map(function (d) {
            return { week: findWeek(d.__weekId), day: d };
          });
          buckets[m] = pool.concat(extra);
        });
        var cursors = {};
        PLAN_MEALS.forEach(function (m) { cursors[m] = 0; });
        PLAN_DAYS.forEach(function (d) {
          PLAN_SLOTS.forEach(function (slot) {
            var key = d + "|" + slot;
            if (pw.slots[key]) return;
            var m = SLOT_TO_MEALTYPE[slot];
            var bucket = buckets[m];
            if (!bucket || !bucket.length) return;
            var item = bucket[cursors[m] % bucket.length];
            cursors[m]++;
            pw.slots[key] = { name: item.day.name, weekId: item.week.id, dayId: item.day.id, balans: item.day.balans };
          });
        });
        pw.autoFilling = false;
        savePlannedWeeks();
        showToast("Week is automatisch ingevuld.");
        render();
      };

      if (!anyNeeded || onlyExisting) {
        // Everything needed is already available, or the user chose to use only saved dishes — no generation.
        finishFill([]);
        return;
      }

      pw.autoFilling = true;
      busyStart("Week wordt automatisch ingevuld…");
      render();

      claude.use("sample").then(function (sample) {
        if (!sample) {
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = "Genereren is in deze weergave niet beschikbaar.";
          render();
          return;
        }
        var bgParams = {
          cuisines: prefs.cuisines, flavors: prefs.flavors, level: prefs.level, dietStyle: prefs.dietStyle,
          equipment: prefs.equipment, goal: prefs.goal, gender: prefs.gender, heightCm: prefs.heightCm,
          weightKg: prefs.weightKg, age: prefs.age, activityLevel: prefs.activityLevel
        };
        sample.json({ action: "background", needed: needed, params: bgParams }, { modelTier: "default" }).then(function (result) {
          try {
            var list = extractDishArray(result);
            if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");

            var days = dishesFromAiList(list, "auto");
            var monday = new Date(pw.weekStart);
            var newWeek = {
              id: "auto" + Date.now(),
              title: "Automatisch ingevuld",
              subtitle: formatWeekLabel(monday),
              days: days
            };
            WEEKS.unshift(newWeek);
            persistDishesToDb(days);
            days.forEach(function (d) { d.__weekId = newWeek.id; });

            busyEnd();
            finishFill(days);
          } catch (innerErr) {
            console.error("Auto-fill week: verwerken van resultaat mislukt", innerErr, result);
            pw.autoFilling = false;
            busyEnd();
            pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
            render();
          }
        }).catch(function (e) {
          console.error("Auto-fill week: genereren mislukt", e);
          pw.autoFilling = false;
          busyEnd();
          pw.autoFillError = (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." : "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
          render();
        });
      });
    } catch (e) {
      console.error("Auto-fill week: onverwachte fout", e);
      pw.autoFilling = false;
      busyEnd();
      pw.autoFillError = "Automatisch invullen is niet gelukt. Probeer het nogmaals.";
      render();
    }
  }

  function loadDishImageInto(day, imgEl, captionEl) {
    if (day.imageUrl) { imgEl.src = day.imageUrl; imgEl.style.display = ""; return; }
    if (day.imageUrl === null && day.imageV === IMAGE_V) { imgEl.style.display = "none"; return; }
    var retryKey = day.id || day.name;
    if (imageRetryAt[retryKey] && Date.now() < imageRetryAt[retryKey]) { imgEl.style.display = "none"; return; }
    fetch(imageRequestUrl(day)).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null, final: false };
    }).then(function (data) {
      var definitive = applyImageResult(day, data);
      if (day.imageUrl) {
        imgEl.src = day.imageUrl;
        imgEl.style.display = "";
        if (captionEl && day.imageCredit && day.imageCredit.name) {
          captionEl.textContent = "Foto: " + day.imageCredit.name + " (Unsplash)";
          captionEl.style.display = "";
        }
      } else {
        imgEl.style.display = "none";
      }
      if (definitive) persistDishImageUpdate(day);
    }).catch(function () {
      applyImageResult(day, null);
      imgEl.style.display = "none";
    });
  }

  function persistDishesToDb(daysList) {
    if (!dbCap || !userCap || !daysList || !daysList.length) return;

          if (!toAdd.length) return;
          var existing = Array.isArray(current[m]) ? current[m] : [];

          if (merged.length > 40) merged = merged.slice(merged.length - 40);
          current[m] = merged;
        });
        ref.set(current).catch(function () {});
      }).catch(function () {});
    }).catch(function () {});
