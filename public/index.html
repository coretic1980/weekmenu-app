    eyebrow.className = "eyebrow";
    eyebrow.textContent = "Stap " + (state.stepIndex + 1) + " van " + day.steps.length;
    main.appendChild(eyebrow);

    var title = document.createElement("h2");
    title.className = "cook-step-title";
    title.textContent = step.title;
    main.appendChild(title);

    var body = document.createElement("div");
    body.className = "cook-step-body";
    body.textContent = step.content;
    main.appendChild(body);

    if (step.timer) {
      timerRemaining = timerRemaining && timerRunning ? timerRemaining : step.timer;
      var box = document.createElement("div");
      box.className = "timer-box";
      var clock = document.createElement("div");
      clock.className = "timer-clock";
      clock.id = "timerClock";
      clock.textContent = fmtClock(timerRemaining);
      var tbtn = document.createElement("button");
      tbtn.className = "ghost-btn";
      tbtn.id = "timerToggle";
      tbtn.textContent = timerRunning ? "Pauzeer" : "Start timer";
      tbtn.onclick = function () { toggleTimer(step.timer); };
      box.appendChild(clock);
      box.appendChild(tbtn);
      main.appendChild(box);
    } else {
      timerRemaining = 0;
      stopTimer();
    }

    var spacer = document.createElement("div");
    spacer.style.flex = "1";
    main.appendChild(spacer);

    var nav = document.createElement("div");
    nav.className = "cook-nav";
    if (state.stepIndex > 0) {
      var prev = document.createElement("button");
      prev.className = "ghost-btn";
      prev.textContent = "Vorige";
      prev.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex - 1 }); };
      nav.appendChild(prev);
    }
    var next = document.createElement("button");
    next.className = "primary-btn";
    if (state.stepIndex < day.steps.length - 1) {
      next.textContent = "Volgende stap";
      next.onclick = function () { timerRemaining = 0; goto("cook", { weekId: week.id, dayId: day.id, stepIndex: state.stepIndex + 1 }); };
    } else {
      next.textContent = "Klaar — eet smakelijk";
      next.onclick = function () { goto("day", { weekId: week.id, dayId: day.id }); };
    }
    nav.appendChild(next);
    main.appendChild(nav);

    app.appendChild(main);
  }

  function toggleTimer(total) {
    if (timerRunning) {
      stopTimer();
      var btn = document.getElementById("timerToggle");
      if (btn) btn.textContent = "Hervat";
      return;
    }
    if (timerRemaining <= 0) timerRemaining = total;
    timerRunning = true;
    var btn2 = document.getElementById("timerToggle");
    if (btn2) btn2.textContent = "Pauzeer";
    timerInterval = setInterval(function () {
      timerRemaining -= 1;
      var clock = document.getElementById("timerClock");
      if (clock) clock.textContent = fmtClock(Math.max(timerRemaining, 0));
      if (timerRemaining <= 0) {
        stopTimer();
        var btn3 = document.getElementById("timerToggle");
        if (btn3) btn3.textContent = "Start timer";
      }
    }, 1000);
  }

  function render() {
    try {
      if (!configLoaded) return renderLoading();
      if (authState.mode === "reset" && authState.resetToken) return renderAuth();
      if (!window.authToken && window.authRequired) return renderAuth();
      if (state.view === "weeks") renderWeeks();
      else if (state.view === "library") renderLibrary();
      else if (state.view === "guide") renderGuide();
      else if (state.view === "wizard") renderWizard();
      else if (state.view === "prefs") renderPrefs();
      else if (state.view === "plan") renderPlan();
      else if (state.view === "planadd") renderPlanAdd();
      else if (state.view === "planweek") renderPlanWeek();
      else if (state.view === "planday") renderPlanDay();
      else if (state.view === "planprep") renderPlanPrep();
      else if (state.view === "planpick") renderPlanPick();
      else if (state.view === "week") renderWeek();
      else if (state.view === "upgrade") renderUpgrade();
      else if (state.view === "shopping") renderShopping();
      else if (state.view === "planshopping") renderPlanShopping();
      else if (state.view === "day") renderDay();
      else if (state.view === "cook") renderCook();
      else renderWeeks();
    } catch (e) {
      console.error("Render error op scherm '" + state.view + "':", e);
      document.getElementById("app").innerHTML =
        '<div class="empty-hint">Er ging iets mis bij het laden van dit scherm.<br><br>' +
        '<span style="font-size:12px;color:var(--muted);">' + (e && e.message ? String(e.message).replace(/</g,"&lt;") : "Onbekende fout") + '</span></div>';
    }
  }

  // ---------- Startup: ask the server whether login is currently required ----------
  var configLoaded = false;
  window.authRequired = true; // safe default until the server has answered

  function renderLoading() {
    var app = document.getElementById("app");
    app.innerHTML = '<div class="empty-hint" style="padding-top:120px;">Laden…</div>';
  }

  // ---------- Onderdelen die de beheerder aan of uit kan zetten, en mededelingen ----------
  // De server dwingt de meeste onderdelen zelf af; hier verbergen we de bijbehorende knoppen, zodat niemand
  // op iets klikt dat toch niet werkt. Onbekend (config niet geladen) telt als 'aan'.
  function moduleOn(key) { return !window.appModules || window.appModules[key] !== false; }

  function noticeDismissKey(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) h = ((h << 5) - h + text.charCodeAt(i)) | 0;
    return "balanza_notice_" + h;
  }
  function updateNoticeBar() {
    var bar = document.getElementById("noticeBar");
    if (!bar) return;
    var n = window.appNotice || {};
    var text = "", level = "info", key = null;
    if (n.maintenance && n.maintenance.enabled) {
      text = String(n.maintenance.message || ""); level = "warning";                // onderhoud kun je niet wegklikken
    } else if (n.announcement && n.announcement.enabled) {
      text = String(n.announcement.message || ""); level = n.announcement.level === "warning" ? "warning" : "info";
      key = noticeDismissKey(text);
      try { if (sessionStorage.getItem(key) === "1") text = ""; } catch (e) {}
    }
    bar.innerHTML = "";
    if (!text) { bar.style.display = "none"; return; }
    var span = document.createElement("span");
    span.textContent = text;
    bar.appendChild(span);
    if (key) {
      var close = document.createElement("button");
      close.setAttribute("aria-label", "Sluiten");
      close.textContent = "\u00d7";
      close.onclick = function () { try { sessionStorage.setItem(key, "1"); } catch (e) {} bar.style.display = "none"; };
      bar.appendChild(close);
    }
    bar.className = "notice-bar " + level;
    bar.style.display = "flex";
  }
  function applyRuntimeConfig(cfg) {
    window.appModules = cfg && cfg.modules && typeof cfg.modules === "object" ? cfg.modules : null;
    window.appNotice = { maintenance: cfg ? cfg.maintenance || null : null, announcement: cfg ? cfg.announcement || null : null };
    updateNoticeBar();
  }
  // Komt iemand terug naar de app, dan halen we de mededeling en de schakelaars opnieuw op (hooguit elke minuut).
  var lastConfigRefresh = Date.now();
  if (typeof document.addEventListener === "function") {
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible" || Date.now() - lastConfigRefresh < 60000) return;
      lastConfigRefresh = Date.now();
      fetch("/api/config").then(function (res) { return res.ok ? res.json() : null; }).then(function (cfg) { if (cfg) applyRuntimeConfig(cfg); }).catch(function () {});
    });
  }

  function bootstrapApp() {
    configLoaded = false;
    render();
    fetch("/api/config").then(function (res) {
      return res.ok ? res.json() : { authRequired: true };
    }).catch(function () {
      return { authRequired: true };
    }).then(function (cfg) {
      window.authRequired = cfg.authRequired !== false;
      window.bringImportEndpoint = typeof cfg.bringImportEndpoint === "string" ? cfg.bringImportEndpoint : "";
      applyRuntimeConfig(cfg);
      lastConfigRefresh = Date.now();
      configLoaded = true;
      if (window.authToken || !window.authRequired) initPersistence();
      render();
    });
  }

  window.render = render;
  window.bootstrapApp = bootstrapApp;
  startAutoSyncTimer();
  bootstrapApp();
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
