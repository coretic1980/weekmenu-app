<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --accent-ink: #14110C;

    --tag-kh-bg: #1C1912; --tag-kh-ink: #DCD7C6;
    --tag-eiwit-bg: #1A1712; --tag-eiwit-ink: #D6CFBC;

  html, body { height: 100%; }

<script>
(function () {
  "use strict";

  var AUTH_TOKEN_KEY = "weekmenu_token";
  var AUTH_UID_KEY = "weekmenu_uid";
  function getAuthToken() {
    try { return localStorage.getItem(AUTH_TOKEN_KEY); } catch (e) { return null; }
  }
  function setAuthToken(t) {
    try { if (t) localStorage.setItem(AUTH_TOKEN_KEY, t); else localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) {}
  }
  function getStoredUid() {
    try { return localStorage.getItem(AUTH_UID_KEY); } catch (e) { return null; }
  }
  function setStoredUid(u) {
    try { if (u) localStorage.setItem(AUTH_UID_KEY, u); else localStorage.removeItem(AUTH_UID_KEY); } catch (e) {}
  }
  window.authToken = getAuthToken();
  window.USER_ID = getStoredUid();
  window.setAuthToken = setAuthToken;
  window.setStoredUid = setStoredUid;

  // Anonymous profile ID: only accepted by the server while the admin has
  // switched login off. Account IDs can never be used this way.
  function getAnonId() {
    var id = null;
    try { id = localStorage.getItem("weekmenu_anon"); } catch (e) {}
    if (id && /^anon_[a-z0-9]{10,40}$/.test(id)) return id;
    var hex = "";
    try {
      var arr = new Uint8Array(12);
      window.crypto.getRandomValues(arr);
      for (var i = 0; i < arr.length; i++) hex += ("0" + arr[i].toString(16)).slice(-2);
    } catch (e) {
      for (var j = 0; j < 24; j++) hex += Math.floor(Math.random() * 16).toString(16);
    }
    id = "anon_" + hex;
    try { localStorage.setItem("weekmenu_anon", id); } catch (e) {}
    return id;
  }
  window.anonId = getAnonId();
  window.isStandalone = true; // deze versie genereert per maaltijdmoment parallel
  window.authHeaders = authHeaders;

  function authHeaders() {
    var h = {};
    if (window.authToken) h["Authorization"] = "Bearer " + window.authToken;
    if (window.anonId) h["X-Anon-Id"] = window.anonId;
    return h;
  }
  // On a 401 (expired session, or the admin just switched login on) start
  // fresh: a reload clears all in-memory data and re-checks the login setting.
  // The guard prevents a reload loop if 401s keep coming.
  function handleAuthExpired() {
    window.authToken = null;
    setAuthToken(null);
    var last = 0;
    try { last = Number(sessionStorage.getItem("weekmenu_401_reload") || 0); } catch (e) {}
    if (Date.now() - last < 5000) return;
    try { sessionStorage.setItem("weekmenu_401_reload", String(Date.now())); } catch (e) {}
    try { window.location.reload(); } catch (e) { if (window.bootstrapApp) window.bootstrapApp(); }
  }

  function parseErrorFromResponse(res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      var e = new Error(body.message || ("HTTP " + res.status));
      e.code = body.code || (res.status === 429 ? "rate_limited" : "error");
      return e;
    });
  }

  window.claude = {
    use: function (name) {
      if (name === "sample") {
        return Promise.resolve({
          json: function (payload) {
            return fetch(payload && payload.action === "tips" ? "/api/tips" : "/api/generate", {
              method: "POST",
              headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
              body: JSON.stringify(payload)
            }).then(function (res) {
              if (res.status === 401) handleAuthExpired();
              if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
              return res.json();
            }).then(function (data) { return data.result; });
          }
        });
      }
      if (name === "db") {
        return Promise.resolve({
          doc: function (path) {
            var subpath = path.split("/").pop();
            return {
              get: function () {
                return fetch("/api/db?subpath=" + encodeURIComponent(subpath), { headers: authHeaders() }).then(function (res) {
                  if (res.status === 401) { handleAuthExpired(); }
                  if (!res.ok) return { exists: false, data: function () { return undefined; } };
                  return res.json();
                }).then(function (body) {
                  return { exists: !!body.exists, data: function () { return body.value; } };
                });
              },
              set: function (value) {
                return fetch("/api/db", {
                  method: "POST",
                  headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
                  body: JSON.stringify({ subpath: subpath, value: value })
                }).then(function (res) {
                  if (res.status === 401) handleAuthExpired();
                  if (!res.ok) return parseErrorFromResponse(res).then(function (e) { throw e; });
                });
              }
            };
          }
        });
      }
      if (name === "user") {
        return Promise.resolve({ id: function () { return Promise.resolve((window.authToken && window.USER_ID) || window.anonId); } });
      }
      if (name === "downloads") {
        return Promise.resolve({
          save: function (opts) {
            try {
              var url = URL.createObjectURL(opts.data);
              var a = document.createElement("a");
              a.href = url;
              a.download = opts.filename || "download";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
              return Promise.resolve();
            } catch (e) {
              return Promise.reject(e);
            }
          }
        });
      }
      return Promise.resolve(null);
    }
  };
})();
</script>
<script>
(function () {
  "use strict";

  var WEEKS = [];

  WEEKS.forEach(function (w) {
    w.days.forEach(function (d) {
      if (!d.prep && !d.mealType) { d.mealType = "Diner"; }
    });
  });

  var pendingConfirmAction = null;
  var pendingCancelAction = null;
  function askConfirm(message, onConfirm, okLabel, cancelLabel, onCancel) {
    pendingConfirmAction = onConfirm;
    pendingCancelAction = onCancel || null;
    var overlay = document.getElementById("confirmOverlay");
    var msgEl = document.getElementById("confirmMsg");
    var okBtn = document.getElementById("confirmOkBtn");
    var cancelBtn = document.getElementById("confirmCancelBtn");
    if (msgEl) msgEl.textContent = message;
    if (okBtn) okBtn.textContent = okLabel || "Bevestigen";
    if (cancelBtn) cancelBtn.textContent = cancelLabel || "Annuleren";
    if (overlay) overlay.classList.add("active");
  }
  function closeConfirm() {
    pendingConfirmAction = null;
    pendingCancelAction = null;
    var overlay = document.getElementById("confirmOverlay");
    if (overlay) overlay.classList.remove("active");
  }
  (function wireConfirmOverlay() {
    var cancelBtn = document.getElementById("confirmCancelBtn");
    var okBtn = document.getElementById("confirmOkBtn");
    if (cancelBtn) cancelBtn.onclick = function () {
      var fn = pendingCancelAction;
      closeConfirm();
      if (fn) fn();
    };
    if (okBtn) okBtn.onclick = function () {
      var fn = pendingConfirmAction;
      closeConfirm();
      if (fn) fn();
    };
  })();

  var currentTheme = (function () {
    try { return localStorage.getItem("weekmenu_theme") || "dark"; } catch (e) { return "dark"; }
  })();
  try { document.documentElement.setAttribute("data-theme", currentTheme); } catch (e) {}
  function toggleTheme() {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    try { document.documentElement.setAttribute("data-theme", currentTheme); } catch (e) {}
    try { localStorage.setItem("weekmenu_theme", currentTheme); } catch (e) {}
    render();
  }

  var state = { view: "weeks", weekId: null, dayId: null, stepIndex: 0, generating: false, genError: null, genSuccess: null, variating: false, variateError: null, planWeekId: null, planSlotKey: null, planDayName: null, dayServings: null, dayBackView: null, dayBackWeekId: null, dayBackDayName: null, wizardStep: 0 };
  var busyCount = 0;
  var busyMessages = [];
  function updateBusyUI() {
    var el = document.getElementById("busyBar");
    var textEl = document.getElementById("busyText");
    if (!el) return;
    if (busyCount > 0) {
      el.classList.add("active");
      if (document.body) document.body.classList.add("busy-active");
      var topMsg = busyMessages.length ? busyMessages[busyMessages.length - 1] : "Bezig…";
      if (textEl) textEl.textContent = typeof topMsg === "function" ? topMsg() : topMsg;
    } else {
      el.classList.remove("active");
      if (document.body) document.body.classList.remove("busy-active");
    }
  }
  function busyStart(message) {
    busyCount++;
    busyMessages.push(message || "Bezig…");
    updateBusyUI();
  }
  function busyEnd() {
    busyCount = Math.max(0, busyCount - 1);
    busyMessages.pop();
    updateBusyUI();
  }

  var toastTimer = null;
  function showToast(message) {
    var el = document.getElementById("toast");
    var textEl = document.getElementById("toastText");
    if (!el || !textEl) return;
    textEl.textContent = message;
    el.classList.add("active");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("active"); }, 4500);
  }

  var completed = {};
  var shoppingChecked = {};
  var plannedWeeks = [];
  var libraryFilter = "Alle";
  var libraryGoalFilter = "Alle";
  var shoppingViewMode = "week";
  var priceCache = {};
  var shoppingPriceLoading = false;
  var shoppingPriceError = null;
  var timerInterval = null;
  var timerRemaining = 0;
  var timerRunning = false;

  var PLAN_DAYS = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag", "Zondag"];
  var PLAN_MEALS = ["Ontbijt", "Lunch", "Diner", "Snack"];
  var PLAN_SLOTS = ["Ontbijt", "Snack na ontbijt", "Lunch", "Snack na lunch", "Diner", "Snack na diner"];
  var SLOT_TO_MEALTYPE = {
    "Ontbijt": "Ontbijt",
    "Snack na ontbijt": "Snack",
    "Lunch": "Lunch",
    "Snack na lunch": "Snack",
    "Diner": "Diner",
    "Snack na diner": "Snack"
  };

  var CUISINES = ["Italiaans", "Aziatisch", "Mediterraan", "Midden-Oosters", "Nederlands", "Mexicaans"];
  var FLAVORS = ["Fris", "Romig", "Pittig", "Kruidig", "Hartig", "Umami"];
  var LEVELS = ["Basic", "Home-style", "Gastronomisch"];

  var GENDERS = ["Man", "Vrouw", "Anders"];

  var prefs = {
    name: "",
    bringListLink: "",
    cuisines: [],
    flavors: [],
    level: "Home-style",
    dietStyle: "",
    equipment: EQUIPMENT.slice(),
    exclude: "",
    count: 7,
    mealTypes: ["Ontbijt", "Lunch", "Diner", "Snack"],

  };

  function findWeek(id) { return WEEKS.filter(function (w) { return w.id === id; })[0]; }
  function findDay(week, id) { return week.days.filter(function (d) { return d.id === id; })[0]; }

  function extractDishArray(result) {
    if (Array.isArray(result)) return result;
    if (result && typeof result === "object") {
      var keys = Object.keys(result);
      for (var i = 0; i < keys.length; i++) {
        if (Array.isArray(result[keys[i]]) && result[keys[i]].length) return result[keys[i]];
      }
    }
    return null;
  }

  function findDayAnywhere(dayId) {
    for (var i = 0; i < WEEKS.length; i++) {
      var w = WEEKS[i];
      for (var j = 0; j < w.days.length; j++) {
        if (w.days[j].id === dayId) return { week: w, day: w.days[j] };
      }
    }
    return null;
  }

  function resolveAssignedDish(assigned) {
    var wk = findWeek(assigned.weekId);
    var day = wk ? findDay(wk, assigned.dayId) : null;
    if (day) return { week: wk, day: day };
    var found = findDayAnywhere(assigned.dayId);
    if (found) { assigned.weekId = found.week.id; return found; }
    return null;
  }

  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);

    themeBtn.innerHTML = currentTheme === "dark"

      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function macroTags(day, opts) {
    var wrap = document.createElement("div");

      var t = document.createElement("span");
      t.className = "tag neutral";

      return wrap;
    }
    var items = [
      ["neutral", day.kcal + " kcal"],
    ];
    if (day.bereidingstijd) items.push(["neutral", "⏱ " + day.bereidingstijd + " min"]);
    items = items.concat([
      ["kh", "KH " + day.kh + "%" + (day.khG !== undefined ? " (" + day.khG + "g)" : "")],
      ["eiwit", "Eiwit " + day.eiwit + "%" + (day.eiwitG !== undefined ? " (" + day.eiwitG + "g)" : "")],
      ["vet", "Vet " + day.vet + "%" + (day.vetG !== undefined ? " (" + day.vetG + "g)" : "")],
      ["balans", "Balans " + day.balans + "%"]
    ]);
    if (day.mealType && !(opts && opts.hideMealType)) items.unshift(["neutral", day.mealType]);
    items.forEach(function (it) {
      var t = document.createElement("span");
      t.className = "tag " + it[0];

      wrap.appendChild(t);

  // Controleert een door de AI geleverde lijst met tips en houdt alleen bruikbare items over.
  function cleanTipList(raw) {
    var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.tips) ? raw.tips : []);
    var out = [], seen = {};
    list.forEach(function (item) {
      if (!item || typeof item !== "object") return;
      var text = String(item.tekst || item.text || "").replace(/\s+/g, " ").trim();
      if (text.length < 20 || text.length > 240) return;
      var key = text.toLowerCase().slice(0, 50);
      if (seen[key]) return;
      seen[key] = true;
      var type = item.type === "feit" || item.type === "balanza" ? item.type : "tip";
      out.push({ type: type, tekst: text });
    });
    return out.slice(0, 12);
  }

  // ---------- Wachtscherm-carrousel: steeds nieuwe weetjes en tips ----------
  // Tijdens het genereren toont het startscherm een carrousel. De tips worden in

  var tipQueue = [];
  var tipLoading = false;
  var tipBatches = 0;
  var tipFailures = 0;
  var tipDeck = [];
  var tipSeen = [];
  try {
    var rawSeen = JSON.parse(localStorage.getItem(TIP_SEEN_KEY) || "[]");
    if (Array.isArray(rawSeen)) tipSeen = rawSeen.filter(function (x) { return typeof x === "string"; }).slice(-TIP_SEEN_MAX);
  } catch (e) {}

  function tipKey(text) { return String(text).toLowerCase().replace(/[^a-z0-9\u00e0-\u00ff]+/g, " ").trim().slice(0, 50); }
  function tipIsSeen(text) {
    var k = tipKey(text);
    return tipSeen.some(function (s) { return tipKey(s) === k; });
  }
  function rememberTip(text) {
    tipSeen.push(String(text).slice(0, 90));
    if (tipSeen.length > TIP_SEEN_MAX) tipSeen = tipSeen.slice(-TIP_SEEN_MAX);
    try { localStorage.setItem(TIP_SEEN_KEY, JSON.stringify(tipSeen)); } catch (e) {}
  }
  function recentTipTexts() { return tipSeen.slice(-25); }

  function nextStaticTip() {
    if (!tipDeck.length) {
      var pool = [];
      STATIC_TIPS.forEach(function (t, i) { if (!tipIsSeen(t.s)) pool.push(i); });
      if (!pool.length) STATIC_TIPS.forEach(function (t, i) { pool.push(i); });
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      tipDeck = pool;
    }
    return STATIC_TIPS[tipDeck.pop()];
  }

  function addTips(raw) {
    cleanTipList(raw).forEach(function (tip) {
      if (tipIsSeen(tip.tekst)) return;
      var k = tipKey(tip.tekst);
      if (tipQueue.some(function (q) { return tipKey(q.s) === k; })) return;
      tipQueue.push({ t: tip.type, s: tip.tekst, ai: true });
    });
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(timer); resolve(v); }, function (e) { clearTimeout(timer); reject(e); });
    });
  }

  // De standalone-versie stuurt alleen de ruwe gegevens; de server stelt de opdracht samen.
  function requestTips() {
    return claude.use("sample").then(function (sample) {
      if (!sample) throw new Error("niet beschikbaar");
      return sample.json({ action: "tips", params: { goal: prefs.goal, dietStyle: prefs.dietStyle, avoid: recentTipTexts() } }, { modelTier: "default" });
    });
  }

  function fetchTipBatch() {
    if (!moduleOn("tips")) return;
    if (tipLoading || tipFailures >= 2 || tipBatches >= TIP_MAX_BATCHES) return;
    tipLoading = true;
    tipBatches++;
    withTimeout(requestTips(), TIP_TIMEOUT_MS).then(function (raw) {
      tipLoading = false;
      var before = tipQueue.length;
      addTips(raw);
      if (tipQueue.length === before) tipFailures++; else tipFailures = 0;
    }).catch(function () {
      tipLoading = false;
      tipFailures++;
    });
  }

  function nextTip() {
    var tip = tipQueue.shift() || nextStaticTip();
    rememberTip(tip.s);
    if (tipQueue.length <= TIP_REFILL_AT) fetchTipBatch();
    return tip;
  }

  var factInterval = null;
  function startFactCarousel() {
    if (factInterval) return;
    tipBatches = 0;
    tipFailures = 0;
    state.tip = nextTip();
    state.tipShownAt = Date.now();
    factInterval = setInterval(function () {
      state.tip = nextTip();
      state.tipShownAt = Date.now();
      render();
    }, TIP_SLIDE_MS);
  }
  function stopFactCarousel() {
    if (factInterval) { clearInterval(factInterval); factInterval = null; }
    state.tip = null;
  }

  function submitAuth(action) {
    var emailEl = document.getElementById("authEmail");
    var pwEl = document.getElementById("authPassword");
    var email = emailEl ? emailEl.value.trim() : "";
    var password = pwEl ? pwEl.value : "";

    var takeAnon = action === "register" && !!authState.anonStatus && authState.anonStatus.hasData === true && authState.takeAnon !== false;
    authState.busy = true;
    render();
    (takeAnon ? upgradeRequest(email, password) : fetch("/api/auth/" + action, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.message || "Er ging iets mis.");
        return data;
      });
    })).then(function (data) {
      storeSession(data);
      authState.busy = false;
      authState.anonStatus = undefined;   // het anonieme profiel bestaat niet meer
      goto("weeks");
      initPersistence();
      if (takeAnon) showToast(upgradeDoneMessage(data.migrated));
    }).catch(function (e) {
      authState.busy = false;
      authState.error = e.message;
      render();
    });

  function submitResetPassword() {
    var pwEl = document.getElementById("authPassword");
    var pw2El = document.getElementById("authPassword2");
    var password = pwEl ? pwEl.value : "";
    var password2 = pw2El ? pw2El.value : "";

      authState.error = "Wachtwoorden komen niet overeen.";
      render();
      return;
    }
    authState.busy = true;
    render();
    fetch("/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: authState.resetToken, newPassword: password })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.message || "Er ging iets mis.");
        return data;
      });
    }).then(function (data) {
      window.authToken = data.token;
      window.setAuthToken(window.authToken);
      window.USER_ID = data.uid;
      window.setStoredUid(window.USER_ID);
      authState.busy = false;
      authState.mode = "login";
      authState.resetToken = null;
      try { window.history.replaceState({}, "", window.location.pathname); } catch (e) {}
      goto("weeks");
      initPersistence();

      authState.busy = false;
      authState.error = e.message;
      render();

  var upgradeState = { error: null, busy: false, email: "" };

  // "3 gerechten, 2 weken planning, …" voor wat er onder het anonieme profiel staat of is meegenomen.
  function describeMigrated(m) {
    var parts = [];
    if (m && m.dishes) parts.push(m.dishes + (m.dishes === 1 ? " gerecht" : " gerechten"));
    if (m && m.plannedWeeks) parts.push(m.plannedWeeks + (m.plannedWeeks === 1 ? " week planning" : " weken planning"));
    if (m && m.lists) parts.push(m.lists + (m.lists === 1 ? " gedeelde lijst" : " gedeelde lijsten"));
    if (m && m.prefs) parts.push("je voorkeuren");
    return parts.join(", ");
  }
  function friendlyNetError(e) {
    return e && e.name === "TypeError" ? "Geen verbinding. Controleer je internet en probeer het opnieuw." : ((e && e.message) || "Er ging iets mis.");
  }
  function upgradeRequest(email, password) {
    return fetch("/api/auth/upgrade", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Anon-Id": window.anonId },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.message || "Er ging iets mis.");
        return data;
      });
    });
  }
  function storeSession(data) {
    window.authToken = data.token;
    window.setAuthToken(window.authToken);
    window.USER_ID = data.uid;
    window.setStoredUid(window.USER_ID);
  }
  function upgradeDoneMessage(m) {
    var what = describeMigrated(m);
    return "Account aangemaakt" + (what ? " — meegenomen: " + what + "." : ".");
  }

  function submitUpgrade() {
    var emailEl = document.getElementById("upgradeEmail"), pwEl = document.getElementById("upgradePassword"), pw2El = document.getElementById("upgradePassword2");
    var email = emailEl ? emailEl.value.trim() : "", password = pwEl ? pwEl.value : "", password2 = pw2El ? pw2El.value : "";
    upgradeState.email = email;
    upgradeState.error = null;
    if (!email || email.indexOf("@") === -1) upgradeState.error = "Vul een geldig e-mailadres in.";
    else if (password.length < 8) upgradeState.error = "Wachtwoord moet minstens 8 tekens zijn.";
    else if (password !== password2) upgradeState.error = "Wachtwoorden komen niet overeen.";
    if (upgradeState.error) { render(); return; }
    upgradeState.busy = true;
    render();
    upgradeRequest(email, password).then(function (data) {
      // Wat de app nu in het geheugen heeft is precies wat er is meegenomen; dus niets opnieuw laden.
      // Vanaf nu bewaart de app alles onder het account.
      storeSession(data);
      upgradeState.busy = false; upgradeState.error = null; upgradeState.email = "";
      goto("weeks");
      showToast(upgradeDoneMessage(data.migrated));
    }).catch(function (e) {
      upgradeState.busy = false;
      upgradeState.error = friendlyNetError(e);
      render();
    });
  }

      if (authState.mode === "register" && window.anonId) {

      if (authState.mode === "login" && moduleOn("passwordReset")) {
        var forgotLink = document.createElement("button");
        forgotLink.className = "wizard-skip";

      submitBtn.className = "primary-btn";
      submitBtn.style.marginTop = "8px";
      submitBtn.disabled = authState.busy;
      submitBtn.textContent = authState.busy ? "Even geduld…" : (authState.mode === "login" ? "Inloggen" : "Account aanmaken");
      submitBtn.onclick = function () { submitAuth(authState.mode === "login" ? "login" : "register"); };
      main.appendChild(submitBtn);

      if (moduleOn("registration")) {
        var toggle = document.createElement("button");
        toggle.className = "wizard-skip";
        toggle.style.marginTop = "14px";

          render();

      }

      app.appendChild(main);
      var pwField = document.getElementById("authPassword");
      if (pwField) {
        pwField.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitAuth(authState.mode === "login" ? "login" : "register");
        });
      }
    } else if (authState.mode === "forgot") {
      var fEmailInput = document.createElement("input");
      fEmailInput.type = "email";
      fEmailInput.id = "authEmail";
      fEmailInput.placeholder = "E-mailadres";

      fSubmitBtn.textContent = authState.busy ? "Even geduld…" : "Verstuur reset-link";
      fSubmitBtn.onclick = submitForgotPassword;
      main.appendChild(fSubmitBtn);

      var backToLogin = document.createElement("button");
      backToLogin.className = "wizard-skip";
      backToLogin.style.marginTop = "14px";
      backToLogin.textContent = "Terug naar inloggen";
      backToLogin.onclick = function () {
        authState.mode = "login"; authState.error = null; authState.info = null; render();
      };
      main.appendChild(backToLogin);

      app.appendChild(main);
    } else if (authState.mode === "reset") {
      var rPwInput = document.createElement("input");
      rPwInput.type = "password";
      rPwInput.id = "authPassword";
      rPwInput.placeholder = "Nieuw wachtwoord (minstens 8 tekens)";

      var rSubmitBtn = document.createElement("button");
      rSubmitBtn.className = "primary-btn";
      rSubmitBtn.disabled = authState.busy;
      rSubmitBtn.textContent = authState.busy ? "Even geduld…" : "Wachtwoord instellen";
      rSubmitBtn.onclick = submitResetPassword;
      main.appendChild(rSubmitBtn);

      app.appendChild(main);
    }

  function toggleInArray(arr, val) {
    var i = arr.indexOf(val);
    if (i === -1) arr.push(val); else arr.splice(i, 1);
  }

  var WIZARD_STEP_COUNT = 6;

  function finishWizard(goHome) {
    savePrefs();
    goto(goHome ? "weeks" : "prefs");
  }

  function renderWizard() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderTopbar("Welkom", state.wizardStep > 0, function () { state.wizardStep -= 1; render(); }));
    var main = document.createElement("main");

    var progress = document.createElement("div");
    progress.className = "wizard-progress";
    for (var i = 0; i < WIZARD_STEP_COUNT; i++) {
      var dot = document.createElement("div");
      dot.className = "wizard-dot" + (i === state.wizardStep ? " active" : i < state.wizardStep ? " done" : "");
      progress.appendChild(dot);
    }
    main.appendChild(progress);

    function heading(title, sub) {
      var h = document.createElement("h2");
      h.style.fontFamily = "Fraunces, serif";
      h.style.fontWeight = "600";
      h.style.fontSize = "24px";
      h.style.margin = "0";
      h.textContent = title;
      main.appendChild(h);
      if (sub) {
        var p = document.createElement("p");
        p.style.margin = "0";
        p.style.fontSize = "14.5px";
        p.style.color = "var(--muted)";
        p.style.lineHeight = "1.6";
        p.textContent = sub;
        main.appendChild(p);
      }
    }
    function labelEl(text, hint) {
      var l = document.createElement("div");
      l.className = "field-label";
      l.textContent = text;
      main.appendChild(l);
      if (hint) {
        var h = document.createElement("div");
        h.className = "field-hint";
        h.textContent = hint;
        main.appendChild(h);
      }
    }
    function chipGroupMulti(options, selectedArr) {
      var row = document.createElement("div");
      row.className = "chiprow";
      options.forEach(function (opt) {
        var chip = document.createElement("button");
        chip.className = "chip" + (selectedArr.indexOf(opt) > -1 ? " selected" : "");
        chip.textContent = opt;
        chip.onclick = function () { toggleInArray(selectedArr, opt); render(); };
        row.appendChild(chip);
      });
      main.appendChild(row);
    }
    function chipGroupSingle(pairs, current, onPick) {
      var row = document.createElement("div");
      row.className = "chiprow";
      pairs.forEach(function (pair) {
        var chip = document.createElement("button");
        chip.className = "chip" + (current === pair[0] ? " selected" : "");
        chip.textContent = pair[1];
        chip.onclick = function () { onPick(pair[0]); render(); };
        row.appendChild(chip);
      });
      main.appendChild(row);
    }

    if (state.wizardStep === 0) {
      heading("Welkom bij Balanza", "Laten we in een paar korte stapjes je voorkeuren instellen, zodat de gerechten die we voor je maken meteen goed passen. Dit duurt minder dan een minuut.");
      labelEl("Hoe mogen we je noemen?", "Optioneel — je naam verschijnt op het startscherm");
      var wNameInp = document.createElement("input");
      wNameInp.className = "textinput";
      wNameInp.type = "text";
      wNameInp.maxLength = 40;
      wNameInp.value = prefs.name || "";
      wNameInp.placeholder = "Bijv. Dave";
      wNameInp.oninput = function (e) { prefs.name = e.target.value; };
      main.appendChild(wNameInp);
      labelEl("Voor welke maaltijdmomenten wil je gerechten?", "Meerdere mogelijk");
      chipGroupMulti(PLAN_MEALS, prefs.mealTypes);
    } else if (state.wizardStep === 1) {
      heading("Wat is je doel?", "Dit bepaalt de macroverdeling (koolhydraten/eiwit/vet) waar we naar streven.");
      var goalPairs = Object.keys(GOAL_DESCRIPTIONS).map(function (g) { return [g, g]; });
      chipGroupSingle(goalPairs, prefs.goal, function (g) { prefs.goal = g; });
      var descBox = document.createElement("div");
      descBox.className = "plainbox";
      descBox.textContent = GOAL_DESCRIPTIONS[prefs.goal];
      main.appendChild(descBox);
    } else if (state.wizardStep === 2) {
      heading("Heb je een voedingsstijl?", "Kies \u201cGeen voorkeur\u201d als dit niet van toepassing is.");
      var dietPairs = [["", "Geen voorkeur"]].concat(DIET_STYLES.map(function (d) { return [d, d]; }));
      chipGroupSingle(dietPairs, prefs.dietStyle, function (d) { prefs.dietStyle = d; });
    } else if (state.wizardStep === 3) {
      heading("Smaak en niveau", "Ook dit mag je overslaan als je geen voorkeur hebt.");
      labelEl("Keukenstijl", "Meerdere mogelijk, of laat leeg");
      chipGroupMulti(CUISINES, prefs.cuisines);
      labelEl("Culinair niveau");
      chipGroupSingle(LEVELS.map(function (l) { return [l, l]; }), prefs.level, function (l) { prefs.level = l; });
    } else if (state.wizardStep === 4) {
      heading("Lichaamsprofiel", "Optioneel \u2014 helpt om de porties nauwkeuriger af te stemmen. Mag je leeg laten.");
      var bioRow = document.createElement("div");
      bioRow.className = "segrow";
      bioRow.style.flexWrap = "wrap";
      [["heightCm", "Lengte (cm)"], ["weightKg", "Gewicht (kg)"], ["age", "Leeftijd"]].forEach(function (pair) {
        var inp = document.createElement("input");
        inp.className = "textinput";
        inp.type = "number";
        inp.placeholder = pair[1];
        inp.value = prefs[pair[0]];
        inp.style.flex = "1";
        inp.style.minWidth = "104px";
        inp.oninput = function (e) { prefs[pair[0]] = e.target.value; };
        bioRow.appendChild(inp);
      });
      main.appendChild(bioRow);
      labelEl("Geslacht");
      chipGroupSingle([["", "Geen voorkeur"]].concat(GENDERS.map(function (g) { return [g, g]; })), prefs.gender, function (g) { prefs.gender = g; });
      labelEl("Activiteitsniveau");
      chipGroupSingle(ACTIVITY_LEVELS.map(function (a) { return [a, a]; }), prefs.activityLevel, function (a) { prefs.activityLevel = a; });
    } else if (state.wizardStep === 5) {
      heading("Alvast aan de slag?", "Wil je nu meteen gerechten laten genereren op basis van je voorkeuren?");

      var plannedCount = plannedGenerationCount();

      var timeHint = document.createElement("div");
      timeHint.className = "field-hint";
      timeHint.textContent = "Verwachte wachttijd: " + formatEstimateRange(estimateGenerationSeconds(plannedCount, false)) +
        ". Afbeeldingen ophalen kost " + formatImageExtra() + ".";
      main.appendChild(timeHint);

      var withImgBtn = document.createElement("button");
      withImgBtn.className = "primary-btn";
      withImgBtn.textContent = "Ja, met afbeeldingen";
      withImgBtn.onclick = function () { savePrefs(); goto("weeks"); generateMeals(true); };
      main.appendChild(withImgBtn);

      var noImgBtn = document.createElement("button");
      noImgBtn.className = "ghost-btn";
      noImgBtn.textContent = "Ja, zonder afbeeldingen";
      noImgBtn.onclick = function () { savePrefs(); goto("weeks"); generateMeals(false); };
      main.appendChild(noImgBtn);

      var laterSpacer = document.createElement("div");
      laterSpacer.style.flex = "1";
      main.appendChild(laterSpacer);

      var laterBtn = document.createElement("button");
      laterBtn.className = "wizard-skip";
      laterBtn.textContent = "Nee, ik doe dit later zelf";
      laterBtn.onclick = function () { finishWizard(false); };
      main.appendChild(laterBtn);

      app.appendChild(main);
      return;
    }

    var spacer = document.createElement("div");
    spacer.style.flex = "1";
    main.appendChild(spacer);

    var skipBtn = document.createElement("button");
    skipBtn.className = "wizard-skip";
    skipBtn.textContent = "Overslaan, gebruik standaardinstellingen";
    skipBtn.onclick = function () { finishWizard(false); };
    main.appendChild(skipBtn);

    var nav = document.createElement("div");
    nav.className = "wizard-nav";
    var nextBtn = document.createElement("button");
    nextBtn.className = "primary-btn";
    var isLast = state.wizardStep === WIZARD_STEP_COUNT - 1;
    nextBtn.textContent = isLast ? "Aan de slag!" : "Volgende";
    nextBtn.onclick = function () {
      if (isLast) { finishWizard(false); }
      else { state.wizardStep += 1; render(); }
    };
    nav.appendChild(nextBtn);
    main.appendChild(nav);

    app.appendChild(main);
  }

  var GOALS = ["Onderhoud", "Vetverlies (spierbehoud)", "Cutting", "Spieropbouw (lean bulk)", "Atleet (prestatiegericht)"];
  var GOAL_TARGETS = {
    "Onderhoud": { kh: 33, eiwit: 33, vet: 34 },
    "Vetverlies (spierbehoud)": { kh: 30, eiwit: 40, vet: 30 },
    "Cutting": { kh: 25, eiwit: 45, vet: 30 },
    "Spieropbouw (lean bulk)": { kh: 40, eiwit: 30, vet: 30 },
    "Atleet (prestatiegericht)": { kh: 45, eiwit: 25, vet: 30 }
  };
  var GOAL_DESCRIPTIONS = {
    "Onderhoud": "gelijke verdeling (±33% koolhydraten/eiwit/vet) om gewicht te behouden",
    "Vetverlies (spierbehoud)": "hoger eiwit, lager koolhydraten en vet, voor vetverlies met behoud van spiermassa (streef naar 30% koolhydraten / 40% eiwit / 30% vet)",
    "Cutting": "zeer hoog eiwit, laag koolhydraten, voor een agressiever calorietekort met maximaal spierbehoud (streef naar 25% koolhydraten / 45% eiwit / 30% vet)",
    "Spieropbouw (lean bulk)": "hoger koolhydraten en eiwit voor spieropbouw met een lichte overschot (streef naar 40% koolhydraten / 30% eiwit / 30% vet)",
    "Atleet (prestatiegericht)": "hoger koolhydraten voor trainings- en wedstrijdbrandstof, met voldoende eiwit voor herstel (streef naar 45% koolhydraten / 25% eiwit / 30% vet)"
  };

  function goalTarget() {
    return GOAL_TARGETS[prefs.goal] || GOAL_TARGETS["Onderhoud"];
  }

  function computeBalance(khPct, eiwitPct, vetPct, target) {
    var t = target || goalTarget();
    var maxDev = Math.max(Math.abs(khPct - t.kh), Math.abs(eiwitPct - t.eiwit), Math.abs(vetPct - t.vet));
    var score = Math.round(100 - 3 * maxDev);
    return Math.max(0, Math.min(100, score));
  }

  function plannedGenerationCount() {
    var n = prefs.mealTypes.length || 1;
    return prefs.count * n;
  }

  // ---------- Tijdschatting voor genereren ----------
  // Leert van je eigen generaties: na elke geslaagde generatie onthouden we hoe
  // lang het per gerecht duurde (en hoe lang het ophalen van afbeeldingen
  // kostte). De schatting gebruikt de mediaan van de laatste 10 metingen en de
  // werkelijke spreiding daarin. Zolang er nog geen metingen zijn, geldt een
  // voorzichtige standaardwaarde. In de standalone-versie wordt per
  // maaltijdmoment parallel gegenereerd, dus telt alleen het aantal gerechten
  // per maaltijdmoment mee; de claude.ai-versie genereert alles in één keer.
  var TIMING_KEY = "weekmenu_timing_v1";
  var TIMING_BASE_SECS = 5;
  var TIMING_DEFAULT_PER_DISH = window.isStandalone ? 14 : 12;
  var TIMING_DEFAULT_IMG_SECS = 5;
  var TIMING_KEEP = 10;
  var timingMem = { rates: [], imgs: [] };

  function loadTiming() {
    try {
      var raw = localStorage.getItem(TIMING_KEY);
      if (raw) {
        var t = JSON.parse(raw);
        if (t && Array.isArray(t.rates) && Array.isArray(t.imgs)) return t;
      }
    } catch (e) {}
    return timingMem;
  }
  function saveTiming(t) {
    timingMem = t;
    try { localStorage.setItem(TIMING_KEY, JSON.stringify(t)); } catch (e) {}
  }
  function quantile(values, q) {
    if (!values.length) return 0;
    var s = values.slice().sort(function (a, b) { return a - b; });
    var pos = (s.length - 1) * q;
    var lo = Math.floor(pos), hi = Math.ceil(pos);
    return s[lo] + (s[hi] - s[lo]) * (pos - lo);
  }
  function criticalDishes(totalDishes) {
    if (!window.isStandalone) return totalDishes;
    return Math.ceil(totalDishes / Math.max(1, prefs.mealTypes.length || 1));
  }
  function recordGenerationTiming(seconds, critical) {
    if (!(seconds > 0) || !(critical > 0)) return;
    var rate = Math.max(1, (seconds - TIMING_BASE_SECS) / critical);
    var t = loadTiming();
    t.rates.push(Math.round(rate * 10) / 10);
    if (t.rates.length > TIMING_KEEP) t.rates = t.rates.slice(-TIMING_KEEP);
    saveTiming(t);
  }
  function recordImageTiming(seconds) {
    if (!(seconds > 0)) return;
    var t = loadTiming();
    t.imgs.push(Math.round(seconds * 10) / 10);
    if (t.imgs.length > TIMING_KEEP) t.imgs = t.imgs.slice(-TIMING_KEEP);
    saveTiming(t);
  }
  function estimateGenerationSeconds(count, withImages) {
    var t = loadTiming();
    var perDish = t.rates.length ? quantile(t.rates, 0.5) : TIMING_DEFAULT_PER_DISH;
    var img = withImages ? (t.imgs.length ? quantile(t.imgs, 0.5) : TIMING_DEFAULT_IMG_SECS) : 0;
    return TIMING_BASE_SECS + criticalDishes(count) * perDish + img;
  }
  function timingSpread() {
    var lowF = 0.75, highF = 1.7;
    var rates = loadTiming().rates;
    if (rates.length >= 3) {
      var med = quantile(rates, 0.5);
      if (med > 0) {
        lowF = Math.min(0.9, Math.max(0.6, quantile(rates, 0.2) / med));
        highF = Math.min(2.5, Math.max(1.3, quantile(rates, 0.9) / med));
      }
    }
    return { lowF: lowF, highF: highF };
  }
  function estimateBounds(seconds) {
    var sp = timingSpread();
    return { low: seconds * sp.lowF, high: seconds * sp.highF };
  }
  function formatSecondsRange(low, high) {
    low = Math.max(5, low);
    high = Math.max(low, high);
    if (high < 100) {
      var l = Math.max(5, Math.round(low / 5) * 5);
      var h = Math.max(l, Math.round(high / 5) * 5);
      return l === h ? l + " sec" : l + "–" + h + " sec";
    }
    function half(s) { return Math.max(0.5, Math.round(s / 30) / 2); }
    function fmt(m) { return String(m).replace(".", ","); }
    var lm = half(low), hm = half(high);
    return lm === hm ? fmt(lm) + " min" : fmt(lm) + "–" + fmt(hm) + " min";
  }
  function formatEstimateRange(seconds) {
    var b = estimateBounds(seconds);
    return "~" + formatSecondsRange(b.low, b.high);
  }
  // Wat het ophalen van afbeeldingen er extra bij kost. Dat is een kwestie van seconden
  // (de foto's worden gelijktijdig opgehaald), dus tonen we het los van de wachttijd:
  // op halve minuten afgerond zou het verschil daar niet te zien zijn.
  function formatImageExtra() {
    var t = loadTiming();
    var s = t.imgs.length ? quantile(t.imgs, 0.5) : TIMING_DEFAULT_IMG_SECS;
    return "ongeveer " + formatSecondsRange(s * 0.6, s * 1.8) + " extra";
  }
  function genRemainingText(startMs, bounds) {
    var elapsed = (Date.now() - startMs) / 1000;
    if (elapsed >= bounds.high) return "· duurt langer dan verwacht, nog even geduld…";
    if (bounds.low - elapsed < 15) return "· nog maximaal ca. " + formatSecondsRange(bounds.high - elapsed, bounds.high - elapsed);
    return "· nog ca. " + formatSecondsRange(bounds.low - elapsed, bounds.high - elapsed);
  }
  var genTickerId = null;
  function stopGenTicker() {
    if (genTickerId) { clearInterval(genTickerId); genTickerId = null; }
  }
  function startGenTicker() {
    stopGenTicker();
    genTickerId = setInterval(updateBusyUI, 1000);
  }

  // ---------- Foto's ----------
  // Het zoeken zelf gebeurt op de server (/api/image). Het antwoord bevat "final":
  // true als de uitkomst definitief is (foto gevonden, of echt geen goede match).
  // Bij een tijdelijke storing (bijv. de Unsplash-limiet) laten we het gerecht
  // ongemoeid, zodat er later opnieuw gezocht wordt in plaats van voorgoed
  // "geen foto". IMAGE_V markeert uitkomsten die met deze werkwijze zijn bepaald;
  // een oudere "geen foto" zonder markering wordt daarom nog eens opnieuw bekeken.
  var IMAGE_V = 2;
  var imageRetryAt = {};
  function imageRequestUrl(day) {
    return "/api/image?query=" + encodeURIComponent(day.name || "") +
      (day.fotoZoekterm ? "&term=" + encodeURIComponent(day.fotoZoekterm) : "");
  }
  // Slaat een definitieve uitkomst op het gerecht op (true), of stelt een nieuwe poging uit (false).
  function applyImageResult(day, data) {
    if (data && data.url) {
      day.imageUrl = data.url;
      day.imageCredit = data.credit || null;
      day.imageV = IMAGE_V;
      return true;
    }
    if (data && data.final) {
      day.imageUrl = null;
      day.imageCredit = null;
      day.imageV = IMAGE_V;
      return true;
    }
    imageRetryAt[day.id || day.name] = Date.now() + 10 * 60 * 1000;
    return false;
  }

  function fetchImageForDish(day) {
    return fetch(imageRequestUrl(day)).then(function (res) {
      return res.ok ? res.json() : { url: null, credit: null, final: false };
    }).then(function (data) {
      applyImageResult(day, data);
    }).catch(function () {
      applyImageResult(day, null);
    });
  }

  function generateMeals(withImages) {
    if (state.generating) return;
    state.genError = null;
    state.genSuccess = null;
    state.generating = true;
    var genStart = Date.now();
    var genTotal = plannedGenerationCount();
    var genCritical = criticalDishes(genTotal);
    var genBounds = estimateBounds(estimateGenerationSeconds(genTotal, false));
    busyStart(function () { return "Gerechten worden gegenereerd… " + genRemainingText(genStart, genBounds); });
    startGenTicker();
    savePrefs();
    render();

    claude.use("sample").then(function (sample) {
      if (!sample) {
        state.generating = false;
        stopGenTicker();
        busyEnd();
        state.genError = "Genereren is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      var genParams = {
        mealTypes: prefs.mealTypes, count: prefs.count, cuisines: prefs.cuisines, flavors: prefs.flavors,
        level: prefs.level, dietStyle: prefs.dietStyle, equipment: prefs.equipment, exclude: prefs.exclude,
        goal: prefs.goal, gender: prefs.gender, heightCm: prefs.heightCm, weightKg: prefs.weightKg,
        age: prefs.age, activityLevel: prefs.activityLevel
      };
      var mealTypesSel = prefs.mealTypes.length ? prefs.mealTypes : ["Diner"];
      sample.json({ action: "generate", params: genParams }, { modelTier: "default" }).then(function (result) {
        var list = extractDishArray(result);
        if (!list || !list.length) throw new Error("Onverwacht antwoordformaat.");
        recordGenerationTiming((Date.now() - genStart) / 1000, genCritical);

        var days = list.map(function (d, idx) {
          var kcal = Number(d.kcal) || 0;
          var khG = Number(d.kh_g) || 0;
          var eiwitG = Number(d.eiwit_g) || 0;
          var vetG = Number(d.vet_g) || 0;
          var khPct = kcal ? Math.round((khG * 4 / kcal) * 100) : 0;
          var eiwitPct = kcal ? Math.round((eiwitG * 4 / kcal) * 100) : 0;
          var vetPct = kcal ? Math.round((vetG * 9 / kcal) * 100) : 0;
          var balans = computeBalance(khPct, eiwitPct, vetPct);
          var dishMealType = mealTypesSel.indexOf(d.mealType) > -1 ? d.mealType : mealTypesSel[idx % mealTypesSel.length];
          var steps = Array.isArray(d.steps) ? d.steps.map(function (s) {
            var st = { title: String(s.title || "Stap"), content: String(s.content || "") };
            if (s.timer_seconds) st.timer = Number(s.timer_seconds);
            return st;
          }) : [{ title: "Bereiding", content: "Geen bereidingsstappen ontvangen." }];
          return {
            id: "gen" + Date.now() + "_" + idx,
            label: "Gerecht " + (idx + 1),
            name: String(d.name || "Naamloos gerecht"),
            kcal: kcal, kh: khPct, eiwit: eiwitPct, vet: vetPct, balans: balans,
            khG: khG, eiwitG: eiwitG, vetG: vetG,
            bereidingstijd: Number(d.bereidingstijd_minuten) || 0,
            fotoZoekterm: String(d.foto_zoekterm || "").trim().slice(0, 80),
            mealType: dishMealType,
            benodigdheden: String(d.benodigdheden || ""),
            ingredienten: Array.isArray(d.ingredienten) ? d.ingredienten.map(String) : [],
            steps: steps,
            profile: currentProfileSnapshot()
          };
        });

        var imgStart = Date.now();
        if (withImages) {
          busyEnd();
          busyStart("Afbeeldingen worden opgehaald…");
        }
        Promise.resolve(withImages ? Promise.all(days.map(fetchImageForDish)) : null).then(function () {
          if (withImages) recordImageTiming((Date.now() - imgStart) / 1000);
          stopGenTicker();
          busyEnd();
          addToCacheLibrary(days);
          persistDishesToDb(days);
          state.generating = false;
          var successMsg = days.length + (days.length === 1 ? " gerecht is" : " gerechten zijn") +
            " gegenereerd en toegevoegd aan de lijst met opgeslagen gerechten.";
          state.genSuccess = successMsg;
          showToast(successMsg);
          render();
        });
      }).catch(function (e) {
        state.generating = false;
        stopGenTicker();
        busyEnd();
        var msg = (e && e.code === "not_granted") ? "Je hebt genereren niet toegestaan voor deze pagina." :
                   (e && e.code === "rate_limited") ? "Even geduld, probeer over een moment opnieuw." :
                   "Genereren is niet gelukt. Probeer het nogmaals.";
        state.genError = msg;
        render();
      });
    });
  }

  function getMonday(d) {
    var date = new Date(d);
    date.setHours(0, 0, 0, 0);
    var day = date.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    return date;
  }

  function isoDateKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  var MONTHS_SHORT = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

  function formatWeekLabel(monday) {
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    if (monday.getMonth() === sunday.getMonth()) {
      return monday.getDate() + " – " + sunday.getDate() + " " + MONTHS_SHORT[monday.getMonth()] + " " + sunday.getFullYear();
    }

  var DAY_PRIORITY = ["Diner", "Lunch", "Ontbijt", "Snack na diner", "Snack na lunch", "Snack na ontbijt"];

  function primarySlotForDay(pw, d) {
    for (var i = 0; i < DAY_PRIORITY.length; i++) {
      var key = d + "|" + DAY_PRIORITY[i];
      if (pw.slots[key]) return { meal: DAY_PRIORITY[i], key: key, assigned: pw.slots[key] };
    }
    return null;
  }

  function aggregateDayMacros(pw, d) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_SLOTS.forEach(function (m) {
      var assigned = pw.slots[d + "|" + m];
      if (!assigned) return;
      var resolved = resolveAssignedDish(assigned);
      if (!resolved) return;
      var day = resolved.day;
      count++;
      totalKcal += day.kcal;
      totalKhG += (day.kh / 100 * day.kcal) / 4;
      totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
      totalVetG += (day.vet / 100 * day.kcal) / 9;
      totalBalans += day.balans;
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct,
      khG: Math.round(totalKhG), eiwitG: Math.round(totalEiwitG), vetG: Math.round(totalVetG),
      balans: Math.round(totalBalans / count), count: count };
  }

  function aggregateWeekMacros(pw) {
    var totalKcal = 0, totalKhG = 0, totalEiwitG = 0, totalVetG = 0, totalBalans = 0, count = 0;
    PLAN_DAYS.forEach(function (d) {
      PLAN_SLOTS.forEach(function (m) {
        var assigned = pw.slots[d + "|" + m];
        if (!assigned) return;
        var resolved = resolveAssignedDish(assigned);
        if (!resolved) return;
        var day = resolved.day;
        count++;
        totalKcal += day.kcal;
        totalKhG += (day.kh / 100 * day.kcal) / 4;
        totalEiwitG += (day.eiwit / 100 * day.kcal) / 4;
        totalVetG += (day.vet / 100 * day.kcal) / 9;
        totalBalans += day.balans;
      });
    });
    if (!count) return null;
    var khPct = totalKcal ? Math.round((totalKhG * 4 / totalKcal) * 100) : 0;
    var eiwitPct = totalKcal ? Math.round((totalEiwitG * 4 / totalKcal) * 100) : 0;
    var vetPct = totalKcal ? Math.round((totalVetG * 9 / totalKcal) * 100) : 0;
    return { kcal: Math.round(totalKcal), kh: khPct, eiwit: eiwitPct, vet: vetPct,
      khG: Math.round(totalKhG), eiwitG: Math.round(totalEiwitG), vetG: Math.round(totalVetG),
      balans: Math.round(totalBalans / count), count: count };
  }

  var UNIT_ALIASES = {
    "gram": "g", "grams": "g", "g": "g",
    "kilogram": "kg", "kg": "kg",
    "milliliter": "ml", "ml": "ml",
    "liter": "l", "l": "l",
    "eetlepel": "el", "eetlepels": "el", "el": "el",
    "theelepel": "tl", "theelepels": "tl", "tl": "tl",
    "stuk": "stuks", "stuks": "stuks",
    "teentje": "teentjes", "teentjes": "teentjes", "teen": "teentjes", "tenen": "teentjes",
    "blikje": "blikjes", "blikjes": "blikjes",
    "plakje": "plakjes", "plakjes": "plakjes",
    "snee": "sneetjes", "sneetjes": "sneetjes"
  };

  var UNICODE_FRACTIONS = { "½": 0.5, "⅓": 1 / 3, "⅔": 2 / 3, "¼": 0.25, "¾": 0.75, "⅕": 0.2, "⅛": 0.125, "⅜": 0.375, "⅝": 0.625, "⅞": 0.875 };

  function finishParsedIngredient(amount, rawUnitToken, restText) {
    var rawUnit = (rawUnitToken || "").toLowerCase();
    var unit = UNIT_ALIASES[rawUnit] || "";
    var rest = unit ? restText : ((rawUnitToken ? rawUnitToken + " " : "") + restText);
    rest = rest.replace(/\s+([,.;:])/g, "$1").trim();
    if (!rest) return null;
    return { amount: amount, unit: unit, name: rest };
  }

  function parseIngredientLine(raw) {
    var s = raw.trim();

    var halfWord = s.match(/^(?:halve|half)\s+(.*)$/i);
    if (halfWord) {
      var result = finishParsedIngredient(0.5, null, halfWord[1]);
      if (result) return result;
    }

    var mixedFrac = s.match(/^(\d+\s+)?(\d+)\/(\d+)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (mixedFrac) {
      var whole = mixedFrac[1] ? parseInt(mixedFrac[1], 10) : 0;
      var num = parseInt(mixedFrac[2], 10);
      var den = parseInt(mixedFrac[3], 10);
      if (den) {
        var fracAmount = whole + num / den;
        var fracResult = finishParsedIngredient(fracAmount, mixedFrac[4], mixedFrac[5]);
        if (fracResult) return fracResult;
      }
    }

    var uniFracKeys = Object.keys(UNICODE_FRACTIONS).join("");
    var uniFracRe = new RegExp("^(\\d+\\s*)?([" + uniFracKeys + "])\\s*([a-zA-Zàéèëï]+)?\\s*(.*)$");
    var uniFrac = s.match(uniFracRe);
    if (uniFrac) {
      var uniWhole = uniFrac[1] ? parseInt(uniFrac[1], 10) : 0;
      var uniAmount = uniWhole + UNICODE_FRACTIONS[uniFrac[2]];
      var uniResult = finishParsedIngredient(uniAmount, uniFrac[3], uniFrac[4]);
      if (uniResult) return uniResult;
    }

    var m = s.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Zàéèëï]+)?\s*(.*)$/);
    if (m && m[1]) {
      var plainResult = finishParsedIngredient(parseFloat(m[1].replace(",", ".")), m[2], m[3]);
      if (plainResult) return plainResult;
    }

    return { amount: null, unit: "", name: raw.trim() };
  }

  function normalizeIngredientName(name) {
    return name.trim().toLowerCase().replace(/\s+/g, " ");
  }

  var PREP_DESCRIPTORS = [
    "in blokjes", "in reepjes", "in plakjes", "in ringen", "in parten", "in stukjes", "in stukken",
    "fijngehakt", "grofgehakt", "geraspt", "geschild", "gesneden", "fijngesneden",
    "gesnipperd", "gepeld", "ontpit", "ontveld", "uitgelekt", "verse", "vers"
  ];
  var SINGULAR_EXCEPTIONS = ["kaas", "ananas", "vlees", "ijs", "roomijs", "gehakt", "sla", "rijst", "glas", "kokos", "hummus", "mayonaise", "peen"];
  var NAME_ALIASES = {
    "knoflooktenen": "knoflook", "knoflookteentjes": "knoflook", "knoflookteentje": "knoflook", "knoflookteen": "knoflook",
    "knoflookteentje(s)": "knoflook", "teentjes knoflook": "knoflook", "tenen knoflook": "knoflook",
    "citroensap": "citroen", "citroenrasp": "citroen", "limoensap": "limoen"
  };

  function singularizeWord(word) {
    if (SINGULAR_EXCEPTIONS.indexOf(word) > -1) return word;
    if (/en$/.test(word) && word.length - 2 >= 2) return word.slice(0, -2);
    if (/s$/.test(word) && !/ss$/.test(word) && word.length - 1 >= 3) return word.slice(0, -1);
    return word;
  }

  function matchKeyForName(name) {
    var s = name.toLowerCase().trim();
    s = s.split(",")[0].trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    s = " " + s + " ";
    PREP_DESCRIPTORS.forEach(function (d) {
      var re = new RegExp("\\b" + d.replace(/\s+/g, "\\s+") + "\\b", "g");
      s = s.replace(re, " ");
    });
    s = s.replace(/\s+/g, " ").trim();
    if (!s) s = name.toLowerCase().trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    return s.split(" ").map(singularizeWord).join(" ");
  }

  function formatAmount(n) {
    var rounded = Math.round(n * 100) / 100;
    return rounded % 1 === 0 ? String(rounded) : String(rounded.toFixed(2)).replace(/0+$/, "").replace(/\.$/, "");
  }

  var UNIT_CONVERSION = {
    g: { factor: 1, family: "weight" },
    kg: { factor: 1000, family: "weight" },
    ml: { factor: 1, family: "volume" },
    l: { factor: 1000, family: "volume" },
    tl: { factor: 5, family: "volume" },
    el: { factor: 15, family: "volume" }
  };

  function humanizeWeight(g) {
    if (g >= 1000) return formatAmount(g / 1000) + " kg";
    return formatAmount(g) + " g";
  }
  function humanizeVolume(ml, hadBulkUnit) {
    if (hadBulkUnit || ml >= 200) {
      if (ml >= 1000) return formatAmount(ml / 1000) + " l";
      return formatAmount(ml) + " ml";
    }
    if (ml >= 15) return formatAmount(Math.round((ml / 15) * 2) / 2) + " el";
    return formatAmount(Math.round((ml / 5) * 2) / 2) + " tl";
  }

  var CATEGORY_ORDER = ["Groente & Fruit", "Brood & Granen", "Vlees, Vis & Kip", "Zuivel & Eieren", "Kruiden & Sausen", "Noten & Zaden", "Overige"];

  var CATEGORY_OVERRIDES = {

  // Hoe een ingrediënt in een categorie komt:
  //  1. Alleen het hoofdingrediënt telt: het deel vóór "met", "in", "op", "uit", een komma of een haakje.
  //     ("zalmfilet met citroen" is vis, geen fruit.) Vindt dat deel niets, dan kijken we naar de hele tekst.
  //  2. Het langste (meest specifieke) trefwoord wint, ongeacht de categorie. ("knoflookpoeder" is een
  //     kruid, ook al staat "knoflook" bij de groente; "slagroom" is zuivel, ook al begint het met "sla".)
  //  3. Korte woorden (tot 3 letters, plus "olie") tellen alleen als heel woord, met eventueel een
  //     meervoud- of verkleinvorm. Zo telt "ui" wel in "uien" maar niet in "suiker", "bouillon" of "kruiden",
  //     en "ham" wel als ham maar niet in "boterham". "kip" en "vis" mogen ook begin van een samenstelling zijn.
  var CATEGORY_PREFIX_OK = { "kip": true, "vis": true };
  var CATEGORY_STRICT_EXTRA = { "olie": true };
  var CATEGORY_SUFFIXES = ["", "en", "s", "je", "jes", "tje", "tjes"];
  function categoryKeywordMatches(keyword, text, tokens) {
    if (keyword.length <= 3 || CATEGORY_STRICT_EXTRA[keyword]) {
      for (var t = 0; t < tokens.length; t++) {
        var tok = tokens[t];
        if (tok.indexOf(keyword) !== 0) continue;
        if (CATEGORY_PREFIX_OK[keyword] || CATEGORY_SUFFIXES.indexOf(tok.slice(keyword.length)) > -1) return true;
      }
      return false;
    }
    return text.indexOf(keyword) > -1;
  }
  function bestCategoryFor(text) {
    var tokens = text.split(/[^a-z\u00e0-\u00ff]+/).filter(Boolean);
    var best = null, bestLen = 0;
    CATEGORY_KEYWORDS.forEach(function (cat) {
      cat.keywords.forEach(function (kw) {
        if (kw.length > bestLen && categoryKeywordMatches(kw, text, tokens)) { best = cat.label; bestLen = kw.length; }
      });
    });
    return best;
  }
  function categorizeIngredient(name) {
    var lower = String(name).toLowerCase().trim();
    for (var key in CATEGORY_OVERRIDES) {
      if (lower.indexOf(key) > -1) return CATEGORY_OVERRIDES[key];
    }
    var cut = lower.search(/\s(?:met|in|op|uit|zonder|voor|om)\s|[,(;:]/);
    var head = cut > 0 ? lower.slice(0, cut) : lower;
    return bestCategoryFor(head) || (head !== lower ? bestCategoryFor(lower) : null) || "Overige";
  }

  function scaleIngredientText(raw, multiplier) {
    if (!multiplier || multiplier === 1) return raw;
    var parsed = parseIngredientLine(raw);
    if (parsed.amount === null) return raw + " (x" + multiplier + ")";
    var scaled = parsed.amount * multiplier;
    var amtText = parsed.unit ? formatAmount(scaled) + " " + parsed.unit : formatAmount(scaled) + "x";
    return amtText + " " + parsed.name;
  }

  var TAP_WATER_NAMES = ["water", "kraanwater", "koud water", "warm water", "heet water", "lauw water"];
  function isTapWater(name) {

  }

  function buildAggregatedShoppingList(entries) {
    var groups = {};
    var order = [];
    entries.forEach(function (entry) {
      var multiplier = entry.servings || 1;
      entry.day.ingredienten.forEach(function (raw) {
        var parsed = parseIngredientLine(raw);
        if (isTapWater(parsed.name)) return;
        var matchKey = matchKeyForName(parsed.name);
        var conv = UNIT_CONVERSION[parsed.unit];
        var groupUnit = conv ? conv.family : parsed.unit;
        var key = groupUnit + "|" + matchKey;
        if (!groups[key]) {
          groups[key] = { amount: 0, family: conv ? conv.family : null, rawUnit: parsed.unit, hadBulkUnit: false, names: [], hasAmount: false, raws: [] };
          order.push(key);
        }
        var g = groups[key];
        g.raws.push(raw);
        g.names.push(parsed.name);
        if (parsed.amount !== null) {
          g.amount += (conv ? parsed.amount * conv.factor : parsed.amount) * multiplier;
          g.hasAmount = true;
          if (parsed.unit === "ml" || parsed.unit === "l") g.hadBulkUnit = true;
        }
      });
    });

    var byCategory = {};
    CATEGORY_ORDER.forEach(function (c) { byCategory[c] = []; });
    order.forEach(function (key) {
      var g = groups[key];
      var displayName = g.names.reduce(function (shortest, n) { return n.length < shortest.length ? n : shortest; }, g.names[0]);
      var text;
      if (g.hasAmount) {
        var amtText;
        if (g.family === "weight") amtText = humanizeWeight(g.amount);
        else if (g.family === "volume") amtText = humanizeVolume(g.amount, g.hadBulkUnit);
        else amtText = formatAmount(g.amount) + (g.rawUnit ? " " + g.rawUnit : "x");
        text = amtText + " " + displayName;
      } else {
        text = g.raws[0];
      }
      var cat = categorizeIngredient(displayName);
      byCategory[cat].push({ key: key, text: text, name: displayName, spec: g.hasAmount ? amtText : "" });
    });
    return byCategory;
  }

  function estimateShoppingPrices(itemTexts) {
    var uncached = [];
    itemTexts.forEach(function (t) { if (!priceCache[t] && uncached.indexOf(t) === -1) uncached.push(t); });
    if (!uncached.length) return;
    shoppingPriceLoading = true;
    shoppingPriceError = null;
    render();
    claude.use("sample").then(function (sample) {
      if (!sample) {
        shoppingPriceLoading = false;
        shoppingPriceError = "Prijsschatting is in deze weergave niet beschikbaar.";
        render();
        return;
      }
      sample.json({ action: "price", items: uncached }, { modelTier: "default" }).then(function (result) {
        var arr = extractDishArray(result);
        if (arr) {
          uncached.forEach(function (t, i) {
            var p = arr[i];
            if (p && typeof p.laag === "number" && typeof p.hoog === "number") {
              priceCache[t] = { laag: p.laag, hoog: p.hoog };
            }
          });
        }
        shoppingPriceLoading = false;
        if (!arr) shoppingPriceError = "Kon geen prijzen ophalen — probeer opnieuw.";
        render();
      }).catch(function (e) {
        shoppingPriceLoading = false;
        // Alleen onze eigen (Nederlandse) limietmeldingen tonen, geen technische details.
        shoppingPriceError = "Prijsschatting mislukt" + ((e && e.code === "rate_limited" && e.message) ? ": " + e.message : "") + " — probeer opnieuw.";
        render();
      });
    });
  }

  function formatEuro(n) {

  // ---------- Boodschappenlijst delen (WhatsApp) en samen afvinken ----------
  // Delen maakt op de server een momentopname met een eigen link (/l/<code>). Wie de link opent, kan
  // per product "in mandje" of "niet nodig" aanvinken. Zolang een lijst gedeeld is, toont het
  // boodschappenscherm hier (bij "Per week") dezelfde live stand als de gedeelde pagina: vinkjes van
  // de ander verschijnen vanzelf, en jouw tikken gaan naar de ander. Deel je dezelfde lijst opnieuw,
  // dan wordt dezelfde link bijgewerkt, zodat een eerder verstuurde link blijft werken. Welke link bij
  // welke lijst hoort, onthouden we op dit apparaat.
  var SHARES_KEY = "weekmenu_shares";
  var SHARE_PENDING_KEY = "weekmenu_share_pending";
  var SHARE_POLL_MS = 8000;
  var SHARE_META_KEY = "weekmenu_share_meta";   // code -> { kind, refId, title, sig }: waaruit de lijst is opgebouwd
  var AUTO_SYNC_MS = 3000;                      // hoe vaak we kijken of het plan is veranderd
  var AUTO_SYNC_STABLE_MS = 5000;               // zo lang moet een wijziging ongemoeid blijven voordat we bijwerken
  var OWNER_FLAG_SECONDS = 300;                 // zo lang toont jouw scherm 'Nieuw' / 'Aangepast' bij een product
  var autoSyncTimer = null;
  var autoSyncRt = {};                          // code -> { pendingSig, since, sending, retryAt }
  var sharedLive = {};           // code -> live stand: { loaded, gone, items, order, state, rev, pending, online, ... }
  var shareDrifting = {};        // code -> true als de lijst in de app afwijkt van wat gedeeld is

  var shareStatusToken = null;

  function loadShares() {
    try { return JSON.parse(localStorage.getItem(SHARES_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveShares(map) {
    try { localStorage.setItem(SHARES_KEY, JSON.stringify(map)); } catch (e) {}
  }
  function shareKeyFor(title) { return state.view + "|" + title; }
  function onShoppingView() { return state.view === "shopping" || state.view === "planshopping"; }

  function shareSlug(text) {
    var s = String(text).toLowerCase();
    try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
    return s.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);
  }

  // Kent elk product uit de samengevoegde lijst een vaste id toe. De id is afgeleid van het product zelf
  // (niet van de hoeveelheid), zodat vinkjes blijven staan als de lijst later wordt bijgewerkt.
  function assignShareIds(byCat) {
    var items = [], idByKey = {}, used = {};
    CATEGORY_ORDER.forEach(function (cat) {
      byCat[cat].forEach(function (item) {
        var base = shareSlug(item.key) || "product";
        var id = base, n = 2;
        while (used[id]) { id = base + "-" + n; n++; }
        used[id] = true;
        idByKey[item.key] = id;
        items.push({ id: id, cat: cat, text: item.text, key: item.key, name: item.name, spec: item.spec });
      });
    });
    return { items: items, idByKey: idByKey };
  }

  // ---------- "Niet nodig": producten uitsluiten (altijd beschikbaar, ook zonder delen) ----------
  // Per lijst (scherm + titel) onthouden we welke producten je niet nodig hebt, op dit apparaat. Zulke producten
  // tellen niet mee bij delen (staan daar als "niet nodig"), tekst, PDF, de Bring!-import en de kostenschatting.
  // Is de lijst gedeeld, dan geldt de gedeelde stand en wordt die hier gespiegeld, zodat het ook klopt als je
  // later stopt met delen.
  var SKIPPED_KEY = "weekmenu_skipped";
  var SKIPPED_MAX_LISTS = 40;
  var skippedByList = null;
  function loadSkippedAll() {
    if (skippedByList) return skippedByList;
    try { skippedByList = JSON.parse(localStorage.getItem(SKIPPED_KEY) || "{}") || {}; } catch (e) { skippedByList = {}; }
    if (typeof skippedByList !== "object" || Array.isArray(skippedByList)) skippedByList = {};
    return skippedByList;
  }
  function saveSkippedAll() {
    try {
      var all = loadSkippedAll(), keys = Object.keys(all);

    } catch (e) {}

  function isSkipped(listKey, key) {

  function setSkipped(listKey, key, on) {
    var all = loadSkippedAll();
    var arr = Array.isArray(all[listKey]) ? all[listKey] : [];
    var i = arr.indexOf(key);
    if (on && i === -1) arr.push(key);
    else if (!on && i > -1) arr.splice(i, 1);
    else return;                                                   // niets veranderd: niets bewaren
    delete all[listKey];
    if (arr.length) all[listKey] = arr;                             // (opnieuw) achteraan: de nieuwste lijsten blijven bewaard
    saveSkippedAll();

  function clearSkipped(listKey) {

  function localItemStatus(listKey, key) { return isSkipped(listKey, key) ? "skip" : (shoppingChecked[key] ? "basket" : null); }
  function toggleLocalBasket(listKey, key) {
    if (isSkipped(listKey, key)) { setSkipped(listKey, key, false); shoppingChecked[key] = true; }
    else shoppingChecked[key] = !shoppingChecked[key];
  }
  function toggleLocalSkip(listKey, key) {
    if (isSkipped(listKey, key)) setSkipped(listKey, key, false);
    else { setSkipped(listKey, key, true); shoppingChecked[key] = false; }
  }
  // Dezelfde sleutel als in de samengevoegde lijst, zodat "niet nodig" in de dagweergave voor het hele product geldt.
  function aggKeyForLine(raw) {
    var p = parseIngredientLine(raw);
    var conv = UNIT_CONVERSION[p.unit];
    return (conv ? conv.family : p.unit) + "|" + matchKeyForName(p.name);
  }
  function listKeyFor(kind, title) { return (kind === "plan" ? "planshopping" : "shopping") + "|" + title; }
  // Id van het product op de gedeelde lijst, alleen als die lijst geladen is en het product er echt op staat.
  function syncedIdFor(shareInfo, live, key) {

  function buildShareItems(entries, listKey) {
    var info = assignShareIds(buildAggregatedShoppingList(entries));
    var initial = {};
    info.items.forEach(function (it) {

      else if (shoppingChecked[it.key]) initial[it.id] = "basket";
    });
    return {
      items: info.items.map(function (it) { return { id: it.id, cat: it.cat, text: it.text, name: it.name, spec: it.spec }; }),
      state: initial
