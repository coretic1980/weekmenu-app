  .price-amount { font-family: "Fraunces", serif; font-size: 34px; margin: 10px 0 4px; }
  .price-amount span { font-family: "Public Sans", sans-serif; font-size: 14px; font-weight: 500; color: var(--muted); }
  .price-list { list-style: none; margin: 16px 0 0; padding: 0; font-size: 14.5px; color: var(--muted); }

  .foot-row a { text-decoration: underline; }
</style>
